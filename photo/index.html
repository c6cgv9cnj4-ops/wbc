        // 2地点間の直線距離計算（Haversine formula）[km]
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球の半径 km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 初期化処理：北本市からの距離を計算して並び替え
        function processAndSortSpots() {
            spotsData.forEach(spot => {
                const distLinear = calculateDistance(KITAMOTO_LAT, KITAMOTO_LNG, spot.lat, spot.lng);
                spot.distanceLinear = distLinear;
                // 道路走行距離の近似（直線距離の約1.3倍で算出）
                spot.distanceRoad = distLinear * 1.3;
            });

            // 北本市から近い順（昇順）に自動ソート
            spotsData.sort((a, b) => a.distanceLinear - b.distanceLinear);
        }

        // 外部状況（スクレイピング/Fetch）シミュレーション & ダイレクトアクセス
        async function fetchLiveStatus(spotId, statusUrl) {
            const statusElement = document.getElementById(`status-text-${spotId}`);
            if (!statusElement) return;

            statusElement.innerHTML = `<span class="text-amber-400 animate-pulse">現地の最新情報を確認中...</span>`;

            try {
                // alloriginsプロキシを経由してリアルタイムアクセス確認（Fetch）
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(statusUrl)}`;
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    statusElement.innerHTML = `
                        <span class="text-emerald-400 font-semibold flex items-center gap-1">
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> 自治体/公式発信元へ動的接続可能
                        </span>
                        <a href="${statusUrl}" target="_blank" rel="noopener noreferrer" class="inline-block mt-1 text-xs text-sky-400 hover:underline">
                            👉 最新の開花・見頃状況（直リンク）を開く
                        </a>
                    `;
                } else {
                    throw new Error('Response not ok');
                }
            } catch (err) {
                statusElement.innerHTML = `
                    <span class="text-slate-300">開花・施設最新情報:</span>
                    <a href="${statusUrl}" target="_blank" rel="noopener noreferrer" class="ml-1 text-sky-400 font-medium hover:underline inline-flex items-center gap-0.5">
                        公式速報ページ直行リンク <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                `;
            }
            lucide.createIcons();
        }

        // レンダリング関数

            const container = document.getElementById('spotList');

                const matchQuery = spot.name.toLowerCase().includes(searchQuery) ||
                                   spot.pref.toLowerCase().includes(searchQuery) ||
                                   spot.mainSubject.toLowerCase().includes(searchQuery);
                const matchPref = selectedPref === '' || spot.pref === selectedPref;
                return matchQuery && matchPref;
            });

            document.getElementById('spotCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800 rounded-xl p-8 text-center text-slate-400 border border-slate-700">

                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">

                               class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-lg shadow flex items-center justify-center gap-2 text-sm transition">

                        </div>

                    <div class="p-5 space-y-6">

                        <!-- Gantt Chart: Flora Season (1-12月) -->
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                <i data-lucide="flower-2" class="w-4 h-4 text-emerald-400"></i> 1月〜12月 植物・被写体の「旬（見頃）」マトリクス
                            </h3>
                            <div class="overflow-x-auto">
                                <table class="w-full border-collapse">
                                    <tbody>
                                        <tr>${ganttCellsHtml}</tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Sunlight Matrix (1-12月) -->
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                <i data-lucide="sun" class="w-4 h-4 text-amber-400"></i> 1月〜12月 建物・構造物の太陽光「順光・最適時間帯」予測
                            </h3>
                            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-12 gap-1.5">
                                ${sunlightRowsHtml}
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);

                // Fetchによる現況リンク更新シミュレーションの起動
                fetchLiveStatus(spot.id, spot.statusUrl);
            });

            lucide.createIcons();
        }

        // イベントリスナー設定
        document.getElementById('searchInput').addEventListener('input', renderSpots);
        document.getElementById('prefFilter').addEventListener('change', renderSpots);

        // アプリケーション開始
        window.addEventListener('DOMContentLoaded', () => {
            processAndSortSpots();
            renderSpots();
        });
    </script>
