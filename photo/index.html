        // 2地点間の直線距離計算（Haversine formula）[km]
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半径
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 初期化：北本駅からの距離を計算して近い順に自動ソート
        function processAndSortSpots() {
            spotsData.forEach(spot => {
                const distLinear = calculateDistance(KITAMOTO_LAT, KITAMOTO_LNG, spot.lat, spot.lng);
                spot.distanceLinear = distLinear;
                spot.distanceRoad = distLinear * 1.3; // 想定道路走行距離
            });

            // 北本市から近い順（昇順）にソート
            spotsData.sort((a, b) => a.distanceLinear - b.distanceLinear);
        }

                            <div><strong class="text-amber-400">対象構造物・シンボル:</strong> <span class="text-slate-200">${spot.structure}</span></div>
                        </div>

                        <!-- Gantt Chart: Flora Season (横スクロール対応) -->
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                <i data-lucide="flower-2" class="w-3.5 h-3.5 text-emerald-400"></i> 1月〜12月 植物・自然現象の「旬（見頃）」マトリクス
                            </h3>
                            <div class="overflow-x-auto custom-scrollbar rounded-lg border border-slate-700/80 bg-slate-900/60 flex">
                                ${ganttCellsHtml}
                            </div>
                        </div>

                        <!-- Sunlight Matrix (スマホ対応レスポンシブ・グリッド) -->
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-400"></i> 1月〜12月 建物・構造物の太陽光「順光・推奨時間帯」
                            </h3>
                            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-12 gap-1.5">
                                ${sunlightRowsHtml}
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        // イベントリスナー設定
        document.getElementById('searchInput').addEventListener('input', renderSpots);
        document.getElementById('prefFilter').addEventListener('change', renderSpots);
        document.getElementById('monthFilter').addEventListener('change', renderSpots);

        // 初期実行
        window.addEventListener('DOMContentLoaded', () => {
            processAndSortSpots();
            renderSpots();
        });
    </script>
</body>
</html>
