<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maintenance & Fuel Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (SF Pro類似・Apple風フォント設定) -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .apple-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(210, 210, 215, 0.5);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-50 apple-card border-b border-gray-200/60">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-car-side text-sm"></i>
                </div>
                <h1 class="text-base font-semibold tracking-tight text-gray-900">日産 ノート E11 管理</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openCarModal()" class="text-xs bg-gray-200/70 hover:bg-gray-300 text-gray-700 font-medium px-3 py-1.5 rounded-full transition">
                    <i class="fa-solid fa-gear"></i> 車両設定
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- ★最重要：時期が来たリマインダーが一番上に目立って表示されるエリア -->
        <div id="urgentAlertContainer" class="space-y-3 hidden">
            <!-- JSで動的に挿入 -->
        </div>

        <!-- 車両サマリー（Apple風タイル） -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div class="apple-card p-4 rounded-2xl shadow-xs">
                <div class="text-[11px] font-medium text-gray-500 mb-1">現在の総走行距離</div>
                <div class="text-xl font-bold tracking-tight text-gray-900"><span id="summaryOdometer">0</span> <span class="text-xs font-normal text-gray-500">km</span></div>
            </div>
            <div class="apple-card p-4 rounded-2xl shadow-xs">
                <div class="text-[11px] font-medium text-gray-500 mb-1">直近の実燃費</div>
                <div class="text-xl font-bold tracking-tight text-blue-600"><span id="summaryFuelEff">0.0</span> <span class="text-xs font-normal text-gray-500">km/L</span></div>
            </div>
            <div class="apple-card p-4 rounded-2xl shadow-xs col-span-2 sm:col-span-1">
                <div class="text-[11px] font-medium text-gray-500 mb-1">累計維持費合計</div>
                <div class="text-xl font-bold tracking-tight text-gray-900"><span id="summaryTotalCost">0</span> <span class="text-xs font-normal text-gray-500">円</span></div>
            </div>
        </div>

        <!-- 4つの管理セクション（指定レイアウト：1.ガソリン 2.空気圧 3.エンジンオイル 4.車検） -->
        <div class="space-y-4">

            <!-- 1. ガソリンセクション -->
            <section class="apple-card rounded-2xl p-5 shadow-xs transition hover:shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center">
                            <i class="fa-solid fa-gas-pump text-base"></i>
                        </div>
                        <div>
                            <h2 class="font-semibold text-gray-900 text-base">ガソリン・給油記録</h2>
                            <p class="text-xs text-gray-500">単価・給油量から燃費を自動算出</p>
                        </div>
                    </div>
                    <button onclick="openModal('fuel')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3.5 py-2 rounded-full transition shadow-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 記録する
                    </button>
                </div>
                <div id="fuelList" class="space-y-2 mt-3"></div>
            </section>

            <!-- 2. タイヤ空気圧セクション -->
            <section class="apple-card rounded-2xl p-5 shadow-xs transition hover:shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-sky-500/10 text-sky-600 flex items-center justify-center">
                            <i class="fa-solid fa-gauge text-base"></i>
                        </div>
                        <div>
                            <h2 class="font-semibold text-gray-900 text-base">タイヤの空気圧</h2>
                            <p class="text-xs text-gray-500">目安：月1回 / 夏冬の変わり目</p>
                        </div>
                    </div>
                    <button onclick="openModal('pressure')" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium px-3.5 py-2 rounded-full transition shadow-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 点検を記録
                    </button>
                </div>
                <!-- 空気圧リマインダーカード情報 -->
                <div id="pressureStatusCard" class="mb-3"></div>
                <div id="pressureList" class="space-y-2"></div>
            </section>

            <!-- 3. エンジンオイルセクション -->
            <section class="apple-card rounded-2xl p-5 shadow-xs transition hover:shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center">
                            <i class="fa-solid fa-oil-can text-base"></i>
                        </div>
                        <div>
                            <h2 class="font-semibold text-gray-900 text-base">エンジンオイル</h2>
                            <p class="text-xs text-gray-500">目安：5,000km または 半年</p>
                        </div>
                    </div>
                    <button onclick="openModal('oil')" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium px-3.5 py-2 rounded-full transition shadow-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 交換を記録
                    </button>
                </div>
                <div id="oilStatusCard" class="mb-3"></div>
                <div id="oilList" class="space-y-2"></div>
            </section>

            <!-- 4. 車検セクション（一番下） -->
            <section class="apple-card rounded-2xl p-5 shadow-xs transition hover:shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-purple-500/10 text-purple-600 flex items-center justify-center">
                            <i class="fa-solid fa-shield-halved text-base"></i>
                        </div>
                        <div>
                            <h2 class="font-semibold text-gray-900 text-base">車検記録 & 割引リマインダー</h2>
                            <p class="text-xs text-gray-500">2年に1回（3ヶ月前からの早期予約割引に対応）</p>
                        </div>
                    </div>
                    <button onclick="openModal('inspection')" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-medium px-3.5 py-2 rounded-full transition shadow-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 車検を記録
                    </button>
                </div>
                <div id="inspectionStatusCard" class="mb-3"></div>
                <div id="inspectionList" class="space-y-2"></div>
            </section>

        </div>

        <!-- データバックアップ・初期化 -->
        <div class="flex justify-between items-center pt-4 text-xs text-gray-500">
            <button onclick="exportData()" class="hover:underline flex items-center gap-1"><i class="fa-solid fa-download"></i> バックアップ保存</button>
            <button onclick="resetData()" class="text-red-500 hover:underline">データを初期化</button>
        </div>

    </main>

    <!-- 各種モーダル -->
    <!-- 1. 給油モーダル -->
    <div id="fuelModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 class="font-semibold text-base text-gray-900 flex items-center gap-2"><i class="fa-solid fa-gas-pump text-emerald-600"></i> 給油記録の追加</h3>
            <form onsubmit="saveFuel(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-600 mb-1">実施日</label>
                    <input type="date" id="fuelDate" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">給油時の総走行距離 (km)</label>
                    <input type="number" id="fuelMileage" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-gray-600 mb-1">給油量 (L)</label>
                        <input type="number" step="0.01" id="fuelAmount" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-600 mb-1">単価 (円/L)</label>
                        <input type="number" id="fuelPrice" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('fuel')" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-medium">キャンセル</button>
                    <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-medium shadow-xs">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 空気圧モーダル -->
    <div id="pressureModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 class="font-semibold text-base text-gray-900 flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-600"></i> タイヤ空気圧点検の記録</h3>
            <form onsubmit="savePressure(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-600 mb-1">実施日</label>
                    <input type="date" id="pressureDate" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">作業時走行距離 (km)</label>
                    <input type="number" id="pressureMileage" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">費用 (円) ※調整のみなら0円</label>
                    <input type="number" id="pressureCost" value="0" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">メモ</label>
                    <input type="text" id="pressureMemo" placeholder="前 2.3 / 後 2.2 調整完了" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('pressure')" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-medium">キャンセル</button>
                    <button type="submit" class="bg-sky-600 text-white px-5 py-2 rounded-xl font-medium shadow-xs">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. エンジンオイルモーダル -->
    <div id="oilModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 class="font-semibold text-base text-gray-900 flex items-center gap-2"><i class="fa-solid fa-oil-can text-amber-600"></i> エンジンオイル交換の記録</h3>
            <form onsubmit="saveOil(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-600 mb-1">実施日</label>
                    <input type="date" id="oilDate" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">交換時走行距離 (km)</label>
                    <input type="number" id="oilMileage" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">費用 (円)</label>
                    <input type="number" id="oilCost" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">メモ (粘度・エレメント同時交換など)</label>
                    <input type="text" id="oilMemo" placeholder="5W-30, エレメント同時交換" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('oil')" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-medium">キャンセル</button>
                    <button type="submit" class="bg-amber-600 text-white px-5 py-2 rounded-xl font-medium shadow-xs">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 4. 車検モーダル -->
    <div id="inspectionModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 class="font-semibold text-base text-gray-900 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-purple-600"></i> 車検記録の追加</h3>
            <form onsubmit="saveInspection(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-600 mb-1">車検実施日</label>
                    <input type="date" id="inspDate" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">実施時走行距離 (km)</label>
                    <input type="number" id="inspMileage" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">車検費用合計 (円)</label>
                    <input type="number" id="inspCost" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block font-medium text-gray-600 mb-1">メモ</label>
                    <input type="text" id="inspMemo" placeholder="ディーラー車検 早期割引適用" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('inspection')" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-medium">キャンセル</button>
                    <button type="submit" class="bg-purple-600 text-white px-5 py-2 rounded-xl font-medium shadow-xs">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 車両設定モーダル -->
    <div id="carModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 class="font-semibold text-base text-gray-900">車両基本設定</h3>
            <form onsubmit="saveCar(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-600 mb-1">現在の総走行距離 (km)</label>
                    <input type="number" id="carOdometer" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('car')" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-medium">キャンセル</button>
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-medium shadow-xs">更新する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        // 初期データ（サンプル）
        let appData = JSON.parse(localStorage.getItem('nissan_note_data')) || {
            odometer: 78500,
            fuels: [
                { id: 1, date: "2026-07-10", mileage: 77800, amount: 35.5, price: 168, cost: 5964, efficiency: 12.5 }
            ],
            pressures: [
                { id: 1, date: "2026-07-01", mileage: 77600, cost: 0, memo: "夏前空気圧調整" }
            ],
            oils: [
                { id: 1, date: "2026-04-15", mileage: 74000, cost: 6500, memo: "5W-30 エレメント交換" }
            ],
            inspections: [
                { id: 1, date: "2024-08-20", mileage: 60000, cost: 78000, memo: "前回車検" }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            render();
            // 日付の初期値を今日に
            const today = new Date().toISOString().slice(0,10);
            ['fuelDate', 'pressureDate', 'oilDate', 'inspDate'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = today;
            });
        });

        function saveData() {
            localStorage.setItem('nissan_note_data', JSON.stringify(appData));
        }

        function render() {
            saveData();

            // 1. サマリー計算
            const latestFuel = appData.fuels.sort((a,b) => b.mileage - a.mileage)[0];
            const lastEff = latestFuel && latestFuel.efficiency ? latestFuel.efficiency : 0.0;
            const totalFuelCost = appData.fuels.reduce((s,r) => s + r.cost, 0);
            const totalPressCost = appData.pressures.reduce((s,r) => s + r.cost, 0);
            const totalOilCost = appData.oils.reduce((s,r) => s + r.cost, 0);
            const totalInspCost = appData.inspections.reduce((s,r) => s + r.cost, 0);
            const totalCost = totalFuelCost + totalPressCost + totalOilCost + totalInspCost;

            document.getElementById('summaryOdometer').textContent = Number(appData.odometer).toLocaleString();
            document.getElementById('summaryFuelEff').textContent = lastEff;
            document.getElementById('summaryTotalCost').textContent = totalCost.toLocaleString();

            // 2. リスト描画
            renderFuels();
            renderPressures();
            renderOils();
            renderInspections();

            // 3. 上部「時期が来たら目立つリマインダー」の判定・生成
            renderUrgentAlerts();
        }

        // --- 描画個別関数 ---
        function renderFuels() {
            const container = document.getElementById('fuelList');
            if(appData.fuels.length === 0) {
                container.innerHTML = `<div class="text-xs text-gray-400 py-2">記録がありません</div>`;
                return;
            }
            container.innerHTML = appData.fuels.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => `
                <div class="bg-gray-50/80 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-medium text-gray-900">${r.date} | <b>${r.amount}L</b> (${r.price}円/L)</div>
                        <div class="text-gray-500">${Number(r.mileage).toLocaleString()} km ${r.efficiency ? `| <span class="text-blue-600 font-bold">${r.efficiency} km/L</span>` : ''}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-900">${r.cost.toLocaleString()}円</span>
                        <button onclick="deleteRecord('fuels', ${r.id})" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderPressures() {
            const container = document.getElementById('pressureList');
            const statusContainer = document.getElementById('pressureStatusCard');
            
            // 空気圧リマインダー判定 (前回から1ヶ月以上経過、または距離1,000km以上)
            const last = appData.pressures.sort((a,b) => new Date(b.date) - new Date(a.date))[0];
            let isAlert = false;
            let msg = "正常：定期的にチェックされています";
            if(!last) {
                isAlert = true;
                msg = "空気圧の記録がありません。月1回の点検をしましょう。";
            } else {
                const diffDays = (new Date() - new Date(last.date)) / (1000 * 60 * 60 * 24);
                if(diffDays >= 30) {
                    isAlert = true;
                    msg = `前回の点検から約 ${Math.floor(diffDays)}日経過しています。自然抜け対策に点検しましょう。`;
                }
            }

            statusContainer.innerHTML = `
                <div class="rounded-xl p-3 text-xs flex items-center justify-between ${isAlert ? 'bg-sky-50 border border-sky-200 text-sky-900' : 'bg-gray-50 text-gray-600'}">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${isAlert ? 'fa-triangle-exclamation text-sky-600 animate-pulse' : 'fa-circle-check text-emerald-500'}"></i>
                        <span>${msg}</span>
                    </div>
                    <span class="text-[10px] text-gray-500 font-medium">目安: 月1回</span>
                </div>
            `;

            container.innerHTML = appData.pressures.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => `
                <div class="bg-gray-50/80 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-medium text-gray-900">${r.date} | ${r.memo || '空気圧点検・調整'}</div>
                        <div class="text-gray-500">${Number(r.mileage).toLocaleString()} km</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-900">${r.cost.toLocaleString()}円</span>
                        <button onclick="deleteRecord('pressures', ${r.id})" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderOils() {
            const container = document.getElementById('oilList');
            const statusContainer = document.getElementById('oilStatusCard');

            const last = appData.oils.sort((a,b) => b.mileage - a.mileage)[0];
            let isAlert = false;
            let msg = "エンジンオイル良好";
            if(!last) {
                isAlert = true;
                msg = "オイル交換記録がありません。";
            } else {
                const distDiff = appData.odometer - last.mileage;
                const dateDiff = (new Date() - new Date(last.date)) / (1000 * 60 * 60 * 24);
                if(distDiff >= 5000 || dateDiff >= 180) {
                    isAlert = true;
                    msg = `前回交換から ${distDiff}km / ${Math.floor(dateDiff)}日経過。交換目安(5,000km/半年)に達しています。`;
                } else {
                    msg = `次回まであと約 ${5000 - distDiff} km`;
                }
            }

            statusContainer.innerHTML = `
                <div class="rounded-xl p-3 text-xs flex items-center justify-between ${isAlert ? 'bg-amber-50 border border-amber-200 text-amber-900' : 'bg-gray-50 text-gray-600'}">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${isAlert ? 'fa-triangle-exclamation text-amber-600 animate-pulse' : 'fa-circle-check text-emerald-500'}"></i>
                        <span>${msg}</span>
                    </div>
                    <span class="text-[10px] text-gray-500 font-medium">目安: 5,000km/半年</span>
                </div>
            `;

            container.innerHTML = appData.oils.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => `
                <div class="bg-gray-50/80 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-medium text-gray-900">${r.date} | ${r.memo || 'オイル交換'}</div>
                        <div class="text-gray-500">交換時: ${Number(r.mileage).toLocaleString()} km</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-900">${r.cost.toLocaleString()}円</span>
                        <button onclick="deleteRecord('oils', ${r.id})" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderInspections() {
            const container = document.getElementById('inspectionList');
            const statusContainer = document.getElementById('inspectionStatusCard');

            const last = appData.inspections.sort((a,b) => new Date(b.date) - new Date(a.date))[0];
            let isAlert = false;
            let msg = "車検時期はまだ先です";
            let isDiscountPeriod = false;

            if(!last) {
                isAlert = true;
                msg = "車検の記録がありません。車検日を登録してください。";
            } else {
                // 2年に1回（730日）
                const lastDate = new Date(last.date);
                const nextInspDate = new Date(lastDate);
                nextInspDate.setFullYear(lastDate.getFullYear() + 2);

                const today = new Date();
                const diffTime = nextInspDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                // 3ヶ月前（約90日前）から早期割引対象
                if(diffDays <= 90 && diffDays > 0) {
                    isAlert = true;
                    isDiscountPeriod = true;
                    msg = `【早期割引チャンス】車検満了まであと ${diffDays} 日！3ヶ月前予約の割引が適用できます。`;
                } else if(diffDays <= 0) {
                    isAlert = true;
                    msg = `【車検期限超過 / 間近】車検期限が近づいています/過ぎています！`;
                } else {
                    msg = `次回車検予定: ${nextInspDate.toISOString().slice(0,10)} (あと約 ${diffDays} 日)`;
                }
            }

            statusContainer.innerHTML = `
                <div class="rounded-xl p-3 text-xs flex items-center justify-between ${isDiscountPeriod ? 'bg-purple-100 border border-purple-300 text-purple-900 font-bold' : (isAlert ? 'bg-red-50 border border-red-200 text-red-900' : 'bg-gray-50 text-gray-600')}">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid ${isAlert ? 'fa-bell text-purple-600 animate-bounce' : 'fa-circle-check text-emerald-500'}"></i>
                        <span>${msg}</span>
                    </div>
                    <span class="text-[10px] text-gray-500 font-medium">2年に1回</span>
                </div>
            `;

            container.innerHTML = appData.inspections.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => `
                <div class="bg-gray-50/80 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-medium text-gray-900">実施日: ${r.date} | ${r.memo || '車検'}</div>
                        <div class="text-gray-500">走行距離: ${Number(r.mileage).toLocaleString()} km</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-900">${r.cost.toLocaleString()}円</span>
                        <button onclick="deleteRecord('inspections', ${r.id})" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // 時期が来たアラートを最上部にまとめるロジック
        function renderUrgentAlerts() {
            const container = document.getElementById('urgentAlertContainer');
            let alerts = [];

            // オイルチェック
            const lastOil = appData.oils.sort((a,b) => b.mileage - a.mileage)[0];
            if(!lastOil || (appData.odometer - lastOil.mileage >= 5000)) {
                alerts.push({ title: "エンジンオイル交換の時期です", desc: "前回交換から5,000km以上走行しています。オイル交換を検討しましょう。", color: "amber" });
            }

            // 車検チェック (3ヶ月以内)
            const lastInsp = appData.inspections.sort((a,b) => new Date(b.date) - new Date(a.date))[0];
            if(lastInsp) {
                const nextDate = new Date(lastInsp.date);
                nextDate.setFullYear(nextDate.getFullYear() + 2);
                const diffDays = Math.ceil((nextDate - new Date()) / (1000 * 60 * 60 * 24));
                if(diffDays <= 90 && diffDays > 0) {
                    alerts.push({ title: "【車検】3ヶ月前早期割引の予約チャンス！", desc: `車検満了まであと ${diffDays} 日です。今予約すると割引が受けられます。`, color: "purple" });
                }
            }

            if(alerts.length > 0) {
                container.classList.remove('hidden');
                container.innerHTML = alerts.map(a => `
                    <div class="apple-card border-l-4 ${a.color === 'purple' ? 'border-purple-500 bg-purple-50/90' : 'border-amber-500 bg-amber-50/90'} rounded-2xl p-4 shadow-xs flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-triangle-exclamation text-lg ${a.color === 'purple' ? 'text-purple-600' : 'text-amber-600'}"></i>
                            <div>
                                <h3 class="font-semibold text-sm text-gray-900">${a.title}</h3>
                                <p class="text-xs text-gray-600">${a.desc}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.classList.add('hidden');
                container.innerHTML = '';
            }
        }

        // --- モーダル制御 ---
        function openModal(type) {
            document.getElementById(type + 'Modal').classList.remove('hidden');
            if(type === 'fuel' || type === 'pressure' || type === 'oil' || type === 'inspection') {
                const mField = document.getElementById(type + 'Mileage');
                if(mField && !mField.value) mField.value = appData.odometer;
            }
        }
        function closeModal(type) {
            document.getElementById(type + 'Modal').classList.add('hidden');
        }
        function openCarModal() {
            document.getElementById('carOdometer').value = appData.odometer;
            document.getElementById('carModal').classList.remove('hidden');
        }

        // --- データ保存処理 ---
        function saveFuel(e) {
            e.preventDefault();
            const mileage = Number(document.getElementById('fuelMileage').value);
            const amount = Number(document.getElementById('fuelAmount').value);
            const price = Number(document.getElementById('fuelPrice').value);
            const date = document.getElementById('fuelDate').value;
            const cost = Math.floor(amount * price);

            const lastFuel = appData.fuels.sort((a,b) => b.mileage - a.mileage)[0];
            const efficiency = lastFuel ? Number(((mileage - lastFuel.mileage) / amount).toFixed(1)) : null;

            appData.fuels.push({ id: Date.now(), date, mileage, amount, price, cost, efficiency });
            if(mileage > appData.odometer) appData.odometer = mileage;

            closeModal('fuel');
            render();
        }

        function savePressure(e) {
            e.preventDefault();
            appData.pressures.push({
                id: Date.now(),
                date: document.getElementById('pressureDate').value,
                mileage: Number(document.getElementById('pressureMileage').value) || appData.odometer,
                cost: Number(document.getElementById('pressureCost').value) || 0,
                memo: document.getElementById('pressureMemo').value
            });
            closeModal('pressure');
            render();
        }

        function saveOil(e) {
            e.preventDefault();
            appData.oils.push({
                id: Date.now(),
                date: document.getElementById('oilDate').value,
                mileage: Number(document.getElementById('oilMileage').value),
                cost: Number(document.getElementById('oilCost').value),
                memo: document.getElementById('oilMemo').value
            });
            closeModal('oil');
            render();
        }

        function saveInspection(e) {
            e.preventDefault();
            appData.inspections.push({
                id: Date.now(),
                date: document.getElementById('inspDate').value,
                mileage: Number(document.getElementById('inspMileage').value),
                cost: Number(document.getElementById('inspCost').value),
                memo: document.getElementById('inspMemo').value
            });
            closeModal('inspection');
            render();
        }

        function saveCar(e) {
            e.preventDefault();
            appData.odometer = Number(document.getElementById('carOdometer').value);
            closeModal('car');
            render();
        }

        function deleteRecord(category, id) {
            if(confirm('この記録を削除しますか？')) {
                appData[category] = appData[category].filter(r => r.id !== id);
                render();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], {type: 'json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `car_management_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetData() {
            if(confirm('データを初期化しますか？')) {
                localStorage.removeItem('nissan_note_data');
                location.reload();
            }
        }
    </script>
</body>
</html>
