<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maintenance Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; }
        .apple-card { background: white; border-radius: 20px; border: 1px solid #e5e5ea; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto space-y-4">
        <header class="flex justify-between items-center py-2">
            <h1 class="font-bold text-xl">Note E11 管理</h1>
            <button id="testBtn" class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold">テストボタン</button>
        </header>

        <section class="apple-card p-6">
            <h2 class="font-bold mb-4">給油記録</h2>
            <button id="openFuelBtn" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold">給油を記録</button>
        </section>
    </div>

    <!-- モーダル -->
    <div id="fuelModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm">
            <h3 class="font-bold mb-4">給油記録</h3>
            <button id="closeFuelBtn" class="w-full bg-gray-200 py-3 rounded-xl font-bold">閉じる</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const openModal = (modalId) => {
                const targetModal = document.getElementById(modalId);
                if (targetModal) targetModal.classList.remove('hidden');
            };

            const closeModal = (modalId) => {
                const targetModal = document.getElementById(modalId);
                if (targetModal) targetModal.classList.add('hidden');
            };

            const testBtn = document.getElementById('testBtn');
            if (testBtn) {
                testBtn.addEventListener('click', () => {
                    alert('タップ/クリック成功！');
                });
            }

            const openFuelBtn = document.getElementById('openFuelBtn');
            if (openFuelBtn) {
                openFuelBtn.addEventListener('click', () => {
                    openModal('fuelModal');
                });
            }

            const closeFuelBtn = document.getElementById('closeFuelBtn');
            if (closeFuelBtn) {
                closeFuelBtn.addEventListener('click', () => {
                    closeModal('fuelModal');
                });
            }

            const fuelModal = document.getElementById('fuelModal');
            if (fuelModal) {
                fuelModal.addEventListener('click', (e) => {
                    if (e.target === fuelModal) {
                        closeModal('fuelModal');
                    }
                });
            }
        });
    </script>
</body>
</html>
