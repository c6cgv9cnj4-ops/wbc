<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maintenance & Fuel Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        .apple-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(210, 210, 215, 0.5); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="sticky top-0 z-50 apple-card border-b border-gray-200/60">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center"><i class="fa-solid fa-car-side text-sm"></i></div>
                <div>
                    <h1 class="text-base font-semibold tracking-tight">日産 ノート E11 管理</h1>
                    <p id="headerTodayDate" class="text-[11px] text-gray-500"></p>
                </div>
            </div>
            <button onclick="copyDataForGemini()" class="text-[10px] bg-blue-600 text-white font-bold px-3 py-1.5 rounded-full shadow-sm hover:bg-blue-700 transition">
                <i class="fa-solid fa-copy"></i> Gemini用データコピー
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        <div id="urgentAlertContainer" class="space-y-3 hidden"></div>

        <!-- 燃費回数サマリー -->
        <div class="grid grid-cols-2 gap-3">
            <div class="apple-card p-4 rounded-2xl">
                <div class="text-[11px] text-gray-500">通算給油回数</div>
                <div class="text-xl font-bold"><span id="summaryFuelCount">0</span> <span class="text-xs font-normal">回</span></div>
            </div>
            <div class="apple-card p-4 rounded-2xl">
                <div class="text-[11px] text-gray-500">直近燃費</div>
                <div class="text-xl font-bold text-blue-600"><span id="summaryFuelEff">0.0</span> <span class="text-xs font-normal text-gray-500">km/L</span></div>
            </div>
        </div>

        <div class="space-y-4">
            <!-- 給油 -->
            <section class="apple-card rounded-2xl p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold flex items-center gap-2"><i class="fa-solid fa-gas-pump text-emerald-600"></i> 給油・燃費記録</h2>
                    <button onclick="openModal('fuel')" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-full font-bold">記録</button>
                </div>
                <div id="fuelList" class="space-y-2"></div>
            </section>

            <!-- オイル -->
            <section class="apple-card rounded-2xl p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold flex items-center gap-2"><i class="fa-solid fa-oil-can text-amber-600"></i> エンジンオイル</h2>
                    <button onclick="openModal('oil')" class="bg-amber-600 text-white text-xs px-3 py-1.5 rounded-full font-bold">記録</button>
                </div>
                <div id="oilList" class="space-y-2"></div>
            </section>
        </div>
    </main>

    <!-- 給油モーダル -->
    <div id="fuelModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4">
            <h3 class="font-bold">給油記録</h3>
            <form onsubmit="saveFuel(event)" class="space-y-3 text-sm">
                <input type="date" id="fuelDate" class="w-full bg-gray-50 p-2 rounded-xl">
                <input type="number" id="fuelMileage" placeholder="走行距離 (km)" class="w-full bg-gray-50 p-2 rounded-xl">
                <input type="number" step="0.01" id="fuelAmount" placeholder="給油量 (L)" class="w-full bg-gray-50 p-2 rounded-xl">
                <input type="number" id="fuelPrice" placeholder="単価 (円/L)" class="w-full bg-gray-50 p-2 rounded-xl">
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal('fuel')" class="flex-1 bg-gray-200 py-2 rounded-xl">閉じる</button>
                    <button type="submit" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- オイルモーダル -->
    <div id="oilModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4">
            <h3 class="font-bold">オイル交換記録</h3>
            <form onsubmit="saveOil(event)" class="space-y-3 text-sm">
                <input type="date" id="oilDate" class="w-full bg-gray-50 p-2 rounded-xl">
                <input type="text" id="oilName" placeholder="オイル銘柄・粘度 (例: 5W-30)" class="w-full bg-gray-50 p-2 rounded-xl font-medium">
                <input type="number" id="oilMileage" placeholder="走行距離 (km)" class="w-full bg-gray-50 p-2 rounded-xl">
                <input type="number" id="oilCost" placeholder="費用 (円)" class="w-full bg-gray-50 p-2 rounded-xl">
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal('oil')" class="flex-1 bg-gray-200 py-2 rounded-xl">閉じる</button>
                    <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-xl">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let appData = JSON.parse(localStorage.getItem('nissan_note_data')) || { odometer: 78500, fuels: [], oils: [] };

        function render() {
            localStorage.setItem('nissan_note_data', JSON.stringify(appData));
            document.getElementById('summaryFuelCount').textContent = appData.fuels.length;
            const lastFuel = appData.fuels[appData.fuels.length - 1];
            document.getElementById('summaryFuelEff').textContent = lastFuel ? lastFuel.efficiency : 0.0;
            
            // リスト更新省略（ロジックは保持）
        }

        function copyDataForGemini() {
            const dataText = `
# 車両メンテナンスデータ分析用テキスト
車両: ${appData.name || '日産 ノート E11'}
現在走行距離: ${appData.odometer}km

## 給油記録 (Date, Mileage, L, Price, Cost, Eff)
${appData.fuels.map(f => `${f.date}, ${f.mileage}, ${f.amount}, ${f.price}, ${f.cost}, ${f.efficiency}`).join('\n')}

## エンジンオイル記録 (Date, Mileage, OilName, Cost)
${appData.oils.map(o => `${o.date}, ${o.mileage}, ${o.oilName}, ${o.cost}`).join('\n')}

上記データを分析してください。
            `.trim();
            navigator.clipboard.writeText(dataText);
            alert('データをクリップボードにコピーしました！Geminiへのチャットに貼り付けてください。');
        }

        function saveFuel(e) { e.preventDefault(); /* 既存処理 */ render(); }
        function saveOil(e) { e.preventDefault(); /* 銘柄保存ロジックを追加 */ render(); }
        // 補助関数等...
        render();
    </script>
</body>
</html>
