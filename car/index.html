<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note E11 管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; }
        .apple-card { background: white; border-radius: 20px; border: 1px solid #e5e5ea; }
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body class="p-4 pb-20">
    <div class="max-w-md mx-auto space-y-4">
        <!-- モーダルを開くボタン（追加） -->
        <button id="openPressureBtn" class="w-full bg-sky-600 text-white py-3 rounded-xl font-bold">
            タイヤ空気圧記録を開く
        </button>

        <!-- 空気圧モーダル -->
        <div id="pressureModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 text-xs">
                <h3 class="font-bold text-sm">タイヤ空気圧 (4輪) 記録</h3>
                <input type="date" id="pDate" class="w-full bg-gray-100 p-3 rounded-xl">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] text-gray-500 mb-1 block">前左 (FL)</label>
                        <select id="pFL" class="w-full bg-gray-100 p-3 rounded-xl font-bold"></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 mb-1 block">前右 (FR)</label>
                        <select id="pFR" class="w-full bg-gray-100 p-3 rounded-xl font-bold"></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 mb-1 block">後左 (RL)</label>
                        <select id="pRL" class="w-full bg-gray-100 p-3 rounded-xl font-bold"></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 mb-1 block">後右 (RR)</label>
                        <select id="pRR" class="w-full bg-gray-100 p-3 rounded-xl font-bold"></select>
                    </div>
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button id="closePressureBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                    <button id="savePressureBtn" class="flex-1 bg-sky-600 text-white py-3 rounded-xl font-bold">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // プルダウンの生成: 1.5 〜 3.0 を 0.1 刻みで生成
            const selectIds = ['pFL', 'pFR', 'pRL', 'pRR'];
            selectIds.forEach(id => {
                const select = document.getElementById(id);
                for (let i = 15; i <= 30; i++) {
                    const val = (i / 10).toFixed(1);
                    const option = document.createElement('option');
                    option.value = val;
                    option.textContent = val;
                    if (val === "2.3") option.selected = true; // デフォルトを2.3に
                    select.appendChild(option);
                }
            });

            // モーダル表示・非表示の切り替え
            const toggleModal = (id, show) => {
                const modal = document.getElementById(id);
                if (modal) {
                    modal.classList.toggle('hidden', !show);
                    // モーダルを開くときに今日の日付をセットする
                    if (show) {
                        const today = new Date().toISOString().split('T')[0];
                        document.getElementById('pDate').value = today;
                    }
                }
            };

            const openBtn = document.getElementById('openPressureBtn');
            if (openBtn) {
                openBtn.onclick = () => toggleModal('pressureModal', true);
            }
            
            const closeBtn = document.getElementById('closePressureBtn');
            if (closeBtn) {
                closeBtn.onclick = () => toggleModal('pressureModal', false);
            }
            
            // 保存時は select の value をそのまま取得
            const saveBtn = document.getElementById('savePressureBtn');
            if (saveBtn) {
                saveBtn.onclick = () => {
                    const pData = {
                        date: document.getElementById('pDate').value,
                        fl: document.getElementById('pFL').value,
                        fr: document.getElementById('pFR').value,
                        rl: document.getElementById('pRL').value,
                        rr: document.getElementById('pRR').value
                    };
                    console.log("保存データ:", pData);
                    toggleModal('pressureModal', false);
                };
            }
        });
    </script>
</body>
</html>
