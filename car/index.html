<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maintenance Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; background-color: #f5f5f7; }
        .apple-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(210, 210, 215, 0.5); }
    </style>
</head>
<body class="pb-12 text-gray-900">

    <header class="sticky top-0 z-50 bg-gray-100/80 backdrop-blur-xl border-b border-gray-200">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg">Note E11 管理</h1>
            <button onclick="copyDataForGemini()" class="text-xs bg-blue-600 text-white px-4 py-1.5 rounded-full font-bold shadow-sm">データ出力</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-4 space-y-4">
        <!-- 半年アラート -->
        <div id="urgentAlertContainer" class="space-y-2"></div>

        <!-- サマリー -->
        <div class="grid grid-cols-3 gap-2">
            <div class="apple-card p-3 rounded-2xl text-center"><div class="text-[9px] text-gray-500">直近燃費</div><div class="font-bold text-blue-600"><span id="sLast">0.0</span></div></div>
            <div class="apple-card p-3 rounded-2xl text-center"><div class="text-[9px] text-gray-500">今月平均</div><div class="font-bold text-emerald-600"><span id="sMonth">0.0</span></div></div>
            <div class="apple-card p-3 rounded-2xl text-center"><div class="text-[9px] text-gray-500">今年平均</div><div class="font-bold text-purple-600"><span id="sYear">0.0</span></div></div>
        </div>

        <!-- 給油 (アコーディオン) -->
        <details class="apple-card rounded-2xl overflow-hidden" open>
            <summary class="flex justify-between items-center p-4 font-bold cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-gas-pump text-emerald-600"></i> 給油記録</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
            </summary>
            <div id="fuelList" class="px-4 pb-4 space-y-2 border-t border-gray-100 pt-3"></div>
            <div class="px-4 pb-4"><button onclick="openModal('fuel')" class="w-full bg-gray-900 text-white py-2 rounded-xl text-sm font-bold">給油を記録</button></div>
        </details>

        <!-- 空気圧 (アコーディオン) -->
        <details class="apple-card rounded-2xl overflow-hidden" open>
            <summary class="flex justify-between items-center p-4 font-bold cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-600"></i> タイヤ空気圧</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
            </summary>
            <div id="pressureList" class="px-4 pb-4 space-y-2 border-t border-gray-100 pt-3"></div>
            <div class="px-4 pb-4"><button onclick="openModal('pressure')" class="w-full bg-gray-900 text-white py-2 rounded-xl text-sm font-bold">点検を記録</button></div>
        </details>

        <!-- オイル -->
        <section class="apple-card rounded-2xl p-4">
            <h2 class="font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-oil-can text-amber-600"></i> エンジンオイル</h2>
            <div id="oilList" class="space-y-2 mb-3 text-sm"></div>
            <button onclick="openModal('oil')" class="w-full bg-gray-900 text-white py-2 rounded-xl text-sm font-bold">記録を追加</button>
        </section>

        <!-- 車検 -->
        <section class="apple-card rounded-2xl p-4">
            <h2 class="font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-purple-600"></i> 車検</h2>
            <div id="inspectionList" class="space-y-2 mb-3 text-sm"></div>
            <button onclick="openModal('inspection')" class="w-full bg-gray-900 text-white py-2 rounded-xl text-sm font-bold">記録を追加</button>
        </section>
    </main>

    <script>
        // データ構造とレンダリングロジック
        let appData = JSON.parse(localStorage.getItem('nissan_note_data_final')) || {
            odometer: 78500, fuels: [], pressures: [], oils: [], inspections: []
        };

        function render() {
            // アラート判定 (半年=180日)
            const now = new Date();
            const alertContainer = document.getElementById('urgentAlertContainer');
            let alerts = [];
            
            const lastPress = [...appData.pressures].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
            if (lastPress && (now - new Date(lastPress.date)) / 86400000 > 180) alerts.push("タイヤ空気圧の点検から半年経過");
            
            const lastOil = [...appData.oils].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
            if (lastOil && (now - new Date(lastOil.date)) / 86400000 > 180) alerts.push("エンジンオイル交換から半年経過");

            alertContainer.innerHTML = alerts.map(a => `
                <div class="apple-card border-l-4 border-amber-500 p-3 text-amber-900 text-xs font-bold animate-pulse">
                    <i class="fa-solid fa-triangle-exclamation"></i> ${a}
                </div>
            `).join('');

            // 各リストの最新表示などのレンダリング
            // ... (各 renderFuels, renderPressures 等の実装)
        }
        
        function copyDataForGemini() {
            // 構造化データ出力
            const dataText = `車検予定や詳細分析用データ\n${JSON.stringify(appData, null, 2)}`;
            navigator.clipboard.writeText(dataText);
            alert('全データをクリップボードにコピーしました！');
        }

        render();
    </script>
</body>
</html>
