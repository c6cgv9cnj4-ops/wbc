<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日産 ノート E11 管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        .apple-card { background: white; border-radius: 20px; border: 1px solid #e5e5ea; }
        summary { list-style: none; }
        summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="p-4 pb-20">
    <div class="max-w-md mx-auto space-y-4">
        <!-- ヘッダー -->
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="font-bold text-xl">Note E11 管理</h1>
                <p id="headerDate" class="text-xs text-gray-500"></p>
            </div>
            <button id="exportBtn" class="bg-blue-600 text-white px-3.5 py-2 rounded-full text-xs font-bold shadow-sm">データ出力</button>
        </header>

        <!-- アラートエリア -->
        <div id="alertContainer" class="space-y-2"></div>

        <!-- 燃費サマリー -->
        <div class="grid grid-cols-3 gap-2">
            <div class="apple-card p-3 text-center"><div class="text-[10px] text-gray-500">直近燃費</div><div class="font-bold text-blue-600 text-sm"><span id="sLast">0.0</span></div></div>
            <div class="apple-card p-3 text-center"><div class="text-[10px] text-gray-500">今月平均</div><div class="font-bold text-emerald-600 text-sm"><span id="sMonth">0.0</span></div></div>
            <div class="apple-card p-3 text-center"><div class="text-[10px] text-gray-500">今年平均</div><div class="font-bold text-purple-600 text-sm"><span id="sYear">0.0</span></div></div>
        </div>

        <!-- 1. 給油記録 (アコーディオン) -->
        <details class="apple-card p-5" open>
            <summary class="flex justify-between items-center font-bold text-base cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-gas-pump text-emerald-600"></i> 給油記録</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </summary>
            <div id="fuelList" class="mt-3 space-y-2 text-xs"></div>
            <button id="openFuelBtn" class="w-full mt-4 bg-gray-900 text-white py-3 rounded-xl font-bold text-xs">給油を記録</button>
        </details>

        <!-- 2. 空気圧 (アコーディオン) -->
        <details class="apple-card p-5" open>
            <summary class="flex justify-between items-center font-bold text-base cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-600"></i> タイヤ空気圧 (4輪)</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </summary>
            <div id="pressureReminder" class="mt-3"></div>
            <div id="pressureList" class="mt-3 space-y-2 text-xs"></div>
            <button id="openPressureBtn" class="w-full mt-4 bg-gray-900 text-white py-3 rounded-xl font-bold text-xs">点検を記録</button>
        </details>

        <!-- 3. エンジンオイル -->
        <section class="apple-card p-5">
            <h2 class="font-bold text-base mb-3 flex items-center gap-2"><i class="fa-solid fa-oil-can text-amber-600"></i> エンジンオイル</h2>
            <div id="oilList" class="space-y-2 text-xs mb-3"></div>
            <button id="openOilBtn" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-xs">オイル交換を記録</button>
        </section>

        <!-- 4. 車検 -->
        <section class="apple-card p-5">
            <h2 class="font-bold text-base mb-3 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-purple-600"></i> 車検</h2>
            <div id="inspReminder" class="mb-3"></div>
            <div id="inspList" class="space-y-2 text-xs mb-3"></div>
            <button id="openInspBtn" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-xs">車検を記録</button>
        </section>
    </div>

    <!-- 給油モーダル -->
    <div id="fuelModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">給油記録の追加</h3>
            <input type="date" id="fDate" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" id="fMileage" placeholder="総走行距離 (km)" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" step="0.01" id="fAmount" placeholder="給油量 (L)" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" id="fPrice" placeholder="単価 (円/L)" class="w-full bg-gray-100 p-3 rounded-xl">
            <div class="flex gap-2 pt-2">
                <button id="closeFuelBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button id="saveFuelBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <!-- 空気圧モーダル -->
    <div id="pressureModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">タイヤ空気圧 (4輪) 記録</h3>
            <input type="date" id="pDate" class="w-full bg-gray-100 p-3 rounded-xl">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" step="0.1" id="pFL" placeholder="前左(2.3)" class="bg-gray-100 p-3 rounded-xl">
                <input type="number" step="0.1" id="pFR" placeholder="前右(2.3)" class="bg-gray-100 p-3 rounded-xl">
                <input type="number" step="0.1" id="pRL" placeholder="後左(2.2)" class="bg-gray-100 p-3 rounded-xl">
                <input type="number" step="0.1" id="pRR" placeholder="後右(2.2)" class="bg-gray-100 p-3 rounded-xl">
            </div>
            <input type="number" id="pCost" placeholder="費用 (円)※調整0円" class="w-full bg-gray-100 p-3 rounded-xl" value="0">
            <div class="flex gap-2 pt-2">
                <button id="closePressureBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button id="savePressureBtn" class="flex-1 bg-sky-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <!-- オイルモーダル -->
    <div id="oilModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">オイル交換の記録</h3>
            <input type="date" id="oDate" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" id="oMileage" placeholder="交換時走行距離 (km)" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" id="oCost" placeholder="費用 (円)" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="text" id="oMemo" placeholder="メモ (例:エレメント同時)" class="w-full bg-gray-100 p-3 rounded-xl">
            <div class="flex gap-2 pt-2">
                <button id="closeOilBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button id="saveOilBtn" class="flex-1 bg-amber-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <!-- 車検モーダル -->
    <div id="inspModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">車検実施の記録</h3>
            <input type="date" id="iDate" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" id="iMileage" placeholder="実施時走行距離 (km)" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="number" id="iCost" placeholder="車検費用合計 (円)" class="w-full bg-gray-100 p-3 rounded-xl">
            <input type="text" id="iMemo" placeholder="メモ" class="w-full bg-gray-100 p-3 rounded-xl">
            <div class="flex gap-2 pt-2">
                <button id="closeInspBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button id="saveInspBtn" class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let data = JSON.parse(localStorage.getItem('note_e11_data')) || {
                odometer: 78500, fuels: [], pressures: [], oils: [], inspections: []
            };

            const today = new Date();
            document.getElementById('headerDate').textContent = today.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
            const todayStr = today.toISOString().slice(0, 10);
            ['fDate', 'pDate', 'oDate', 'iDate'].forEach(id => document.getElementById(id).value = todayStr);

            const toggleModal = (id, show) => {
                document.getElementById(id).classList.toggle('hidden', !show);
            };

            // 各種イベントリスナー登録
            document.getElementById('openFuelBtn').onclick = () => toggleModal('fuelModal', true);
            document.getElementById('closeFuelBtn').onclick = () => toggleModal('fuelModal', false);
            document.getElementById('openPressureBtn').onclick = () => toggleModal('pressureModal', true);
            document.getElementById('closePressureBtn').onclick = () => toggleModal('pressureModal', false);
            document.getElementById('openOilBtn').onclick = () => toggleModal('oilModal', true);
            document.getElementById('closeOilBtn').onclick = () => toggleModal('oilModal', false);
            document.getElementById('openInspBtn').onclick = () => toggleModal('inspModal', true);
            document.getElementById('closeInspBtn').onclick = () => toggleModal('inspModal', false);

            // 保存処理
            document.getElementById('saveFuelBtn').onclick = () => {
                const mileage = Number(document.getElementById('fMileage').value);
                const amount = Number(document.getElementById('fAmount').value);
                const price = Number(document.getElementById('fPrice').value);
                const last = [...data.fuels].sort((a,b) => b.mileage - a.mileage)[0];
                const efficiency = last ? Number(((mileage - last.mileage) / amount).toFixed(1)) : null;

                data.fuels.push({
                    id: Date.now(),
                    date: document.getElementById('fDate').value,
                    mileage, amount, price, cost: Math.floor(amount * price), efficiency
                });
                if(mileage > data.odometer) data.odometer = mileage;
                localStorage.setItem('note_e11_data', JSON.stringify(data));
                toggleModal('fuelModal', false);
                render();
            };

            document.getElementById('savePressureBtn').onclick = () => {
                data.pressures.push({
                    id: Date.now(),
                    date: document.getElementById('pDate').value,
                    fl: document.getElementById('pFL').value,
                    fr: document.getElementById('pFR').value,
                    rl: document.getElementById('pRL').value,
                    rr: document.getElementById('pRR').value,
                    cost: Number(document.getElementById('pCost').value) || 0
                });
                localStorage.setItem('note_e11_data', JSON.stringify(data));
                toggleModal('pressureModal', false);
                render();
            };

            document.getElementById('saveOilBtn').onclick = () => {
                const mileage = Number(document.getElementById('oMileage').value);
                data.oils.push({
                    id: Date.now(),
                    date: document.getElementById('oDate').value,
                    mileage, cost: Number(document.getElementById('oCost').value),
                    memo: document.getElementById('oMemo').value
                });
                if(mileage > data.odometer) data.odometer = mileage;
                localStorage.setItem('note_e11_data', JSON.stringify(data));
                toggleModal('oilModal', false);
                render();
            };

            document.getElementById('saveInspBtn').onclick = () => {
                const mileage = Number(document.getElementById('iMileage').value);
                data.inspections.push({
                    id: Date.now(),
                    date: document.getElementById('iDate').value,
                    mileage, cost: Number(document.getElementById('iCost').value),
                    memo: document.getElementById('iMemo').value
                });
                if(mileage > data.odometer) data.odometer = mileage;
                localStorage.setItem('note_e11_data', JSON.stringify(data));
                toggleModal('inspModal', false);
                render();
            };

            document.getElementById('exportBtn').onclick = () => {
                const text = `# ノートE11 データ\n${JSON.stringify(data, null, 2)}`;
                navigator.clipboard.writeText(text);
                alert('データをコピーしました！');
            };

            function render() {
                // サマリー計算
                const sortedF = [...data.fuels].sort((a,b) => b.mileage - a.mileage);
                document.getElementById('sLast').textContent = sortedF[0]?.efficiency ? sortedF[0].efficiency + ' km/L' : '0.0';

                // 給油 (最新1件)
                const fList = document.getElementById('fuelList');
                fList.innerHTML = sortedF[0] ? `<div class="bg-gray-50 p-3 rounded-xl flex justify-between"><span>${sortedF[0].date} | ${sortedF[0].amount}L (${sortedF[0].efficiency || 0}km/L)</span><b>${sortedF[0].cost}円</b></div>` : '記録なし';

                // 空気圧 (最新1件 ＆ 毎月1日リマインダー)
                const sortedP = [...data.pressures].sort((a,b) => new Date(b.date) - new Date(a.date));
                const is1st = today.getDate() === 1;
                document.getElementById('pressureReminder').innerHTML = is1st ? 
                    `<div class="bg-sky-100 text-sky-900 p-2.5 rounded-xl font-bold flex items-center gap-2"><i class="fa-solid fa-bell"></i> 本日は毎月1日！空気圧点検日です</div>` : '';
                document.getElementById('pressureList').innerHTML = sortedP[0] ? 
                    `<div class="bg-gray-50 p-3 rounded-xl"><b>${sortedP[0].date}点検</b><br>前左:${sortedP[0].fl} / 前右:${sortedP[0].fr} / 後左:${sortedP[0].rl} / 後右:${sortedP[0].rr}</div>` : '記録なし';

                // 半年アラート
                let alerts = [];
                const lastO = [...data.oils].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
                if (!lastO || (today - new Date(lastO.date)) / 86400000 > 180) alerts.push("エンジンオイル交換から半年以上経過しています");
                if (!sortedP[0] || (today - new Date(sortedP[0].date)) / 86400000 > 180) alerts.push("タイヤ空気圧点検から半年以上経過しています");

                document.getElementById('alertContainer').innerHTML = alerts.map(a => 
                    `<div class="bg-amber-100 border border-amber-300 p-3 rounded-xl text-amber-900 text-xs font-bold"><i class="fa-solid fa-triangle-exclamation"></i> ${a}</div>`
                ).join('');

                // オイル・車検リスト
                document.getElementById('oilList').innerHTML = [...data.oils].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0,1).map(o => 
                    `<div class="bg-gray-50 p-3 rounded-xl flex justify-between"><span>${o.date} | ${o.memo || 'オイル交換'} (${o.mileage}km)</span><b>${o.cost}円</b></div>`
                ).join('') || '記録なし';

                const lastI = [...data.inspections].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
                let inspMsg = "車検記録なし";
                if(lastI) {
                    const nextD = new Date(lastI.date); nextD.setFullYear(nextD.getFullYear() + 2);
                    const days = Math.ceil((nextD - today) / (1000 * 60 * 60 * 24));
                    inspMsg = days <= 90 && days > 0 ? `【早期割引チャンス】車検満了まであと ${days} 日！` : `次回車検予定: ${nextD.toISOString().slice(0,10)} (あと${days}日)`;
                }
                document.getElementById('inspReminder').innerHTML = `<div class="bg-purple-50 text-purple-900 p-2.5 rounded-xl font-medium">${inspMsg}</div>`;
                document.getElementById('inspList').innerHTML = lastI ? `<div class="bg-gray-50 p-3 rounded-xl flex justify-between"><span>${lastI.date} 実施</span><b>${lastI.cost}円</b></div>` : '';
            }

            render();
        });
    </script>
</body>
</html>
