<!DOCTYPE html><html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日産 ノート E11 管理 (自動同期)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; 
            background-color: #f5f5f7; 
            color: #1d1d1f; 
        }
        .apple-card { 
            background: white; 
            border-radius: 20px; 
            border: 1px solid #e5e5ea; 
        }
        summary { list-style: none; }
        summary::-webkit-details-marker { display: none; }
        select { -webkit-appearance: none; appearance: none; }
    </style></head><body class="p-4 pb-20">
    <div class="max-w-md mx-auto space-y-4">
        <!-- ヘッダー（自動同期ステータス搭載） -->
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="font-bold text-xl">Note E11 管理</h1>
                <p id="headerDate" class="text-xs text-gray-500"></p>
            </div>
            <div class="flex items-center gap-2">
                <span id="syncStatus" class="text-[10px] bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-bold">同期準備中</span>
                <button onclick="manualSync()" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-sm active:scale-95 transition" title="今すぐ同期">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </header>

        <!-- 半年・月次リマインダー・緊急アラート表示エリア -->
        <div id="alertContainer" class="space-y-2"></div>

        <!-- 燃費サマリー（直近・今月・今年） -->
        <div class="grid grid-cols-3 gap-2">
            <div class="apple-card p-3 text-center">
                <div class="text-[10px] text-gray-500">直近燃費</div>
                <div class="font-bold text-blue-600 text-sm mt-0.5"><span id="sLast">0.0</span></div>
            </div>
            <div class="apple-card p-3 text-center">
                <div class="text-[10px] text-gray-500">今月平均</div>
                <div class="font-bold text-emerald-600 text-sm mt-0.5"><span id="sMonth">0.0</span></div>
            </div>
            <div class="apple-card p-3 text-center">
                <div class="text-[10px] text-gray-500">今年平均</div>
                <div class="font-bold text-purple-600 text-sm mt-0.5"><span id="sYear">0.0</span></div>
            </div>
        </div>

        <!-- 1. ガソリン・給油記録 -->
        <details class="apple-card p-5" open>
            <summary class="flex justify-between items-center font-bold text-base cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-gas-pump text-emerald-600"></i> 給油記録</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </summary>
            <div id="fuelList" class="mt-3 space-y-2 text-xs"></div>
            <button id="openFuelBtn" class="w-full mt-4 bg-gray-900 text-white py-3 rounded-xl font-bold text-xs active:scale-95 transition">給油を記録</button>
        </details>

        <!-- 2. タイヤ空気圧 (月1回推奨) -->
        <details class="apple-card p-5" open>
            <summary class="flex justify-between items-center font-bold text-base cursor-pointer">
                <span class="flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-600"></i> タイヤ空気圧 (4輪)</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </summary>
            <div id="pressureReminder" class="mt-3"></div>
            <div id="pressureList" class="mt-3 space-y-2 text-xs"></div>
            <button id="openPressureBtn" class="w-full mt-4 bg-gray-900 text-white py-3 rounded-xl font-bold text-xs active:scale-95 transition">点検を記録</button>
        </details>

        <!-- 3. エンジンオイル交換記録 -->
        <section class="apple-card p-5">
            <h2 class="font-bold text-base mb-3 flex items-center gap-2"><i class="fa-solid fa-oil-can text-amber-600"></i> エンジンオイル</h2>
            <div id="oilList" class="space-y-2 text-xs mb-3"></div>
            <button id="openOilBtn" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-xs active:scale-95 transition">オイル交換を記録</button>
        </section>

        <!-- 4. 車検記録 & リマインダー -->
        <section class="apple-card p-5">
            <h2 class="font-bold text-base mb-3 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-purple-600"></i> 車検</h2>
            <div id="inspReminder" class="mb-3"></div>
            <div id="inspList" class="space-y-2 text-xs mb-3"></div>
            <button id="openInspBtn" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-xs active:scale-95 transition">車検を記録</button>
        </section>
    </div>

    <!-- モーダル各種 -->
    <div id="fuelModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">給油記録の追加</h3>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">実施日</label>
                <input type="date" id="fDate" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">総走行距離 (km)</label>
                <input type="number" id="fMileage" placeholder="78500" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-gray-500 mb-1 block">給油量 (L)</label>
                    <input type="number" step="0.01" id="fAmount" placeholder="35.0" class="w-full bg-gray-100 p-3 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 mb-1 block">単価 (円/L)</label>
                    <input type="number" id="fPrice" placeholder="168" class="w-full bg-gray-100 p-3 rounded-xl">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" id="closeFuelBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button type="button" id="saveFuelBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <div id="pressureModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 text-xs">
            <h3 class="font-bold text-sm">タイヤ空気圧 (4輪) 記録</h3>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">点検日</label>
                <input type="date" id="pDate" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-gray-500 mb-1 block">前左 (FL)</label>
                    <select id="pFL" class="w-full bg-gray-100 p-3 rounded-xl font-bold text-center"></select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 mb-1 block">前右 (FR)</label>
                    <select id="pFR" class="w-full bg-gray-100 p-3 rounded-xl font-bold text-center"></select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 mb-1 block">後左 (RL)</label>
                    <select id="pRL" class="w-full bg-gray-100 p-3 rounded-xl font-bold text-center"></select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 mb-1 block">後右 (RR)</label>
                    <select id="pRR" class="w-full bg-gray-100 p-3 rounded-xl font-bold text-center"></select>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" id="closePressureBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button type="button" id="savePressureBtn" class="flex-1 bg-sky-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <div id="oilModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">オイル交換の記録</h3>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">実施日</label>
                <input type="date" id="oDate" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">交換時走行距離 (km)</label>
                <input type="number" id="oMileage" placeholder="78500" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">費用 (円)</label>
                <input type="number" id="oCost" placeholder="6500" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl cursor-pointer">
                <input type="checkbox" id="oElement" class="w-4 h-4 text-amber-600 rounded">
                <span class="font-medium text-gray-800">オイルエレメントも交換した</span>
            </label>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">メモ</label>
                <input type="text" id="oMemo" placeholder="例: 粘度5W-30" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" id="closeOilBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button type="button" id="saveOilBtn" class="flex-1 bg-amber-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <div id="inspModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm">車検実施の記録</h3>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">車検実施日</label>
                <input type="date" id="iDate" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">実施時走行距離 (km)</label>
                <input type="number" id="iMileage" placeholder="78500" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">車検費用合計 (円)</label>
                <input type="number" id="iCost" placeholder="85000" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block">メモ</label>
                <input type="text" id="iMemo" placeholder="例: 早期割引適用" class="w-full bg-gray-100 p-3 rounded-xl">
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" id="closeInspBtn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">キャンセル</button>
                <button type="button" id="saveInspBtn" class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold">保存</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_ID_KEY = 'note_e11_npoint_id';
        
        let data = JSON.parse(localStorage.getItem('note_e11_local_v12')) || {
            odometer: 78500, fuels: [], pressures: [], oils: [], inspections: []
        };

        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);

        async function syncToCloud() {
            const statusEl = document.getElementById('syncStatus');
            if(statusEl) {
                statusEl.textContent = '同期中...';
                statusEl.className = 'text-[10px] bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold';
            }

            try {
                localStorage.setItem('note_e11_local_v12', JSON.stringify(data));
                let binId = localStorage.getItem(STORAGE_ID_KEY);
                
                if (!binId) {
                    const res = await fetch('https://api.npoint.io', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if(res.ok) {
                        const json = await res.json();
                        binId = json.id;
                        if(binId) localStorage.setItem(STORAGE_ID_KEY, binId);
                    }
                } else {
                    await fetch(`https://api.npoint.io/${binId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }

                if(statusEl) {
                    statusEl.textContent = binId ? '自動同期完了' : 'ローカル保存のみ';
                    statusEl.className = binId ? 'text-[10px] bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold' : 'text-[10px] bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-bold';
                }
            } catch (e) {
                if(statusEl) {
                    statusEl.textContent = 'オフライン保存';
                    statusEl.className = 'text-[10px] bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-bold';
                }
            }
            render();
        }

        async function syncFromCloud() {
            const binId = localStorage.getItem(STORAGE_ID_KEY);
            if (!binId) return;

            const statusEl = document.getElementById('syncStatus');
            try {
                const res = await fetch(`https://api.npoint.io/${binId}`);
                if (res.ok) {
                    const cloudData = await res.json();
                    if (cloudData && typeof cloudData === 'object' && Array.isArray(cloudData.fuels)) {
                        data = cloudData;
                        localStorage.setItem('note_e11_local_v12', JSON.stringify(data));
                        render();
                        if(statusEl) {
                            statusEl.textContent = '同期完了';
                            statusEl.className = 'text-[10px] bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold';
                        }
                    }
                }
            } catch (e) {
                console.log('オフラインまたは同期スキップ');
            }
        }

        function manualSync() {
            syncFromCloud().then(() => {
                alert('クラウドから最新データを同期しました！');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const headerDate = document.getElementById('headerDate');
            if (headerDate) {
                headerDate.textContent = today.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
            }

            syncFromCloud();

            ['pFL', 'pFR', 'pRL', 'pRR'].forEach(id => {
                const select = document.getElementById(id);
                if (select && select.children.length === 0) {
                    for (let i = 15; i <= 30; i++) {
                        const val = (i / 10).toFixed(1);
                        const opt = document.createElement('option');
                        opt.value = val;
                        opt.textContent = val;
                        if (val === "2.3") opt.selected = true;
                        select.appendChild(opt);
                    }
                }
            });

            const toggleModal = (modalId, show) => {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.toggle('hidden', !show);
                    if (show) {
                        if (modalId === 'fuelModal') {
                            document.getElementById('fDate').value = todayStr;
                            document.getElementById('fMileage').value = data.odometer;
                        } else if (modalId === 'pressureModal') {
                            document.getElementById('pDate').value = todayStr;
                        } else if (modalId === 'oilModal') {
                            document.getElementById('oDate').value = todayStr;
                            document.getElementById('oMileage').value = data.odometer;
                        } else if (modalId === 'inspModal') {
                            document.getElementById('iDate').value = todayStr;
                            document.getElementById('iMileage').value = data.odometer;
                        }
                    }
                }
            };

            const bindClick = (btnId, fn) => {
                const btn = document.getElementById(btnId);
                if (btn) btn.addEventListener('click', fn);
            };

            bindClick('openFuelBtn', () => toggleModal('fuelModal', true));
            bindClick('closeFuelBtn', () => toggleModal('fuelModal', false));
            bindClick('openPressureBtn', () => toggleModal('pressureModal', true));
            bindClick('closePressureBtn', () => toggleModal('pressureModal', false));
            bindClick('openOilBtn', () => toggleModal('oilModal', true));
            bindClick('closeOilBtn', () => toggleModal('oilModal', false));
            bindClick('openInspBtn', () => toggleModal('inspModal', true));
            bindClick('closeInspBtn', () => toggleModal('inspModal', false));

            ['fuelModal', 'pressureModal', 'oilModal', 'inspModal'].forEach(id => {
                const modal = document.getElementById(id);
                if (modal) {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) toggleModal(id, false);
                    });
                }
            });

            bindClick('saveFuelBtn', () => {
                const fDate = document.getElementById('fDate').value || todayStr;
                const mileage = parseFloat(document.getElementById('fMileage').value) || data.odometer;
                const amount = parseFloat(document.getElementById('fAmount').value) || 0;
                const price = parseFloat(document.getElementById('fPrice').value) || 0;

                const sortedFuels = [...data.fuels].sort((a, b) => b.mileage - a.mileage);
                const lastFuel = sortedFuels[0];
                const efficiency = (lastFuel && amount > 0) ? Number(((mileage - lastFuel.mileage) / amount).toFixed(1)) : null;

                data.fuels.push({ id: Date.now(), date: fDate, mileage, amount, price, cost: Math.floor(amount * price), efficiency });
                if (mileage > data.odometer) data.odometer = mileage;
                
                toggleModal('fuelModal', false);
                syncToCloud();
            });

            bindClick('savePressureBtn', () => {
                data.pressures.push({
                    id: Date.now(),
                    date: document.getElementById('pDate').value || todayStr,
                    fl: document.getElementById('pFL').value,
                    fr: document.getElementById('pFR').value,
                    rl: document.getElementById('pRL').value,
                    rr: document.getElementById('pRR').value
                });
                toggleModal('pressureModal', false);
                syncToCloud();
            });

            bindClick('saveOilBtn', () => {
                const mileage = parseFloat(document.getElementById('oMileage').value) || data.odometer;
                data.oils.push({
                    id: Date.now(),
                    date: document.getElementById('oDate').value || todayStr,
                    mileage,
                    cost: parseFloat(document.getElementById('oCost').value) || 0,
                    element: document.getElementById('oElement').checked,
                    memo: document.getElementById('oMemo').value
                });
                if (mileage > data.odometer) data.odometer = mileage;
                toggleModal('oilModal', false);
                syncToCloud();
            });

            bindClick('saveInspBtn', () => {
                const mileage = parseFloat(document.getElementById('iMileage').value) || data.odometer;
                data.inspections.push({
                    id: Date.now(),
                    date: document.getElementById('iDate').value || todayStr,
                    mileage,
                    cost: parseFloat(document.getElementById('iCost').value) || 0,
                    memo: document.getElementById('iMemo').value
                });
                if (mileage > data.odometer) data.odometer = mileage;
                toggleModal('inspModal', false);
                syncToCloud();
            });

            render();
        });

        function render() {
            const curYear = today.getFullYear();
            const curMonth = today.getMonth() + 1;

            const sortedF = [...data.fuels].sort((a, b) => b.mileage - a.mileage);
            const sLast = document.getElementById('sLast');
            if(sLast) sLast.textContent = (sortedF[0] && sortedF[0].efficiency != null) ? sortedF[0].efficiency + ' km/L' : '0.0';

            const mFuels = data.fuels.filter(f => {
                const d = new Date(f.date);
                return d.getFullYear() === curYear && (d.getMonth() + 1) === curMonth && f.efficiency != null;
            });
            const sMonth = document.getElementById('sMonth');
            if(sMonth) sMonth.textContent = mFuels.length ? (mFuels.reduce((s, f) => s + f.efficiency, 0) / mFuels.length).toFixed(1) : '0.0';

            const yFuels = data.fuels.filter(f => {
                const d = new Date(f.date);
                return d.getFullYear() === curYear && f.efficiency != null;
            });
            const sYear = document.getElementById('sYear');
            if(sYear) sYear.textContent = yFuels.length ? (yFuels.reduce((s, f) => s + f.efficiency, 0) / yFuels.length).toFixed(1) : '0.0';

            const fuelList = document.getElementById('fuelList');
            if(fuelList) {
                fuelList.innerHTML = sortedF[0] ? `
                    <div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-900">${sortedF[0].date}</div>
                            <div class="text-gray-500">${sortedF[0].amount}L (${sortedF[0].price}円/L) | ${sortedF[0].mileage}km</div>
                            <div class="text-blue-600 font-bold mt-0.5">${sortedF[0].efficiency != null ? sortedF[0].efficiency + ' km/L' : '計算中'}</div>
                        </div>
                        <b class="text-sm text-gray-900">${sortedF[0].cost.toLocaleString()}円</b>
                    </div>
                ` : '<div class="text-gray-400 py-1">給油記録がありません</div>';
            }

            const sortedP = [...data.pressures].sort((a, b) => new Date(b.date) - new Date(a.date));
            const pressureReminder = document.getElementById('pressureReminder');
            
            // タイヤ空気圧の月1回チェックリマインダー判定（30日以上経過または毎月1日）
            let needsPressureCheck = false;
            if (!sortedP[0]) {
                needsPressureCheck = true;
            } else {
                const daysSinceLastCheck = (today - new Date(sortedP[0].date)) / (1000 * 60 * 60 * 24);
                if (daysSinceLastCheck >= 30 || today.getDate() === 1) {
                    needsPressureCheck = true;
                }
            }

            if(pressureReminder) {
                pressureReminder.innerHTML = needsPressureCheck ? `
                    <div class="bg-sky-100 text-sky-900 p-2.5 rounded-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-bell text-sky-600"></i> 月1回のタイヤ空気圧チェックの時期です！
                    </div>
                ` : '';
            }

            const pressureList = document.getElementById('pressureList');
            if(pressureList) {
                pressureList.innerHTML = sortedP[0] ? `
                    <div class="bg-gray-50 p-3 rounded-xl">
                        <div class="font-bold text-gray-900 mb-1">${sortedP[0].date} 点検</div>
                        <div class="text-gray-600 space-x-1">
                            <span>FL: <b>${sortedP[0].fl}</b></span> / <span>FR: <b>${sortedP[0].fr}</b></span> / 
                            <span>RL: <b>${sortedP[0].rl}</b></span> / <span>RR: <b>${sortedP[0].rr}</b></span>
                        </div>
                    </div>
                ` : '<div class="text-gray-400 py-1">空気圧の点検記録がありません</div>';
            }

            let alerts = [];
            const sortedO = [...data.oils].sort((a, b) => new Date(b.date) - new Date(a.date));
            const lastO = sortedO[0];
            if (!lastO || (today - new Date(lastO.date)) / 86400000 > 180) {
                alerts.push("エンジンオイル交換から半年（180日）以上経過しています");
            }
            // エアチェックの警告（30日超過）
            if (needsPressureCheck && sortedP[0]) {
                alerts.push("前回点検から1ヶ月以上経過しています。空気圧を確認しましょう");
            }

            const alertContainer = document.getElementById('alertContainer');
            if(alertContainer) {
                alertContainer.innerHTML = alerts.map(a => `
                    <div class="bg-amber-100 border border-amber-300 p-3 rounded-xl text-amber-900 text-xs font-bold flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> ${a}
                    </div>
                `).join('');
            }

            const oilList = document.getElementById('oilList');
            if(oilList) {
                oilList.innerHTML = lastO ? `
                    <div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-900 flex items-center gap-2">
                                ${lastO.date} ${lastO.element ? '<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-bold">エレメント交換あり</span>' : ''}
                            </div>
                            <div class="text-gray-500 mt-0.5">${lastO.mileage} km ${lastO.memo ? '| ' + lastO.memo : ''}</div>
                        </div>
                        <b class="text-sm text-gray-900">${lastO.cost.toLocaleString()}円</b>
                    </div>
                ` : '<div class="text-gray-400 py-1">オイル交換の記録がありません</div>';
            }

            const sortedI = [...data.inspections].sort((a, b) => new Date(b.date) - new Date(a.date));
            const lastI = sortedI[0];
            let inspMsg = "車検記録が未登録です";
            if (lastI) {
                const nextD = new Date(lastI.date);
                nextD.setFullYear(nextD.getFullYear() + 2);
                const days = Math.ceil((nextD - today) / (1000 * 60 * 60 * 24));
                inspMsg = (days <= 90 && days > 0) ? 
                    `【早期割引チャンス】車検満了まであと ${days} 日！3ヶ月前予約の割引が適用できます。` : 
                    `次回車検予定: ${nextD.toISOString().slice(0, 10)} (あと ${days} 日)`;
            }
            const inspReminder = document.getElementById('inspReminder');
            if(inspReminder) inspReminder.innerHTML = `<div class="bg-purple-50 text-purple-900 p-2.5 rounded-xl font-medium">${inspMsg}</div>`;
            
            const inspList = document.getElementById('inspList');
            if(inspList) {
                inspList.innerHTML = lastI ? `
                    <div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-900">${lastI.date} 実施</div>
                            <div class="text-gray-500 mt-0.5">${lastI.mileage} km ${lastI.memo ? '| ' + lastI.memo : ''}</div>
                        </div>
                        <b class="text-sm text-gray-900">${lastI.cost.toLocaleString()}円</b>
                    </div>
                ` : '<div class="text-gray-400 py-1">車検記録がありません</div>';
            }
        }
    </script></body></html>
