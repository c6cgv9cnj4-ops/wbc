<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>名作文学賞・選出作品ギャラリー</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d97706;
            --accent-hover: #b45309;
            --bg-base: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --selected-bg: #fef3c7;
            --selected-border: #f59e0b;
            --genre-honya: #d97706;
            --genre-naoki: #2563eb;
            --genre-yamamoto: #7c3aed;
            --genre-mystery: #b91c1c;
            --genre-nonfic: #0f766e;
            --genre-bestseller: #c026d3;
            --genre-otherlit: #65a30d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { overflow-x: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px 14px calc(96px + env(safe-area-inset-bottom)) 14px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border-color);
        }
        header h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 6px; text-wrap: balance; }
        header p { color: var(--text-muted); font-size: 0.86rem; }

        .filter-bar {
            position: sticky;
            top: 0;
            z-index: 90;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            margin: 0 -14px 16px;
            background: rgba(248, 250, 252, 0.94);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0;
            appearance: none;
            border: 1.5px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .chip[data-active="true"] { background: var(--primary); border-color: var(--primary); color: #ffffff; }

        .result-count { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
        .result-count b { color: var(--primary); font-variant-numeric: tabular-nums; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 2px solid var(--border-color);
            padding: 18px;
            position: relative;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card.selected {
            border-color: var(--selected-border);
            background-color: var(--selected-bg);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 4px 16px rgba(245, 158, 11, 0.2);
        }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .badge-row { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

        .badge { display: inline-block; font-size: 0.72rem; font-weight: 800; padding: 4px 9px; border-radius: 5px; white-space: nowrap; }
        .badge-genre { color: #ffffff; }
        .badge-score { background: #fff7ed; color: var(--accent-hover); border: 1px solid #fed7aa; font-variant-numeric: tabular-nums; }
        .badge-award { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }

        .pick-toggle {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2.5px solid var(--border-color);
            background: #ffffff;
            color: var(--border-color);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pick-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #ffffff; }
        .pick-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .title { font-size: 1.12rem; font-weight: 800; color: var(--primary); line-height: 1.4; }

        .meta { font-size: 0.84rem; color: var(--text-muted); }
        .meta a { color: var(--primary); font-weight: 700; text-decoration: underline; text-decoration-color: var(--border-color); text-underline-offset: 2px; }
        .meta a:hover { text-decoration-color: var(--accent); }

        .synopsis {
            font-size: 0.87rem;
            color: var(--text-main);
            background-color: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }

        .link-row { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); }

        .link-btn {
            flex: 1;
            min-width: 120px;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .link-btn:hover { border-color: var(--primary); color: var(--primary); }

        .bottom-bar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bottom-bar .count { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; flex-shrink: 0; }
        .bottom-bar .count b { font-size: 1.1rem; color: var(--primary); font-variant-numeric: tabular-nums; }
        .bottom-bar .spacer { flex: 1; }

        .btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-secondary { background-color: #475569; }
        .btn-secondary:hover { background-color: #334155; }

        .toast {
            position: fixed;
            bottom: calc(90px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translate(-50%, 10px);
            background: #1e293b;
            color: white;
            padding: 11px 20px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 200;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        .empty-state { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 40px 20px; }

        .author-chip {
            appearance: none;
            border: none;
            background: none;
            padding: 0;
            font: inherit;
            color: var(--primary);
            font-weight: 700;
            text-decoration: underline;
            text-decoration-color: var(--border-color);
            text-underline-offset: 2px;
            cursor: pointer;
        }
        .author-chip:hover, .author-chip:focus-visible { text-decoration-color: var(--accent); }
        .author-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 290;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }
        .sheet-overlay.open { opacity: 1; visibility: visible; }

        .author-sheet {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 300;
            background: var(--card-bg);
            border-radius: 18px 18px 0 0;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: translateY(105%);
            transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .author-sheet.open { transform: translateY(0); }
        .author-sheet.dragging { transition: none; }

        .sheet-handle-area {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            padding: 10px 0 4px;
            cursor: grab;
            touch-action: none;
        }
        .sheet-handle {
            width: 40px; height: 4px;
            border-radius: 999px;
            background: var(--border-color);
        }

        .sheet-header {
            flex-shrink: 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            padding: 0 20px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-header-main { min-width: 0; }
        .sheet-author-name { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
        .sheet-author-name a { font-size: 0.78rem; font-weight: 700; color: var(--accent-hover); margin-left: 6px; text-decoration: none; }
        .sheet-tagline { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; line-height: 1.6; }
        .sheet-close {
            flex-shrink: 0;
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1.5px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .sheet-close:hover { border-color: var(--primary); color: var(--primary); }

        .sheet-body {
            overflow-y: auto;
            padding: 14px 20px calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .work-item {
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .work-title-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .work-title { font-weight: 800; color: var(--primary); font-size: 0.98rem; }
        .work-year { font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .work-desc { font-size: 0.83rem; color: var(--text-main); margin-top: 4px; line-height: 1.6; }
        .work-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .work-links .link-btn { flex: 0 0 auto; min-width: 0; min-height: 34px; font-size: 0.72rem; padding: 6px 10px; }

        .sheet-empty { font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 20px 0; }

        body.modal-open { overflow: hidden; }

        @media (prefers-reduced-motion: reduce) {
            .card, .btn, .chip, .pick-toggle, .toast, .link-btn, .author-sheet, .sheet-overlay { transition: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>名作文学賞・選出作品ギャラリー</h1>
        <p>気になる作品を「ポチる」で選んで、図書館の検索や共有にすぐ使えます。</p>
    </header>

    <div class="filter-bar" id="filterBar"></div>
    <div class="result-count"><b id="resultCount">0</b> 件表示中</div>

    <div class="grid" id="book-grid"></div>
</div>

<div class="bottom-bar">
    <div class="count">選択中<br><b id="count">0</b> 件</div>
    <div class="spacer"></div>
    <button class="btn" id="copyBtn" onclick="copySelected()">テキストコピー</button>
    <button class="btn btn-secondary" id="shareBtn" onclick="shareSelected()">外部へ共有</button>
</div>

<div id="toast" class="toast"></div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeAuthorSheet()"></div>
<div class="author-sheet" id="authorSheet" role="dialog" aria-modal="true" aria-labelledby="sheetAuthorName">
    <div class="sheet-handle-area" id="sheetHandle"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
        <div class="sheet-header-main">
            <div class="sheet-author-name" id="sheetAuthorName"></div>
            <div class="sheet-tagline" id="sheetTagline"></div>
        </div>
        <button class="sheet-close" onclick="closeAuthorSheet()" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
    /*
      genre: honya-taisho / naoki / yamamoto / mystery / nonfiction
      score: 本屋大賞の公式得点(number)。非公開・対象外はnull
      age: 受賞・選出当時の年齢。生年月日まで裏取りできたもののみ数値、それ以外はnull
      wikipediaExists: falseの場合は著者名をリンクにしない
      出典: 本屋大賞公式サイト／各出版社プレスリリース／日本文学振興会／Wikipediaで個別に裏取り済み
            （ユーザー提示リストのうち『火花』は芥川賞、『赤めだか』は講談社エッセイ賞、
             『孤狼の血』は日本推理作家協会賞、『機龍警察』『震える牛』『ヤクザと原発』は
             大藪春彦賞受賞の裏付けが取れなかったため、事実確認の結果を優先して除外・修正）
    */
    const booksData = [
        { id:"b00", genre:"honya-taisho", awardLabel:"2026年 本屋大賞", score:452.0,
          title:"イン・ザ・メガチャーチ", author:"朝井リョウ", age:36, wikipediaExists:true,
          synopsis:"沈みゆく日本で沸騰するファンダム経済を舞台に、アイドル運営に関わる男、心労を癒やしたい大学生、推しの報道に揺れる元ファンの3人の視点から、人々の心を動かす物語の熱狂と功罪を鋭く抉り出した意欲作。" },
        { id:"b01", genre:"honya-taisho", awardLabel:"2025年 本屋大賞", score:581.5,
          title:"カフネ", author:"阿部暁子", age:null, wikipediaExists:true,
          synopsis:"突然の離婚と弟の急死に見舞われた薫子は、亡き弟の恋人だった家事代行スタッフ・せつと出会う。ともに食卓を囲む時間を重ねながら、傷ついた心をゆっくり温め直していく再生の物語。" },
        { id:"b02", genre:"honya-taisho", awardLabel:"2025年 本屋大賞 2位", score:353,
          title:"アルプス席の母", author:"早見和真", age:47, wikipediaExists:true,
          synopsis:"甲子園を目指す息子のために大阪へ移り住んだ母。強豪校特有のしがらみと周囲との軋轢に悩みながらも、アルプス席から我が子を見守り続ける姿を描く親子の物語。" },
        { id:"b03", genre:"honya-taisho", awardLabel:"2025年 本屋大賞 ノミネート", score:null,
          title:"禁忌の子", author:"山口未桜", age:null, wikipediaExists:true,
          synopsis:"搬送された身元不明の遺体は、自分と瓜二つの顔をしていた。現役医師である著者が、生命倫理の深い闇に踏み込みながら自らのルーツの謎を追う本格医療ミステリー。" },
        { id:"b04", genre:"honya-taisho", awardLabel:"2024年 本屋大賞", score:null,
          title:"成瀬は天下を取りにいく", author:"宮島未奈", age:40, wikipediaExists:true,
          synopsis:"滋賀県大津市を舞台に、「この夏を西武に捧げる」と宣言した破天荒な女子高生・成瀬あかり。誰の目も気にせず突き進む姿が痛快な、連作短編形式の青春小説。" },
        { id:"b05", genre:"honya-taisho", awardLabel:"2023年 本屋大賞", score:443.5,
          title:"汝、星のごとく", author:"凪良ゆう", age:50, wikipediaExists:true,
          synopsis:"瀬戸内の島で出会った男女が、それぞれの家庭の事情や生きづらさに翻弄されながら、長い年月をかけて育んでいく複雑な愛の形。著者は史上最速で2度目の大賞受賞。" },
        { id:"b06", genre:"honya-taisho", awardLabel:"2022年 本屋大賞", score:463.5,
          title:"同志少女よ、敵を撃て", author:"逢坂冬馬", age:36, wikipediaExists:true,
          synopsis:"独ソ戦下、家族と故郷を奪われた少女が女性狙撃兵として戦場に身を投じる。仲間との訓練と過酷な実戦を通じ、戦争の意味を問い直していくデビュー作歴史小説。" },
        { id:"b07", genre:"honya-taisho", awardLabel:"2021年 本屋大賞", score:null,
          title:"52ヘルツのクジラたち", author:"町田そのこ", age:41, wikipediaExists:true,
          synopsis:"誰にも届かない孤独な声を持つ人々が、大分の海辺の町で偶然出会う。互いの過去の傷を抱えながらも寄り添い、再生していく姿を描いたヒューマンドラマ。" },
        { id:"b08", genre:"honya-taisho", awardLabel:"2020年 本屋大賞", score:null,
          title:"流浪の月", author:"凪良ゆう", age:47, wikipediaExists:true,
          synopsis:"かつて誘拐事件の当事者とされ世間に消費された男女が、大人になって再び交わっていく。周囲の偏見や決めつけにあらがいながら、正しさとは何かを問う物語。" },
        { id:"b09", genre:"honya-taisho", awardLabel:"2018年 本屋大賞", score:651,
          title:"かがみの孤城", author:"辻村深月", age:38, wikipediaExists:true,
          synopsis:"学校に居場所を失った中学生が、鏡の中に現れた城に集められた同世代の子どもたちと過ごす日々。心の傷を少しずつ癒やしていく、過去最高得点で受賞したファンタジー。" },
        { id:"b10", genre:"honya-taisho", awardLabel:"2017年 本屋大賞（第156回直木賞とW受賞）", score:null,
          title:"蜜蜂と遠雷", author:"恩田陸", age:52, wikipediaExists:true,
          synopsis:"国際ピアノコンクールの舞台に集った若きピアニストたちの葛藤と才能の開花を、圧倒的な熱量で描き切る音楽小説。史上初となる直木賞との同時受賞を果たした話題作。" },
        { id:"b11", genre:"naoki", awardLabel:"第163回 直木賞", score:null,
          title:"少年と犬", author:"馳星周", age:55, wikipediaExists:true,
          synopsis:"東日本大震災で飼い主を失った犬「多聞」。各地でこの犬と関わることになった人々それぞれの人生を、犬の視点も交えながら静かに描き出す連作短編集。" },
        { id:"b12", genre:"naoki", awardLabel:"第166回 直木賞（黒牢城とW受賞）", score:null,
          title:"塞王の楯", author:"今村翔吾", age:37, wikipediaExists:true,
          synopsis:"「絶対に破られない石垣」を築く穴太衆の職人と、「どんな城も落とす砲」を作る国友衆の鉄砲職人。戦国の攻防戦を通じて相反する信念がぶつかり合う歴史小説。" },
        { id:"b13", genre:"naoki", awardLabel:"第166回 直木賞（第12回山田風太郎賞とW受賞）", score:null,
          title:"黒牢城", author:"米澤穂信", age:null, wikipediaExists:true,
          synopsis:"戦国武将・荒木村重が織田信長に反旗を翻し有岡城に籠城する中、幽閉された囚人の推理を頼りに城内の不可解な事件を解く。歴史小説と本格ミステリを融合させた傑作。" },
        { id:"b14", genre:"yamamoto", awardLabel:"第34回 山本周五郎賞（第165回直木賞とW受賞）", score:null,
          title:"テスカトリポカ", author:"佐藤究", age:43, wikipediaExists:true,
          synopsis:"メキシコの麻薬カルテルを生き延びた男と日本の裏社会が交錯する。暴力とアステカ神話が渦巻く中で運命が絡み合っていく、17年ぶり史上2例目のW受賞クライムノベル。" },
        { id:"b15", genre:"yamamoto", awardLabel:"第27回 山本周五郎賞", score:null,

    const selectedBooks = new Set();
    let activeFilter = "all";

    function renderFilterBar() {
        const bar = document.getElementById('filterBar');
        const genresPresent = GENRE_ORDER.filter(g => booksData.some(b => b.genre === g));
        const chips = [{ key: "all", label: "すべて" }].concat(
            genresPresent.map(g => ({ key: g, label: GENRE_LABELS[g] || g }))
        );
        bar.innerHTML = chips.map(c => `
            <button class="chip" data-active="${activeFilter === c.key}" onclick="setFilter('${c.key}')">${c.label}</button>
        `).join('');
    }

    function setFilter(key) {
        activeFilter = key;
        renderFilterBar();
        renderCards();
    }

    function amazonUrl(book) {
        return "https://www.amazon.co.jp/s?k=" + encodeURIComponent(book.title + " " + book.author);
    }
    function bookmeterUrl(book) {
        return "https://bookmeter.com/search?keyword=" + encodeURIComponent(book.title);
    }
    function wikipediaUrl(book) {
        return "https://ja.wikipedia.org/wiki/" + encodeURIComponent(book.author);
    }

    function openKitamotoLibrarySearch(book) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = 'https://www.lics-saas.nexs-service.jp/kitamoto/webopac/searchinput.do';
        form.target = '_blank';
        form.rel = 'noopener';
        const fields = {
            searching: '0', menukbn: '0', subkbn: '0', histname: '', histnum: '1',
            count: '10', bkskbn: '', btskbn: '', bkskbnHdn: '', btskbnHdn: '',
            bkskbnRange: '', btskbnRange: '', authorid: '',
            keyword: book.title
        };
        Object.entries(fields).forEach(([k, v]) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = k;
            input.value = v;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
        form.remove();
    }

    function renderCards() {
        const container = document.getElementById('book-grid');
        const list = booksData.filter(b => activeFilter === "all" || b.genre === activeFilter);
        document.getElementById('resultCount').textContent = list.length;

        if (list.length === 0) {
            container.innerHTML = '<div class="empty-state">該当する作品がありません</div>';
            return;
        }

        container.innerHTML = list.map(book => {
            const isSelected = selectedBooks.has(book.id);
            const genreBadge = `<span class="badge badge-genre" style="background:${GENRE_COLORS[book.genre] || '#64748b'}">${GENRE_LABELS[book.genre] || book.genre}</span>`;
            const awardBadge = `<span class="badge badge-award">${book.awardLabel}</span>`;
            const scoreBadge = (book.score !== null && book.score !== undefined)
                ? `<span class="badge badge-score">★ ${book.score.toFixed(1)}点</span>` : '';
            const ageText = (book.age !== null && book.age !== undefined) ? `（${book.age}歳）` : '';
            const authorHtml = `<button class="author-chip" onclick='openAuthorSheet(${JSON.stringify(book.author)}, ${!!book.wikipediaExists})'>${book.author}</button>`;

            return `
            <div class="card ${isSelected ? 'selected' : ''}" id="card-${book.id}">
                <div class="card-top">
                    <div class="badge-row">
                        ${genreBadge}
                        ${awardBadge}
                        ${scoreBadge}
                    </div>
                    <button class="pick-toggle" aria-pressed="${isSelected}" onclick="toggleSelect('${book.id}')" aria-label="${book.title}をポチる">
                        ${isSelected ? '✓' : '✛'}
                    </button>
                </div>
                <div class="title">${book.title}</div>
                <div class="meta">著者: ${authorHtml}${ageText}</div>
                <div class="synopsis">${book.synopsis}</div>
                <div class="link-row">
                    <a class="link-btn" href="${amazonUrl(book)}" target="_blank" rel="noopener noreferrer">Amazonで確認</a>
                    <a class="link-btn" href="${bookmeterUrl(book)}" target="_blank" rel="noopener noreferrer">読書メーター</a>
                    <button class="link-btn" onclick='openKitamotoLibrarySearch(${JSON.stringify(book)})'>北本図書館で探す</button>
                </div>
            </div>`;
        }).join('');
    }

    function toggleSelect(id) {
        if (selectedBooks.has(id)) selectedBooks.delete(id);
        else selectedBooks.add(id);
        document.getElementById('count').textContent = selectedBooks.size;
        const card = document.getElementById(`card-${id}`);
        if (card) {
            card.classList.toggle('selected', selectedBooks.has(id));
            const btn = card.querySelector('.pick-toggle');
            const on = selectedBooks.has(id);
            btn.setAttribute('aria-pressed', on);
            btn.textContent = on ? '✓' : '✛';
        }
    }

    function getFormattedText() {
        if (selectedBooks.size === 0) return null;
        const list = booksData.filter(b => selectedBooks.has(b.id));
        let text = "【図書館予約・読書候補リスト】\n";
        list.forEach(b => {
            const tag = (b.score !== null && b.score !== undefined) ? `★${b.score.toFixed(1)}点` : b.awardLabel;
            text += `・『${b.title}』${b.author}${b.age ? ` (${b.age}歳)` : ''} [${b.awardLabel} / ${tag}]\n`;
        });
        text += "---\n名作文学賞・選出作品ギャラリー";
        return text;
    }

    async function shareSelected() {
        const text = getFormattedText();
        if (!text) { showToast("先に作品を「ポチる」で選んでください"); return; }
        if (navigator.share) {
            try {
                await navigator.share({ title: '名作文学賞・選出作品ギャラリー', text });
            } catch (err) {
                if (err.name !== 'AbortError') copySelected();
            }
        } else {
            copySelected();
        }
    }

    function copySelected() {
        const text = getFormattedText();
        if (!text) { showToast("先に作品を「ポチる」で選んでください"); return; }
        navigator.clipboard.writeText(text).then(() => {
            showToast("コピーしました");
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast("コピーしました"); }
            catch (e) { showToast("コピーに失敗しました"); }
            document.body.removeChild(ta);
        });
    }

    function authorWikipediaUrl(author) {
        return "https://ja.wikipedia.org/wiki/" + encodeURIComponent(author);
    }
    function workAmazonUrl(title, author) {
        return "https://www.amazon.co.jp/s?k=" + encodeURIComponent(title + " " + author);
    }
    function workBookmeterUrl(title) {
        return "https://bookmeter.com/search?keyword=" + encodeURIComponent(title);
    }
    function openWorkLibrarySearch(title) {
        openKitamotoLibrarySearch({ title: title });
    }

    function openAuthorSheet(author, wikipediaExists) {
        const profile = authorWorks[author];
        document.getElementById('sheetAuthorName').innerHTML =
            author + (wikipediaExists ? ` <a href="${authorWikipediaUrl(author)}" target="_blank" rel="noopener noreferrer">Wikipediaで見る↗</a>` : '');
        document.getElementById('sheetTagline').textContent = profile ? profile.tagline : 'この著者の代表作データは準備中です';

        const body = document.getElementById('sheetBody');
        if (profile && profile.works && profile.works.length) {
            body.innerHTML = profile.works.map(w => `
                <div class="work-item">
                    <div class="work-title-row">
                        <span class="work-title">${w.title}</span>
                        ${w.year ? `<span class="work-year">${w.year}年</span>` : ''}
                    </div>
                    ${w.desc ? `<div class="work-desc">${w.desc}</div>` : ''}
                    <div class="work-links">
                        <a class="link-btn" href="${workAmazonUrl(w.title, author)}" target="_blank" rel="noopener noreferrer">Amazonで確認</a>
                        <a class="link-btn" href="${workBookmeterUrl(w.title)}" target="_blank" rel="noopener noreferrer">読書メーター</a>
                        <button class="link-btn" onclick='openWorkLibrarySearch(${JSON.stringify(w.title)})'>北本図書館で探す</button>
                    </div>
                </div>
            `).join('');
        } else {
            body.innerHTML = `
                <div class="sheet-empty">代表作リストは準備中です。ひとまず著者名でAmazon・読書メーターを検索できます。</div>
                <div class="work-links" style="justify-content:center;">
                    <a class="link-btn" href="${workAmazonUrl('', author)}" target="_blank" rel="noopener noreferrer">Amazonで著者名検索</a>
                    <a class="link-btn" href="${workBookmeterUrl(author)}" target="_blank" rel="noopener noreferrer">読書メーターで検索</a>
                </div>`;
        }

        document.getElementById('sheetOverlay').classList.add('open');
        document.getElementById('authorSheet').classList.add('open');
        document.body.classList.add('modal-open');
    }

    function closeAuthorSheet() {
        document.getElementById('sheetOverlay').classList.remove('open');
        document.getElementById('authorSheet').classList.remove('open');
        document.body.classList.remove('modal-open');
    }
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAuthorSheet();
    });

    (function setupSheetDrag() {
        const sheet = document.getElementById('authorSheet');
        const handle = document.getElementById('sheetHandle');
        let startY = 0, currentY = 0, dragging = false;

        handle.addEventListener('touchstart', (e) => {
            dragging = true;
            startY = e.touches[0].clientY;
            sheet.classList.add('dragging');
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
            if (!dragging) return;
            currentY = Math.max(0, e.touches[0].clientY - startY);
            sheet.style.transform = `translateY(${currentY}px)`;
        }, { passive: true });

        handle.addEventListener('touchend', () => {
            if (!dragging) return;
            dragging = false;
            sheet.classList.remove('dragging');
            sheet.style.transform = '';
            if (currentY > 100) closeAuthorSheet();
            currentY = 0;
        });
    })();

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    renderFilterBar();
    renderCards();
</script>

</body>
