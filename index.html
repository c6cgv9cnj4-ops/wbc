<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バドミントン活動・予約・収支管理</title>
  <!-- Chart.js グラフライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --accent: #34c759;
      --accent-blue: #007aff;
      --text: #000000;
      --text-sec: #8e8e93;
      --border: #e5e5ea;
      --danger: #ff3b30;
      --warning: #ff9500;
      --card-radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }
    
    /* 同期ステータスバー */
    .sync-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #e4e4eb;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--text-sec);
      margin-bottom: 16px;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 4px;
    }

    .section-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #1c1c1e;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: -0.2px;
    }
    input, select, textarea {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #f9f9fb;
      appearance: none;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background-color: #fff;
    }

    /* 毎週金曜日の予約リスト */
    .friday-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
    }
    .friday-card {
      background: #f9f9fb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .friday-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .friday-inputs {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .friday-inputs input {
      padding: 8px 10px;
      font-size: 0.85rem;
    }
    .complete-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .undo-btn {
      background: #ff9500;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* 完了済みリスト */
    .completed-box {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }

    /* ピルボタン選択 ＆ 削除機能 */
    .pills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .pill-wrapper {
      display: inline-flex;
      align-items: center;
      border-radius: 20px;
      background: #f0f0f4;
      padding: 4px 8px 4px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      user-select: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .pill-wrapper.active {
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    .pill-label {
      cursor: pointer;
      margin-right: 6px;
    }
    .pill-del-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      line-height: 1;
    }
    .pill-wrapper.active .pill-del-btn {
      background: rgba(255,255,255,0.3);
    }

    .calc-preview {
      background: #f4f1f9;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      color: #3a3a3c;
      margin-top: 8px;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
    }

    /* サマリー・グラフ */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: #f9f9fb;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .summary-card .val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .summary-card .lbl { font-size: 0.7rem; color: var(--text-sec); }

    .chart-container {
      position: relative;
      height: 200px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--text-sec); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏸 バドミントン管理</h1>

  <!-- クラウド自動同期ステータスバー -->
  <div class="sync-status-bar">
    <div><span class="sync-dot" id="syncDot"></span><span id="syncText">クラウド同期中...</span></div>
    <button onclick="fetchCloudData()" style="border:none; background:none; color:var(--accent-blue); font-size:0.75rem; font-weight:600; cursor:pointer;">手動更新</button>
  </div>

  <!-- 【1番目】👥 メンバーと金額設定 -->
  <div class="section-card">
    <div class="section-title">👥 メンバーと金額設定</div>

    <div class="form-group">
      <label>メンバー追加</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newMemberName" placeholder="名前を入力..." style="flex:1;">
        <button type="button" onclick="addNewMember()" style="background:#007aff; color:white; border:none; border-radius:8px; padding:0 14px; font-weight:600;">登録</button>
      </div>
    </div>

    <div class="form-group">
      <label>メンバー選択 (タップで選択 / ×で削除)</label>
      <div class="pills-grid" id="memberPills">
        <!-- JSで生成 -->
      </div>
    </div>

    <div class="form-row" style="margin-top:10px;">
      <div class="form-group">
        <label>開催年月日</label>
        <input type="date" id="eventDate">
      </div>
      <div class="form-group">
        <label>時間帯 (金曜)</label>
        <select id="timeSlot">
          <option value="20:00〜22:00">20:00〜22:00 (2h)</option>
          <option value="19:00〜22:00">19:00〜22:00 (3h)</option>
          <option value="18:00〜22:00">18:00〜22:00 (4h)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>会費単価 (円)</label>
      <input type="number" id="memberRate" value="700" placeholder="700" onfocus="this.select()" oninput="updateCalculation()">
    </div>

    <div class="calc-preview" id="feeSummaryPreview">
      会費収入合計: 0 円
    </div>

    <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">

    <div class="form-group">
      <label>コート代 (円)</label>
      <input type="number" id="courtFee" value="0" placeholder="0" onfocus="this.select()">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>シャトル購入額 (円)</label>
        <input type="number" id="shuttleFee" value="0" onfocus="this.select()" oninput="calcShuttleUnit()">
      </div>
      <div class="form-group">
        <label>購入数 (ダース)</label>
        <input type="number" id="shuttleDozens" value="0" onfocus="this.select()" oninput="calcShuttleUnit()">
      </div>
    </div>
    <div id="shuttleUnitText" style="font-size:0.75rem; color:var(--text-sec); margin-bottom:8px;"></div>

    <button type="button" class="submit-btn" onclick="addRecord()">今回の活動・収支を保存する</button>
  </div>

  <!-- 【2番目】📊 収支＆グラフ -->
  <div class="section-card">
    <div class="section-title">📊 収支＆グラフ</div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="lbl">手元繰越残高</div>
        <div class="val" id="totalBalance" style="color:var(--accent);">0 円</div>
      </div>
      <div class="summary-card">
        <div class="lbl">累計収入</div>
        <div class="val" id="totalIncome">0 円</div>
      </div>
      <div class="summary-card">
        <div class="lbl">累計コート代</div>
        <div class="val" id="totalCourt">0 円</div>
      </div>
      <div class="summary-card">
        <div class="lbl">累計シャトル代</div>
        <div class="val" id="totalShuttle">0 円</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="balanceChart"></canvas>
    </div>

    <div style="margin-top:16px; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>人数</th>
            <th>コート代</th>
            <th>シャトル代</th>
            <th>単回収支</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 【3番目】📅 今後3ヶ月の金曜予約リスト -->
  <div class="section-card">
    <div class="section-title">
      <span>📅 今後3ヶ月の金曜予約リスト</span>
      <small style="font-size:0.75rem; color:var(--text-sec);">コート代入力で完了・消去</small>
    </div>
    
    <div class="friday-list" id="fridayListContainer">
      <!-- JSで動的生成 -->
    </div>

    <div class="completed-box">
      <div style="font-size:0.75rem; font-weight:600; color:var(--text-sec); margin-bottom:6px;">
        ✅ 予約完了済み（押し間違いは「元に戻す」で復活）
      </div>
      <div id="completedFridayContainer" style="display:flex; flex-direction:column; gap:6px;">
        <!-- JSで動的生成 -->
      </div>
    </div>
  </div>

</div>

<script>
  // オンライン共有用API設定
  const BIN_ID = '66ab3d82acd3cb34a86f912a'; 
  const API_KEY = '$2a$10$9cO4r0P3vNf40.7P00Rk/O6eBq7e5W9w9/J1u3x8p9W7x9y0z1234';

  let memberList = ['細川', '田中', '鈴木', '佐藤', '高橋', '渡辺'];
  let selectedMembers = [];
  let records = [];
  let completedFridays = [];
  let chartInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('eventDate').valueAsDate = new Date();
    fetchCloudData();
    // 15秒ごとにバックグラウンドで自動同期
    setInterval(fetchCloudData, 15000);
  });

  // クラウドから最新データを読み込み
  async function fetchCloudData() {
    updateSyncStatus('同期中...', '#ff9500');
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Access-Key': API_KEY }
      });
      if (res.ok) {
        const data = await res.json();
        const recordData = data.record;
        if (recordData) {
          memberList = recordData.members || memberList;
          records = recordData.records || [];
          completedFridays = recordData.completedFridays || [];
          renderAll();
          updateSyncStatus('完全同期完了', '#34c759');
        }
      } else {
        fallbackLocalStorage();
      }
    } catch (e) {
      fallbackLocalStorage();
    }
  }

  // クラウドへ変更データを自動送信
  async function pushCloudData() {
    updateSyncStatus('送信中...', '#007aff');
    const payload = {
      members: memberList,
      records: records,
      completedFridays: completedFridays
    };

    localStorage.setItem('badminton_members_list', JSON.stringify(memberList));
    localStorage.setItem('badminton_app_records', JSON.stringify(records));
    localStorage.setItem('badminton_completed_fridays', JSON.stringify(completedFridays));

    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Key': API_KEY
        },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        updateSyncStatus('完全同期完了', '#34c759');
      }
    } catch (e) {
      updateSyncStatus('ローカル保存済み', '#ff9500');
    }
  }

  function fallbackLocalStorage() {
    memberList = JSON.parse(localStorage.getItem('badminton_members_list')) || memberList;
    records = JSON.parse(localStorage.getItem('badminton_app_records')) || [];
    completedFridays = JSON.parse(localStorage.getItem('badminton_completed_fridays')) || [];
    renderAll();
    updateSyncStatus('オフラインモード', '#8e8e93');
  }

  function updateSyncStatus(text, color) {
    document.getElementById('syncText').textContent = text;
    document.getElementById('syncDot').style.background = color;
  }

  function renderAll() {
    renderFridayList();
    renderPills();
    updateCalculation();
    renderHistoryAndCharts();
  }

  // 今後3ヶ月の金曜日リスト生成
  function renderFridayList() {
    const container = document.getElementById('fridayListContainer');
    const completedContainer = document.getElementById('completedFridayContainer');
    container.innerHTML = '';
    completedContainer.innerHTML = '';

    const today = new Date();
    const threeMonthsLater = new Date();
    threeMonthsLater.setMonth(today.getMonth() + 3);

    let cur = new Date(today);
    while (cur.getDay() !== 5) {
      cur.setDate(cur.getDate() + 1);
    }

    let count = 0;
    while (cur <= threeMonthsLater) {
      const dateStr = cur.toISOString().split('T')[0];

      if (!completedFridays.includes(dateStr)) {
        count++;
        const card = document.createElement('div');
        card.className = 'friday-card';
        card.innerHTML = `
          <div class="friday-header">
            <span>📅 ${dateStr} (金)</span>
          </div>
          <div class="friday-inputs">
            <input type="number" id="f_court_${dateStr}" placeholder="コート代 (円)" onfocus="this.select()">
            <button class="complete-btn" onclick="completeFridayReservation('${dateStr}')">予約完了</button>
          </div>
        `;
        container.appendChild(card);
      } else {
        const compDiv = document.createElement('div');
        compDiv.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#f0f0f4; padding:6px 10px; border-radius:6px; font-size:0.8rem;";
        compDiv.innerHTML = `
          <span>📅 ${dateStr} (金) - 完了済み</span>
          <button class="undo-btn" onclick="undoFridayReservation('${dateStr}')">元に戻す</button>
        `;
        completedContainer.appendChild(compDiv);
      }
      cur.setDate(cur.getDate() + 7);
    }

    if (count === 0) {
      container.innerHTML = '<div style="font-size:0.85rem; color:var(--text-sec); text-align:center; padding:12px;">3ヶ月先までの予約はすべて完了しています</div>';
    }
    if (completedContainer.children.length === 0) {
      completedContainer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-sec);">完了済みの予約はありません</div>';
    }
  }

  // 予約完了処理
  function completeFridayReservation(dateStr) {
    const courtExpense = Number(document.getElementById(`f_court_${dateStr}`).value) || 0;

    completedFridays.push(dateStr);

    const item = {
      id: Date.now(),
      date: dateStr,
      time: '金曜枠',
      isReserved: true,
      courtExpense: courtExpense,
      shuttleExpense: 0,
      memberCount: 0,
      income: 0,
      net: -courtExpense
    };

    records.unshift(item);
    renderAll();
    pushCloudData();
  }

  // 復活処理
  function undoFridayReservation(dateStr) {
    completedFridays = completedFridays.filter(d => d !== dateStr);
    records = records.filter(r => !(r.date === dateStr && r.time === '金曜枠' && r.income === 0));

    renderAll();
    pushCloudData();
  }

  // メンバー追加
  function addNewMember() {
    const input = document.getElementById('newMemberName');
    const name = input.value.trim();
    if (name && !memberList.includes(name)) {
      memberList.push(name);
      input.value = '';
      renderPills();
      pushCloudData();
    }
  }

  // メンバー削除
  function removeMember(name) {
    if (confirm(`「${name}」さんをメンバーから削除しますか？`)) {
      memberList = memberList.filter(m => m !== name);
      selectedMembers = selectedMembers.filter(m => m !== name);
      renderPills();
      updateCalculation();
      pushCloudData();
    }
  }

  function renderPills() {
    const container = document.getElementById('memberPills');
    container.innerHTML = '';
    memberList.forEach(name => {
      const isSelected = selectedMembers.includes(name);
      const wrapper = document.createElement('div');
      wrapper.className = `pill-wrapper ${isSelected ? 'active' : ''}`;
      wrapper.innerHTML = `
        <span class="pill-label" onclick="toggleMember('${name}')">${name}</span>
        <span class="pill-del-btn" onclick="event.stopPropagation(); removeMember('${name}')">✕</span>
      `;
      container.appendChild(wrapper);
    });
  }

  function toggleMember(name) {
    if (selectedMembers.includes(name)) {
      selectedMembers = selectedMembers.filter(m => m !== name);
    } else {
      selectedMembers.push(name);
    }
    renderPills();
    updateCalculation();
  }

  function updateCalculation() {
    const count = selectedMembers.length;
    const rate = Number(document.getElementById('memberRate').value) || 0;
    const total = count * rate;

    document.getElementById('feeSummaryPreview').textContent = 
      `会費収入合計: ${total.toLocaleString()} 円 (${count}名 × ${rate}円)`;
  }

  function calcShuttleUnit() {
    const fee = Number(document.getElementById('shuttleFee').value) || 0;
    const doz = Number(document.getElementById('shuttleDozens').value) || 0;
    const txt = document.getElementById('shuttleUnitText');

    if (fee > 0 && doz > 0) {
      const pcs = doz * 12;
      const unit = (fee / pcs).toFixed(1);
      txt.textContent = `💡 1本あたりの単価: 約 ${unit} 円 (${pcs}本)`;
    } else {
      txt.textContent = '';
    }
  }

  function addRecord() {
    const date = document.getElementById('eventDate').value;
    const time = document.getElementById('timeSlot').value;
    const courtExpense = Number(document.getElementById('courtFee').value) || 0;

    const count = selectedMembers.length;
    const rate = Number(document.getElementById('memberRate').value) || 0;

    const income = count * rate;
    const shuttleExpense = Number(document.getElementById('shuttleFee').value) || 0;
    const net = income - courtExpense - shuttleExpense;

    const item = {
      id: Date.now(),
      date,
      time,
      isReserved: true,
      courtExpense,
      shuttleExpense,
      memberCount: count,
      income,
      net
    };

    records.unshift(item);
    
    selectedMembers = [];
    document.getElementById('memberRate').value = 700;
    document.getElementById('courtFee').value = 0;
    document.getElementById('shuttleFee').value = 0;
    document.getElementById('shuttleDozens').value = 0;
    document.getElementById('shuttleUnitText').textContent = '';
    
    renderAll();
    pushCloudData();
  }

  function renderHistoryAndCharts() {
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    let sumInc = 0, sumCourt = 0, sumShuttle = 0;

    records.forEach(r => {
      sumInc += r.income;
      sumCourt += r.courtExpense;
      sumShuttle += r.shuttleExpense;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.date.slice(5)}</td>
        <td>${r.memberCount}名</td>
        <td>${r.courtExpense.toLocaleString()}円</td>
        <td>${r.shuttleExpense > 0 ? r.shuttleExpense.toLocaleString() + '円' : '-'}</td>
        <td style="font-weight:bold; color:${r.net >= 0 ? 'var(--accent)' : 'var(--danger)'};">
          ${r.net >= 0 ? '+' : ''}${r.net.toLocaleString()}円
        </td>
      `;
      tbody.appendChild(tr);
    });

    const netBal = sumInc - sumCourt - sumShuttle;
    document.getElementById('totalBalance').textContent = (netBal >= 0 ? '+' : '') + netBal.toLocaleString() + ' 円';
    document.getElementById('totalIncome').textContent = sumInc.toLocaleString() + ' 円';
    document.getElementById('totalCourt').textContent = sumCourt.toLocaleString() + ' 円';
    document.getElementById('totalShuttle').textContent = sumShuttle.toLocaleString() + ' 円';

    const recent = [...records].reverse().slice(-6);
    const labels = recent.map(r => r.date.slice(5));
    const dataVals = recent.map(r => r.net);

    const ctx = document.getElementById('balanceChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '単回収支 (円)',
          data: dataVals,
          backgroundColor: dataVals.map(v => v >= 0 ? '#34c759' : '#ff3b30'),
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });
  }
</script>

</body>
</html>
