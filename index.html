<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>バドミントン管理</title>
  <!-- Chart.js グラフライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --system-bg: #f2f2f7;
      --card-bg: #ffffff;
      --accent: #34c759;
      --accent-blue: #007aff;
      --text-primary: #000000;
      --text-secondary: #8e8e93;
      --border-color: rgba(60, 60, 67, 0.12);
      --danger: #ff3b30;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--system-bg);
      color: var(--text-primary);
      margin: 0;
      padding: 20px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Header */
    .app-header {
      margin-bottom: 20px;
      text-align: left;
    }
    .app-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .app-header p {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 4px 0 0;
    }

    /* iOS Style Card */
    .ios-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
      border: 0.5px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 0.5px solid var(--border-color);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select {
      font-family: inherit;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: #f9f9fb;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
      background-color: #ffffff;
    }

    /* 予約カード（スライド・消去アニメーション対応） */
    .friday-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .friday-item {
      background: #f9f9fb;
      border: 0.5px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .friday-item.fade-out {
      opacity: 0;
      transform: translateX(100px);
      max-height: 0;
      padding: 0;
      margin: 0;
      border: none;
      overflow: hidden;
    }

    .friday-date {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .friday-action {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .btn-done {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-done:active {
      opacity: 0.7;
    }

    /* メンバーピル（カプセルUI） */
    .member-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      background: #e9e9ed;
      border-radius: 20px;
      padding: 6px 10px 6px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      user-select: none;
    }

    .pill.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .pill-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.15);
      color: #ffffff;
      font-size: 10px;
      margin-left: 6px;
      line-height: 1;
    }

    .pill.active .pill-remove {
      background: rgba(255, 255, 255, 0.3);
    }

    /* プレビュー領域 */
    .preview-box {
      background: #f4f4f6;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
      text-align: center;
      margin-top: 10px;
    }

    /* アクションボタン */
    .primary-btn {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    .primary-btn:active {
      opacity: 0.8;
    }

    /* サマリーグリッド */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-box {
      background: #f9f9fb;
      border: 0.5px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .summary-val {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-top: 2px;
    }

    .summary-lbl {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* グラフ */
    .chart-box {
      position: relative;
      height: 180px;
      margin-top: 12px;
    }

    /* テーブル */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 4px;
      border-bottom: 0.5px solid var(--border-color);
      text-align: left;
    }

    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="container">
  
  <header class="app-header">
    <h1>バドミントン管理</h1>
    <p>予約・メンバー・収支のオールインワンツール</p>
  </header>

  <!-- 1. 3ヶ月先の金曜予約 -->
  <section class="ios-card">
    <div class="card-header">
      <h2 class="card-title">📅 今後3ヶ月の金曜予約</h2>
      <span class="card-subtitle">入力で完了・消去</span>
    </div>
    <div class="friday-list" id="fridayListContainer">
      <!-- JSで動的描画 -->
    </div>
  </section>

  <!-- 2. メンバー ＆ 活動記録 -->
  <section class="ios-card">
    <div class="card-header">
      <h2 class="card-title">👥 メンバー ＆ 活動登録</h2>
    </div>

    <!-- メンバー追加 -->
    <div class="form-group">
      <label>メンバー追加</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newMemberName" placeholder="名前を入力...">
        <button type="button" onclick="addNewMember()" style="background:var(--accent-blue); color:white; border:none; border-radius:10px; padding:0 16px; font-weight:600; font-size:14px; white-space:nowrap;">登録</button>
      </div>
    </div>

    <!-- メンバー選択 -->
    <div class="form-group">
      <label>参加メンバー（タップで選択 / ✕で削除）</label>
      <div class="member-pills" id="memberPills">
        <!-- JSで動的描画 -->
      </div>
    </div>

    <div class="form-row" style="margin-top: 14px;">
      <div class="form-group">
        <label>開催年月日</label>
        <input type="date" id="eventDate">
      </div>
      <div class="form-group">
        <label>時間帯</label>
        <select id="timeSlot">
          <option value="20:00〜22:00">20:00〜22:00 (2h)</option>
          <option value="19:00〜22:00">19:00〜22:00 (3h)</option>
          <option value="18:00〜22:00">18:00〜22:00 (4h)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>会費単価 (円)</label>
      <input type="number" id="memberRate" value="700" placeholder="700" onfocus="this.select()" oninput="updateCalculation()">
    </div>

    <div class="preview-box" id="feeSummaryPreview">
      会費収入合計: 0 円
    </div>

    <hr style="border:none; border-top:0.5px solid var(--border-color); margin: 16px 0;">

    <div class="form-group">
      <label>コート代 (円)</label>
      <input type="number" id="courtFee" value="0" placeholder="0" onfocus="this.select()">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>シャトル購入額 (円)</label>
        <input type="number" id="shuttleFee" value="0" onfocus="this.select()" oninput="calcShuttleUnit()">
      </div>
      <div class="form-group">
        <label>購入数 (ダース)</label>
        <input type="number" id="shuttleDozens" value="0" onfocus="this.select()" oninput="calcShuttleUnit()">
      </div>
    </div>
    <div id="shuttleUnitText" style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;"></div>

    <button type="button" class="primary-btn" onclick="addRecord()">今回の活動・収支を保存</button>
  </section>

  <!-- 3. 収支 ＆ グラフ -->
  <section class="ios-card">
    <div class="card-header">
      <h2 class="card-title">📊 収支 ＆ トレンド</h2>
    </div>

    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-lbl">手元繰越残高</div>
        <div class="summary-val" id="totalBalance" style="color:var(--accent);">0 円</div>
      </div>
      <div class="summary-card summary-box">
        <div class="summary-lbl">累計収入</div>
        <div class="summary-val" id="totalIncome">0 円</div>
      </div>
      <div class="summary-card summary-box">
        <div class="summary-lbl">累計コート代</div>
        <div class="summary-val" id="totalCourt">0 円</div>
      </div>
      <div class="summary-card summary-box">
        <div class="summary-lbl">累計シャトル代</div>
        <div class="summary-val" id="totalShuttle">0 円</div>
      </div>
    </div>

    <div class="chart-box">
      <canvas id="balanceChart"></canvas>
    </div>

    <div style="margin-top:20px; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>人数</th>
            <th>コート代</th>
            <th>シャトル</th>
            <th>収支</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
  let memberList = JSON.parse(localStorage.getItem('badminton_members_list')) || ['細川', '田中', '鈴木', '佐藤', '高橋', '渡辺'];
  let selectedMembers = [];
  let records = JSON.parse(localStorage.getItem('badminton_app_records')) || [];
  let completedFridays = JSON.parse(localStorage.getItem('badminton_completed_fridays')) || [];
  let chartInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('eventDate').valueAsDate = new Date();
    renderFridayList();
    renderPills();
    updateCalculation();
    renderHistoryAndCharts();
  });

  // 3ヶ月の金曜予約リスト描画
  function renderFridayList() {
    const container = document.getElementById('fridayListContainer');
    container.innerHTML = '';

    const today = new Date();
    const threeMonthsLater = new Date();
    threeMonthsLater.setMonth(today.getMonth() + 3);

    let cur = new Date(today);
    while (cur.getDay() !== 5) {
      cur.setDate(cur.getDate() + 1);
    }

    let count = 0;
    while (cur <= threeMonthsLater) {
      const dateStr = cur.toISOString().split('T')[0];

      if (!completedFridays.includes(dateStr)) {
        count++;
        const item = document.createElement('div');
        item.className = 'friday-item';
        item.id = `friday-item-${dateStr}`;
        item.innerHTML = `
          <div class="friday-date">📅 ${dateStr} (金)</div>
          <div class="friday-action">
            <input type="number" id="f_court_${dateStr}" placeholder="コート代 (円)" onfocus="this.select()">
            <button class="btn-done" onclick="completeFridayReservation('${dateStr}')">完了</button>
          </div>
        `;
        container.appendChild(item);
      }
      cur.setDate(cur.getDate() + 7);
    }

    if (count === 0) {
      container.innerHTML = '<div style="font-size:13px; color:var(--text-secondary); text-align:center; padding:12px;">3ヶ月先までの予約はすべて完了しています</div>';
    }
  }

  // 予約完了（アニメーション付き消去＆収支連動）
  function completeFridayReservation(dateStr) {
    const courtExpense = Number(document.getElementById(`f_court_${dateStr}`).value) || 0;
    const itemEl = document.getElementById(`friday-item-${dateStr}`);

    if (itemEl) {
      itemEl.classList.add('fade-out');
    }

    setTimeout(() => {
      completedFridays.push(dateStr);
      localStorage.setItem('badminton_completed_fridays', JSON.stringify(completedFridays));

      const item = {
        id: Date.now(),
        date: dateStr,
        time: '金曜枠',
        isReserved: true,
        courtExpense: courtExpense,
        shuttleExpense: 0,
        memberCount: 0,
        income: 0,
        net: -courtExpense
      };

      records.unshift(item);
      localStorage.setItem('badminton_app_records', JSON.stringify(records));

      renderFridayList();
      renderHistoryAndCharts();
    }, 300);
  }

  // メンバー追加
  function addNewMember() {
    const input = document.getElementById('newMemberName');
    const name = input.value.trim();
    if (name && !memberList.includes(name)) {
      memberList.push(name);
      localStorage.setItem('badminton_members_list', JSON.stringify(memberList));
      input.value = '';
      renderPills();
    }
  }

  // メンバー削除
  function removeMember(name) {
    if (confirm(`「${name}」さんをメンバーから削除しますか？`)) {
      memberList = memberList.filter(m => m !== name);
      selectedMembers = selectedMembers.filter(m => m !== name);
      localStorage.setItem('badminton_members_list', JSON.stringify(memberList));
      renderPills();
      updateCalculation();
    }
  }

  function renderPills() {
    const container = document.getElementById('memberPills');
    container.innerHTML = '';
    memberList.forEach(name => {
      const isSelected = selectedMembers.includes(name);
      const pill = document.createElement('div');
      pill.className = `pill ${isSelected ? 'active' : ''}`;
      pill.innerHTML = `
        <span onclick="toggleMember('${name}')">${name}</span>
        <span class="pill-remove" onclick="event.stopPropagation(); removeMember('${name}')">✕</span>
      `;
      container.appendChild(pill);
    });
  }

  function toggleMember(name) {
    if (selectedMembers.includes(name)) {
      selectedMembers = selectedMembers.filter(m => m !== name);
    } else {
      selectedMembers.push(name);
    }
    renderPills();
    updateCalculation();
  }

  function updateCalculation() {
    const count = selectedMembers.length;
    const rate = Number(document.getElementById('memberRate').value) || 0;
    const total = count * rate;

    document.getElementById('feeSummaryPreview').textContent = 
      `会費収入合計: ${total.toLocaleString()} 円 (${count}名 × ${rate}円)`;
  }

  function calcShuttleUnit() {
    const fee = Number(document.getElementById('shuttleFee').value) || 0;
    const doz = Number(document.getElementById('shuttleDozens').value) || 0;
    const txt = document.getElementById('shuttleUnitText');

    if (fee > 0 && doz > 0) {
      const pcs = doz * 12;
      const unit = (fee / pcs).toFixed(1);
      txt.textContent = `💡 1本あたりの単価: 約 ${unit} 円 (${pcs}本)`;
    } else {
      txt.textContent = '';
    }
  }

  function addRecord() {
    const date = document.getElementById('eventDate').value;
    const time = document.getElementById('timeSlot').value;
    const courtExpense = Number(document.getElementById('courtFee').value) || 0;

    const count = selectedMembers.length;
    const rate = Number(document.getElementById('memberRate').value) || 0;

    const income = count * rate;
    const shuttleExpense = Number(document.getElementById('shuttleFee').value) || 0;
    const net = income - courtExpense - shuttleExpense;

    const item = {
      id: Date.now(),
      date,
      time,
      isReserved: true,
      courtExpense,
      shuttleExpense,
      memberCount: count,
      income,
      net
    };

    records.unshift(item);
    localStorage.setItem('badminton_app_records', JSON.stringify(records));

    selectedMembers = [];
    document.getElementById('memberRate').value = 700;
    document.getElementById('courtFee').value = 0;
    document.getElementById('shuttleFee').value = 0;
    document.getElementById('shuttleDozens').value = 0;
    document.getElementById('shuttleUnitText').textContent = '';
    renderPills();
    updateCalculation();
    renderHistoryAndCharts();
  }

  function renderHistoryAndCharts() {
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    let sumInc = 0, sumCourt = 0, sumShuttle = 0;

    records.forEach(r => {
      sumInc += r.income;
      sumCourt += r.courtExpense;
      sumShuttle += r.shuttleExpense;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.date.slice(5)}</td>
        <td>${r.memberCount}名</td>
        <td>${r.courtExpense.toLocaleString()}円</td>
        <td>${r.shuttleExpense > 0 ? r.shuttleExpense.toLocaleString() + '円' : '-'}</td>
        <td style="font-weight:bold; color:${r.net >= 0 ? 'var(--accent)' : 'var(--danger)'};">
          ${r.net >= 0 ? '+' : ''}${r.net.toLocaleString()}円
        </td>
      `;
      tbody.appendChild(tr);
    });

    const netBal = sumInc - sumCourt - sumShuttle;
    document.getElementById('totalBalance').textContent = (netBal >= 0 ? '+' : '') + netBal.toLocaleString() + ' 円';
    document.getElementById('totalIncome').textContent = sumInc.toLocaleString() + ' 円';
    document.getElementById('totalCourt').textContent = sumCourt.toLocaleString() + ' 円';
    document.getElementById('totalShuttle').textContent = sumShuttle.toLocaleString() + ' 円';

    const recent = [...records].reverse().slice(-6);
    const labels = recent.map(r => r.date.slice(5));
    const dataVals = recent.map(r => r.net);

    const ctx = document.getElementById('balanceChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '単回収支 (円)',
          data: dataVals,
          backgroundColor: dataVals.map(v => v >= 0 ? '#34c759' : '#ff3b30'),
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { grid: { color: 'rgba(60, 60, 67, 0.08)' } }
        }
      }
    });
  }
</script>

</body>
</html>
