<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WBC 管理アプリ</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #f5f5f7; color: #333; }
    h1 { font-size: 20px; text-align: center; margin-bottom: 15px; }
    .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { padding: 10px 15px; border: none; border-radius: 6px; background: #007aff; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:active { opacity: 0.8; }
    .btn-danger { background: #ff3b30; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
    #sync-status { text-align: center; font-size: 12px; color: #666; margin-bottom: 10px; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>WBC メンバー管理</h1>
  <div id="sync-status">同期状態: 接続中...</div>

  <div class="card">
    <div class="input-group">
      <input type="text" id="memberName" placeholder="メンバー名を入力">
      <button onclick="addMember()">追加</button>
    </div>
  </div>

  <div class="card">
    <h3>メンバー一覧</h3>
    <ul id="memberList"></ul>
  </div>

  <script>
    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyDY1ibVIx1tYfsK2MXxQwOLOhrQWtlc6Nk",
      authDomain: "wbc-app-cf99c.firebaseapp.com",
      databaseURL: "https://wbc-app-cf99c-default-rtdb.firebaseio.com",
      projectId: "wbc-app-cf99c",
      storageBucket: "wbc-app-cf99c.firebasestorage.app"
    };

    // 初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("members");

    const statusEl = document.getElementById("sync-status");

    // リアルタイム同期（データが変更されると自動実行）
    db.on("value", (snapshot) => {
      const listEl = document.getElementById("memberList");
      listEl.innerHTML = "";
      const data = snapshot.val();
      
      statusEl.textContent = "同期状態: リアルタイム同期中 ✓";
      statusEl.style.color = "#34c759";

      if (data) {
        Object.keys(data).forEach((key) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <span>${data[key].name}</span>
            <button class="btn-danger" onclick="removeMember('${key}')">削除</button>
          `;
          listEl.appendChild(li);
        });
      } else {
        listEl.innerHTML = "<li style='color:#999;'>メンバーが登録されていません</li>";
      }
    });

    // メンバー追加
    function addMember() {
      const input = document.getElementById("memberName");
      const name = input.value.trim();
      if (name) {
        db.push({ name: name });
        input.value = "";
      }
    }

    // メンバー削除
    function removeMember(key) {
      db.child(key).remove();
    }
  </script>
</body>
</html>
