<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バドミントン活動・予約・収支管理</title>
  <!-- Chart.js グラフライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --accent: #34c759;
      --accent-blue: #007aff;
      --text: #000000;
      --text-sec: #8e8e93;
      --border: #e5e5ea;
      --danger: #ff3b30;
      --warning: #ff9500;
      --card-radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }
    .section-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #1c1c1e;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: -0.2px;
    }
    input, select, textarea {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #f9f9fb;
      appearance: none;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background-color: #fff;
    }

    /* 毎週金曜日の予約リスト */
    .friday-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
    }
    .friday-card {
      background: #f9f9fb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .friday-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .friday-inputs {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .friday-inputs input {
      padding: 8px 10px;
      font-size: 0.85rem;
    }
    .complete-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* ピルボタン選択 ＆ 削除機能 */
    .pills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .pill-wrapper {
      display: inline-flex;
      align-items: center;
      border-radius: 20px;
      background: #f0f0f4;
      padding: 4px 8px 4px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      user-select: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .pill-wrapper.active {
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    .pill-label {
      cursor: pointer;
      margin-right: 6px;
    }
    .pill-del-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      line-height: 1;
    }
    .pill-wrapper.active .pill-del-btn {
      background: rgba(255,255,255,0.3);
    }

    .calc-preview {
      background: #f4f1f9;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      color: #3a3a3c;
      margin-top: 8px;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
    }

    .sync-btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    /* サマリー・グラフ */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: #f9f9fb;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .summary-card .val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .summary-card .lbl { font-size: 0.7rem; color: var(--text-sec); }

    .chart-container {
      position: relative;
      height: 200px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--text-sec); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏸 バドミントン管理</h1>

  <!-- 1. 3ヶ月先までの金曜日コート予約リスト -->
  <div class="section-card">
    <div class="section-title">
      <span>📅 今後3ヶ月の金曜予約リスト</span>
      <small style="font-size:0.75rem; color:var(--text-sec);">コート代入力で完了・消去</small>
    </div>
    <div class="friday-list" id="fridayListContainer">
      <!-- JSで動的生成 -->
    </div>
  </div>

  <!-- 2. メンバー管理 ＆ 今回の活動記録 -->
  <div class="section-card">
    <div class="section-title">👥 メンバーと金額設定</div>

    <!-- メンバー追加入力欄 -->
    <div class="form-group">
      <label>メンバー追加</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newMemberName" placeholder="名前を入力..." style="flex:1;">
        <button type="button" onclick="addNewMember()" style="background:#007aff; color:white; border:none; border-radius:8px; padding:0 14px; font-weight:600;">登録</button>
      </div>
    </div>

    <div class="form-group">
      <label>メンバー選択 (タップで選択 / ×で削除)</label>
      <div class="pills-grid" id="memberPills">
        <!-- JSで生成 -->
      </div>
    </div>

    <div class="form-row" style="margin-top:10px;">
      <div class="form-group">
        <label>開催年月日</label>
        <input type="date" id="eventDate">
      </div>
      <div class="form-group">
        <label>時間帯 (金曜)</label>
        <select id="timeSlot">
          <option value="20:00〜22:00">20:00〜22:00 (2h)</option>
          <option value="19:00〜22:00">19:00〜22:00 (3h)</option>
          <option value="18:00〜22:00">18:00〜22:00 (4h)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>会費単価 (円)</label>
      <input type="number" id="memberRate" value="700" placeholder="700" onfocus="this.select()" oninput="updateCalculation()">
    </div>

    <div class="calc-preview" id="feeSummaryPreview">
      会費収入合計: 0 円
    </div>

    <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">

    <div class="form-group">
      <label>コート代 (円)</label>
      <input type="number" id="courtFee" value="0" placeholder="0" onfocus="this.select()">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>シャトル購入額 (円)</label>
        <input type="number" id="shuttleFee" value="0" onfocus="this.select()" oninput="calcShuttleUnit()">
      </div>
      <div class="form-group">
        <label>購入数 (ダース)</label>
        <input type="number" id="shuttleDozens" value="0" onfocus="this.select()" oninput="calcShuttleUnit()">
      </div>
    </div>
    <div id="shuttleUnitText" style="font-size:0.75rem; color:var(--text-sec); margin-bottom:8px;"></div>

    <button type="button" class="submit-btn" onclick="addRecord()">今回の活動・収支を保存する</button>
  </div>

  <!-- 3. 収支＆グラフ -->
  <div class="section-card">
    <div class="section-title">📊 3. 収支＆グラフ</div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="lbl">手元繰越残高</div>
        <div class="val" id="totalBalance" style="color:var(--accent);">0 円</div>
      </div>
      <div class="summary-card">
        <div class="lbl">累計収入</div>
        <div class="val" id="totalIncome">0 円</div>
      </div>
      <div class="summary-card">
        <div class="lbl">累計コート代</div>
        <div class="val" id="totalCourt">0 円</div>
      </div>
      <div class="summary-card">
        <div class="lbl">累計シャトル代</div>
        <div class="val" id="totalShuttle">0 円</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="balanceChart"></canvas>
    </div>

    <div style="margin-top:16px; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>人数</th>
            <th>コート代</th>
            <th>シャトル代</th>
            <th>単回収支</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 4. スマホ・PC間のデータ同期（一番下に配置） -->
  <div class="section-card">
    <div class="section-title">
      <span>🔄 PC・スマホ間のメンバー＆データ同期</span>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button type="button" class="sync-btn" onclick="exportData()">PC側: データをコピー</button>
      <button type="button" class="sync-btn" style="background:#5856d6;" onclick="importData()">スマホ側: 復元読み込み</button>
    </div>
    <textarea id="syncDataArea" rows="2" placeholder="ここに同期コードが生成されます（貼り付けて復元可能）" style="width:100%; font-size:0.75rem;"></textarea>
  </div>

</div>

<script>
  let memberList = JSON.parse(localStorage.getItem('badminton_members_list')) || ['細川', '田中', '鈴木', '佐藤', '高橋', '渡辺'];
  let selectedMembers = [];
  let records = JSON.parse(localStorage.getItem('badminton_app_records')) || [];
  let completedFridays = JSON.parse(localStorage.getItem('badminton_completed_fridays')) || [];
  let chartInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('eventDate').valueAsDate = new Date();
    renderFridayList();
    renderPills();
    updateCalculation();
    renderHistoryAndCharts();
  });

  // データ同期機能（エクスポート）
  function exportData() {
    const bundle = {
      members: memberList,
      records: records,
      completedFridays: completedFridays
    };
    const jsonStr = JSON.stringify(bundle);
    document.getElementById('syncDataArea').value = jsonStr;
    navigator.clipboard.writeText(jsonStr);
    alert('データコードをコピーしました！スマホの「同期コード」エリアに貼り付けて復元できます。');
  }

  // データ同期機能（インポート）
  function importData() {
    const jsonStr = document.getElementById('syncDataArea').value.trim();
    if (!jsonStr) {
      alert('同期コードを貼り付けてから復元を押してください。');
      return;
    }
    try {
      const bundle = JSON.parse(jsonStr);
      if (bundle.members) {
        memberList = bundle.members;
        localStorage.setItem('badminton_members_list', JSON.stringify(memberList));
      }
      if (bundle.records) {
        records = bundle.records;
        localStorage.setItem('badminton_app_records', JSON.stringify(records));
      }
      if (bundle.completedFridays) {
        completedFridays = bundle.completedFridays;
        localStorage.setItem('badminton_completed_fridays', JSON.stringify(completedFridays));
      }
      renderFridayList();
      renderPills();
      updateCalculation();
      renderHistoryAndCharts();
      alert('スマホへのデータ復元・同期が完了しました！');
    } catch (e) {
      alert('無効な同期コードです。コピーし直してください。');
    }
  }

  // 1. 今後3ヶ月の金曜日リストを生成＆描画
  function renderFridayList() {
    const container = document.getElementById('fridayListContainer');
    container.innerHTML = '';

    const today = new Date();
    const threeMonthsLater = new Date();
    threeMonthsLater.setMonth(today.getMonth() + 3);

    let cur = new Date(today);
    while (cur.getDay() !== 5) {
      cur.setDate(cur.getDate() + 1);
    }

    let count = 0;
    while (cur <= threeMonthsLater) {
      const dateStr = cur.toISOString().split('T')[0];

      if (!completedFridays.includes(dateStr)) {
        count++;
        const card = document.createElement('div');
        card.className = 'friday-card';
        card.innerHTML = `
          <div class="friday-header">
            <span>📅 ${dateStr} (金)</span>
          </div>
          <div class="friday-inputs">
            <input type="number" id="f_court_${dateStr}" placeholder="コート代 (円)" onfocus="this.select()">
            <button class="complete-btn" onclick="completeFridayReservation('${dateStr}')">予約完了</button>
          </div>
        `;
        container.appendChild(card);
      }
      cur.setDate(cur.getDate() + 7);
    }

    if (count === 0) {
      container.innerHTML = '<div style="font-size:0.85rem; color:var(--text-sec); text-align:center; padding:12px;">3ヶ月先までの予約はすべて完了しています</div>';
    }
  }

  function completeFridayReservation(dateStr) {
    const courtExpense = Number(document.getElementById(`f_court_${dateStr}`).value) || 0;

    completedFridays.push(dateStr);
    localStorage.setItem('badminton_completed_fridays', JSON.stringify(completedFridays));

    const item = {
      id: Date.now(),
      date: dateStr,
      time: '金曜枠',
      isReserved: true,
      courtExpense: courtExpense,
      shuttleExpense: 0,
      memberCount: 0,
      income: 0,
      net: -courtExpense
    };

    records.unshift(item);
    localStorage.setItem('badminton_app_records', JSON.stringify(records));

    renderFridayList();
    renderHistoryAndCharts();
  }

  // メンバー登録（追加）
  function addNewMember() {
    const input = document.getElementById('newMemberName');
    const name = input.value.trim();
    if (name && !memberList.includes(name)) {
      memberList.push(name);
      localStorage.setItem('badminton_members_list', JSON.stringify(memberList));
      input.value = '';
      renderPills();
    }
  }

  // メンバー削除
  function removeMember(name) {
    if (confirm(`「${name}」さんをメンバーから削除しますか？`)) {
      memberList = memberList.filter(m => m !== name);
      selectedMembers = selectedMembers.filter(m => m !== name);
      localStorage.setItem('badminton_members_list', JSON.stringify(memberList));
      renderPills();
      updateCalculation();
    }
  }

  function renderPills() {
    const container = document.getElementById('memberPills');
    container.innerHTML = '';
    memberList.forEach(name => {
      const isSelected = selectedMembers.includes(name);
      const wrapper = document.createElement('div');
      wrapper.className = `pill-wrapper ${isSelected ? 'active' : ''}`;
      wrapper.innerHTML = `
        <span class="pill-label" onclick="toggleMember('${name}')">${name}</span>
        <span class="pill-del-btn" onclick="event.stopPropagation(); removeMember('${name}')">✕</span>
      `;
      container.appendChild(wrapper);
    });
  }

  function toggleMember(name) {
    if (selectedMembers.includes(name)) {
      selectedMembers = selectedMembers.filter(m => m !== name);
    } else {
      selectedMembers.push(name);
    }
    renderPills();
    updateCalculation();
  }

  function updateCalculation() {
    const count = selectedMembers.length;
    const rate = Number(document.getElementById('memberRate').value) || 0;
    const total = count * rate;

    document.getElementById('feeSummaryPreview').textContent = 
      `会費収入合計: ${total.toLocaleString()} 円 (${count}名 × ${rate}円)`;
  }

  function calcShuttleUnit() {
    const fee = Number(document.getElementById('shuttleFee').value) || 0;
    const doz = Number(document.getElementById('shuttleDozens').value) || 0;
    const txt = document.getElementById('shuttleUnitText');

    if (fee > 0 && doz > 0) {
      const pcs = doz * 12;
      const unit = (fee / pcs).toFixed(1);
      txt.textContent = `💡 1本あたりの単価: 約 ${unit} 円 (${pcs}本)`;
    } else {
      txt.textContent = '';
    }
  }

  function addRecord() {
    const date = document.getElementById('eventDate').value;
    const time = document.getElementById('timeSlot').value;
    const courtExpense = Number(document.getElementById('courtFee').value) || 0;

    const count = selectedMembers.length;
    const rate = Number(document.getElementById('memberRate').value) || 0;

    const income = count * rate;
    const shuttleExpense = Number(document.getElementById('shuttleFee').value) || 0;
    const net = income - courtExpense - shuttleExpense;

    const item = {
      id: Date.now(),
      date,
      time,
      isReserved: true,
      courtExpense,
      shuttleExpense,
      memberCount: count,
      income,
      net
    };

    records.unshift(item);
    localStorage.setItem('badminton_app_records', JSON.stringify(records));
    
    // リセット
    selectedMembers = [];
    document.getElementById('memberRate').value = 700;
    document.getElementById('courtFee').value = 0;
    document.getElementById('shuttleFee').value = 0;
    document.getElementById('shuttleDozens').value = 0;
    document.getElementById('shuttleUnitText').textContent = '';
    renderPills();
    updateCalculation();
    renderHistoryAndCharts();
  }

  function renderHistoryAndCharts() {
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    let sumInc = 0, sumCourt = 0, sumShuttle = 0;

    records.forEach(r => {
      sumInc += r.income;
      sumCourt += r.courtExpense;
      sumShuttle += r.shuttleExpense;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.date.slice(5)}</td>
        <td>${r.memberCount}名</td>
        <td>${r.courtExpense.toLocaleString()}円</td>
        <td>${r.shuttleExpense > 0 ? r.shuttleExpense.toLocaleString() + '円' : '-'}</td>
        <td style="font-weight:bold; color:${r.net >= 0 ? 'var(--accent)' : 'var(--danger)'};">
          ${r.net >= 0 ? '+' : ''}${r.net.toLocaleString()}円
        </td>
      `;
      tbody.appendChild(tr);
    });

    const netBal = sumInc - sumCourt - sumShuttle;
    document.getElementById('totalBalance').textContent = (netBal >= 0 ? '+' : '') + netBal.toLocaleString() + ' 円';
    document.getElementById('totalIncome').textContent = sumInc.toLocaleString() + ' 円';
    document.getElementById('totalCourt').textContent = sumCourt.toLocaleString() + ' 円';
    document.getElementById('totalShuttle').textContent = sumShuttle.toLocaleString() + ' 円';

    // グラフ描画
    const recent = [...records].reverse().slice(-6);
    const labels = recent.map(r => r.date.slice(5));
    const dataVals = recent.map(r => r.net);

    const ctx = document.getElementById('balanceChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '単回収支 (円)',
          data: dataVals,
          backgroundColor: dataVals.map(v => v >= 0 ? '#34c759' : '#ff3b30'),
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });
  }
</script>

</body>
</html>
