<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バド対戦表">
<title>バド対戦表</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --card2:#f2f2f7; --label:#1d1d1f; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12);
  --blue:#007aff; --blue-t:rgba(0,122,255,.12); --green:#34c759; --green-t:rgba(52,199,89,.14);
  --orange:#ff9500; --orange-t:rgba(255,149,0,.15); --red:#ff3b30; --red-t:rgba(255,59,48,.12);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --nav:rgba(242,242,247,.82);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24);
    --blue:#0a84ff; --blue-t:rgba(10,132,255,.2); --green:#30d158; --green-t:rgba(48,209,88,.2);
    --orange:#ff9f0a; --orange-t:rgba(255,159,10,.2); --red:#ff453a; --red-t:rgba(255,69,58,.2);
    --shadow:0 0 0 .5px rgba(255,255,255,.06); --nav:rgba(0,0,0,.72);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:16px;line-height:1.4;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:.5px solid var(--sep)}
.nav-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.nav .sub{font-size:12px;color:var(--label2);font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.card.flush{padding:0;overflow:hidden}
.title{font-size:13px;font-weight:700;color:var(--label2);text-transform:none;letter-spacing:.02em;margin:0 4px 8px}
.h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.muted{color:var(--label2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* buttons: iOS pill */
.btn{appearance:none;border:0;border-radius:999px;min-height:46px;padding:0 22px;font-weight:700;font-size:16px;cursor:pointer;
  background:var(--fill);color:var(--blue);transition:transform .12s ease,opacity .12s ease,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active{transform:scale(.95);opacity:.8}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.tint{background:var(--blue-t);color:var(--blue)}
.btn.orange{background:var(--orange-t);color:var(--orange)}
.btn.danger{background:var(--red-t);color:var(--red)}
.btn.plain{background:transparent;padding:0 10px;min-height:34px;font-weight:600;font-size:14px}
.btn.big{min-height:60px;font-size:18px;width:100%;border-radius:30px;padding:10px 18px;line-height:1.25}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px}
.btn.block{width:100%}

/* segmented control (sliding) */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--fill);border-radius:12px;padding:2px;isolation:isolate}
.seg .thumb{position:absolute;z-index:-1;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));border-radius:10px;background:var(--card);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.06);transform:translateX(calc(var(--i)*100%));transition:transform .28s cubic-bezier(.3,.9,.3,1)}
@media (prefers-color-scheme:dark){.seg .thumb{background:#636366}}
.seg-b{appearance:none;border:0;background:transparent;min-height:38px;font-weight:600;font-size:14px;border-radius:10px;cursor:pointer;color:var(--label);white-space:nowrap}
.seg-b.on{font-weight:700}
.seg.lg .seg-b{min-height:46px;font-size:15px}

/* court cards */
.court{position:relative}
.court-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.court-h .n{font-size:15px;font-weight:800;letter-spacing:.01em}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--fill);color:var(--label2)}
.pill.blue{background:var(--blue-t);color:var(--blue)} .pill.green{background:var(--green-t);color:var(--green)}
.pill.orange{background:var(--orange-t);color:var(--orange)} .pill.red{background:var(--red-t);color:var(--red)}
.team{background:var(--card2);border-radius:18px;padding:14px 10px;text-align:center;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.35;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 2px}
.vs{text-align:center;font-size:12px;font-weight:800;color:var(--label3);letter-spacing:.12em;margin:6px 0}
.dot{color:var(--label3);font-weight:600;margin:0 4px}
.nm{display:inline-block;padding:1px 10px;border-radius:999px;border:0;background:transparent;font:inherit;font-weight:inherit;color:inherit;cursor:default}
.nm.me{background:var(--blue);color:#fff}
.nm.edit{cursor:pointer;background:transparent}
.nm.edit:active{transform:scale(.95)}
.nm.sel{background:var(--orange);color:#fff}
.court.mine{box-shadow:0 0 0 2.5px var(--blue),var(--shadow)}
.court.sub{padding:12px 14px;border-radius:20px}
.court.sub .line{font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px}
.court.sub .line .vsm{font-size:11px;font-weight:800;color:var(--label3);margin:0 8px}
.court.sub .court-h{margin-bottom:6px}
.court.sub .court-h .n{font-size:13px;color:var(--label2)}
.court.sub .nm{padding:1px 6px}
.bench{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:999px;background:var(--fill);font-weight:600;font-size:15px}
.chip.me{background:var(--blue);color:#fff}
.chip.off{opacity:.45}
.chip .x{font-size:12px;opacity:.7}
.status{border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.status .k{font-size:13px;font-weight:700;opacity:.85} .status .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.status.play{background:var(--blue);color:#fff} .status.rest{background:var(--orange);color:#fff} .status.next{background:var(--green);color:#fff} .status.idle{background:var(--card);box-shadow:var(--shadow)}
.status.idle .k{color:var(--label2)}
.status .s{font-size:17px;font-weight:700;line-height:1.35;margin-top:2px}
.status.flash{animation:flash 3.5s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 6px var(--orange),0 0 24px var(--orange);transform:scale(1.02)}100%{box-shadow:none;transform:none}}
.offbar{position:fixed;left:0;right:0;top:0;z-index:40;background:var(--red);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}

/* lists */
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;border-top:.5px solid var(--sep)}
.list>.li:first-child{border-top:0}
.li .t{font-weight:600;font-size:16px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--label3);flex:none;display:grid;place-items:center;color:transparent;transition:all .15s;background:transparent}
.li.on .check{background:var(--blue);border-color:var(--blue);color:#fff}
.li.tap{cursor:pointer} .li.tap:active{background:var(--fill)}
.input{appearance:none;width:100%;border:0;background:var(--fill);border-radius:14px;min-height:50px;padding:0 16px;font-size:17px;outline:none}
.input:focus{box-shadow:0 0 0 2px var(--blue)}
select.input{padding-right:12px}
.suggest{max-height:220px;overflow:auto;border-radius:16px;background:var(--card2);margin-top:8px}
.suggest .li{padding:11px 14px;min-height:46px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#5ac8fa,var(--blue));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--fill);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--green)} .switch.on::after{transform:translateX(20px)}
.banner{border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600}
.banner.warn{background:var(--orange-t);color:var(--orange)} .banner.err{background:var(--red-t);color:var(--red)} .banner.info{background:var(--blue-t);color:var(--blue)}
.empty{text-align:center;color:var(--label2);padding:26px 10px;font-weight:600}
.link{color:var(--blue);font-weight:600;font-size:14px;background:none;border:0;padding:6px 4px;cursor:pointer}

/* sheet & toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:800} .sheet p{margin:0 0 14px;color:var(--label2);font-size:14px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(40,40,42,.95);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;animation:up .25s}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{animation:toast .25s} @keyframes toast{from{opacity:0;transform:translate(-50%,16px)}}

/* iOS Inset Grouped (管理タブ) */
.gt{font-size:13px;font-weight:400;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:26px 20px 7px}
.gt:first-child{margin-top:4px}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.grp>.cell{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 16px;position:relative;-webkit-user-select:none;user-select:none}
.grp>.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell.pick{cursor:pointer;transition:background .15s} .cell.pick:active{background:var(--fill)}
.cell.on{background:var(--blue-t)}
.cell .nm2{font-size:17px;font-weight:600;line-height:1.25} .cell .sb{font-size:13px;color:var(--label2);margin-top:1px}
.cell.dim .nm2{color:var(--label2)}
.cell .lead{width:24px;height:24px;border-radius:50%;flex:none;border:1.5px solid var(--label3);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800}
.cell.on .lead{background:var(--blue);border-color:var(--blue);color:#fff}
.more{appearance:none;border:0;width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:18px;font-weight:800;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center;padding:0;padding-bottom:5px}
.more:active{opacity:.6}
.pairbox{display:flex;align-items:stretch;min-height:64px}
.pairbox .half{flex:1;min-width:0;padding:10px 6px 10px 16px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;-webkit-user-select:none;user-select:none}
.pairbox .half+.half{padding-left:6px;padding-right:6px}
.pairbox .half:active{background:var(--fill)}
.pairbox .amp{align-self:center;font-size:18px;flex:none;padding:0 2px}
.unpair{appearance:none;border:0;background:transparent;color:var(--blue);font-size:15px;font-weight:600;padding:0 16px 0 10px;cursor:pointer;flex:none}
.unpair:active{opacity:.5}
.cell.link{color:var(--blue);font-size:17px;cursor:pointer} .cell.link:active{background:var(--fill)}
.cell .urlt{font-size:13px;color:var(--label2);word-break:break-all}
/* action sheet */
.as-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.as{width:100%;max-width:560px;padding:0 10px calc(10px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.as-g{background:var(--card);border-radius:14px;overflow:hidden;margin-top:8px}
.as-t{text-align:center;padding:14px 16px 12px;font-size:13px;color:var(--label2);font-weight:600}
.as-b{display:block;width:100%;appearance:none;border:0;background:transparent;font-size:20px;color:var(--blue);min-height:56px;cursor:pointer;border-top:.5px solid var(--sep)}
.as-t+.as-b{border-top:.5px solid var(--sep)}
.as-b:active{background:var(--fill)} .as-b.bold{font-weight:700}
.prep{padding-bottom:6px}
.hero{padding:22px 22px 20px;border:.5px solid var(--sep)}
.hero-date{font-size:15px;font-weight:600;color:var(--label2)}
.hero-row{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hero-n{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero-u{font-size:20px;font-weight:700;color:var(--label2)}
.hero-hint{margin-top:10px;font-size:15px;font-weight:600;border-radius:14px;padding:10px 14px}
.hero-hint.ok{background:var(--green-t);color:var(--green)} .hero-hint.warn{background:var(--orange-t);color:var(--orange)}
.sec{border:.5px solid var(--sep);padding:20px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:700;color:var(--label2);letter-spacing:.02em}
.sec-n{font-size:13px;font-weight:600;color:var(--label3)}
.sec-empty{font-size:15px;color:var(--label2);background:var(--card2);border-radius:16px;padding:16px;text-align:center}
.pickchips{display:flex;flex-wrap:wrap;gap:10px}
.pchip{appearance:none;border:0;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--fill);color:var(--label);font-weight:600;font-size:17px;cursor:pointer;transition:transform .12s,opacity .12s}
.pchip:active{transform:scale(.95);opacity:.75}
.pchip.on{background:var(--blue-t);color:var(--blue);padding:0 6px 0 18px;cursor:default}
.pchip.on:active{transform:none;opacity:1}
.pchip.on.off{background:var(--orange-t);color:var(--orange)}
.pchip .ptag{font-size:12px;font-weight:700;opacity:.85}
.pchip .px{appearance:none;border:0;width:38px;height:38px;border-radius:50%;background:rgba(60,60,67,.14);color:inherit;font-size:21px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px;margin-left:2px}
.pchip .px:active{opacity:.6}
.opsd{background:var(--card);border-radius:24px;border:.5px solid var(--sep);overflow:hidden}
.opsd>summary{list-style:none;cursor:pointer;padding:16px 20px;font-size:16px;font-weight:600;color:var(--blue);display:flex;align-items:center;justify-content:space-between;min-height:54px}
.opsd>summary::-webkit-details-marker{display:none}
.opsd>summary::after{content:"›";font-size:22px;color:var(--label3);transition:transform .2s}
.opsd[open]>summary::after{transform:rotate(90deg)}
.opsd>.grp{border-radius:0}
.opsd>.card{box-shadow:none;border:0;border-radius:0}
.opsd>.fold-body{padding:0 16px 16px}
.opsd>.fold-body>*+*{margin-top:12px}
.adm-row{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
#pCta{position:sticky;bottom:0;z-index:5}
.cta{margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.hidden{display:none!important}

/* ===== 最終UI v2: 1画面で「今・次・休み」が読める。文字の大小と余白で階層をつくり、枠・影・色を最小化 ===== */
:root{--bg:#fbfbfd;--shadow:none;--lw:2.7em}
@media (prefers-color-scheme:dark){:root{--bg:#000}}
main{padding:2px 20px 8px}
body{padding-bottom:env(safe-area-inset-bottom)}
#banners:empty{display:none}
.nav{background:var(--nav);border-bottom:0;padding:calc(10px + env(safe-area-inset-top)) 20px 8px}
.nav h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.nav .sub{font-size:12px;font-weight:500;margin-top:0}
.adm-btn{appearance:none;border:0;background:transparent;color:var(--label2);font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:32px}
.adm-btn:active{background:var(--fill)}
.adm-btn.on{color:var(--blue)}
.adm-btn.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
.card{box-shadow:none;border:.5px solid var(--sep);border-radius:18px}
.stack>*+*{margin-top:0}
.stack>*:empty{display:none}
#pPick>.who-pick>*+*{margin-top:14px}
.who-pick .suggest{background:transparent;border-radius:0;border-top:.5px solid var(--sep)}
.empty{padding:28px 0;font-weight:500;font-size:15px}
.banner{border-radius:12px}
/* 自分: 1行目に状況(青=出番/橙=休み)、2行目に次の出番。ブロックにしない */
.status{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:10px 0 4px;background:transparent!important;box-shadow:none!important;border-radius:0;color:var(--label)}
.status .k{font-size:12px;font-weight:600;color:var(--label2);opacity:1}
.status .v{font-size:20px;font-weight:700;letter-spacing:-.02em}
.status .s{flex-basis:100%;font-size:13px;font-weight:500;color:var(--label2);margin-top:1px;line-height:1.4}
.status.play .v,.status.next .v{color:var(--blue)}
.status.rest .v{color:var(--orange)}
.status.idle .v{color:var(--label)}
.status.flash{animation:flash2 3.5s ease-out}
@keyframes flash2{0%,40%{background:var(--orange-t)}100%{background:transparent}}
/* 試合ボード: 現在(主役) > 次(一段下げる) > 休み(小さく)。左端の揃い(--lw)で「コートN/ペア/ラベル」を縦に揃える */
.board{margin-top:0}
.blk{padding:16px 0;border-top:.5px solid var(--sep)}
.board>.blk:first-child{border-top:0;padding-top:8px}
.sec-h{font-size:12px;font-weight:600;color:var(--label2);letter-spacing:.04em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-g{font-weight:500;color:var(--label3)}
.gno{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.cts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 24px;margin-top:12px}
.ct{display:grid;grid-template-columns:var(--lw) 1fr;align-items:baseline;column-gap:6px}
.ct>.ct-h{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--label2);margin-bottom:0}
.ct>.vs{grid-column:2}
.tl{font-size:10px;font-weight:600;color:var(--label3);letter-spacing:.04em}
.tm{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.3;display:flex;align-items:center;flex-wrap:wrap;margin:0 0 0 -8px}
.tm .nm{padding:1px 8px}
.vs{font-size:10px;font-weight:700;color:var(--label3);letter-spacing:.14em;margin:0;line-height:1.7;text-align:left}
.ct.mine,.nx.mine{border-left:3px solid var(--blue);padding-left:12px;margin-left:-15px}

<div id="app"></div>

<script type="module">
/* =========================================================
   バド対戦表 — 名前記憶・履歴付き 組み合わせ / コート管理
   DB: Firestore。名簿は既存「バドミントン管理」の members を読み取り専用で利用（memberId＝docID）。
       当日の状態は bm_sessions/{date}（+ attendees/{memberId}）、設定は bm_config。bm_members は旧データ（参照しない）
   ?mock=1 でローカル保存モード（Firestoreに一切書き込まない動作確認用）
   ========================================================= */
const MOCK = new URLSearchParams(location.search).has('mock');
const firebaseConfig = { // Firebase Webの設定値は公開前提（アクセス制御は Firestore ルールで行う）
  apiKey: "AIzaSyCldmf_WfKx2BubIg91vc79cLzlGrAzpH4",
  authDomain: "newwbc-a6e29.firebaseapp.com",
  projectId: "newwbc-a6e29",
  storageBucket: "newwbc-a6e29.firebasestorage.app",
  messagingSenderId: "1022221182643",
  appId: "1:1022221182643:web:b73a31c9aa447bdb7bf2c6"
};

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) { // textContent 経由のみ＝XSS安全
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const memStore = {};
const lsGet = k => { try { const v = localStorage.getItem(k); return v == null ? (memStore[k] ?? null) : v; } catch { return memStore[k] ?? null; } };
const lsSet = (k, v) => { memStore[k] = v; try { localStorage.setItem(k, v); } catch {} };
const lsDel = k => { delete memStore[k]; try { localStorage.removeItem(k); } catch {} };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch { return memStore['s' + k] ?? null; } };
const ssSet = (k, v) => { memStore['s' + k] = v; try { sessionStorage.setItem(k, v); } catch {} };
const ssDel = k => { delete memStore['s' + k]; try { sessionStorage.removeItem(k); } catch {} };

/* ---------- データ層（Firestore / Mock 切替） ---------- */
let DB;
async function initDB() {
  if (MOCK) {
    const MK = 'bm_mock_db', subs = new Set();
    const load = () => { try { return JSON.parse(localStorage.getItem(MK) || '{}'); } catch { return {}; } };
    const fire = () => subs.forEach(f => f());
    if (!Object.keys(load()).some(k => k.startsWith('members/'))) { // デモ用の仮名簿（本番には書かない）
      const d0 = load(); for (let i = 1; i <= 18; i++) d0['members/demo' + pad(i)] = { name: 'デモ' + pad(i), order: i, createdAt: 0 };
      localStorage.setItem(MK, JSON.stringify(d0));
    }
    addEventListener('storage', e => { if (e.key === MK) fire(); });
    DB = {
      sub(path, cb, isCol) {
        const key = path.join('/');
        const f = () => { const db = load(); if (isCol) cb(Object.keys(db).filter(k => k.startsWith(key + '/') && k.split('/').length === path.length + 1).map(k => ({ id: k.split('/').pop(), ...db[k] }))); else cb(db[key] ?? null); };
        subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
      },
      async commit(ops) {
        const db = load();
        for (const o of ops) {
          const key = o.path.join('/');
          if (o.op === 'del') delete db[key];
          else { const cur = db[key] || {}, d = { ...o.data }; for (const k in d) if (d[k] && d[k].__inc !== undefined) d[k] = (cur[k] || 0) + d[k].__inc; db[key] = { ...cur, ...d }; }
        }
        localStorage.setItem(MK, JSON.stringify(db)); fire();
      },
      async read(p) { const v = load()[p.join('/')]; return v === undefined ? null : JSON.parse(JSON.stringify(v)); },
      async tx(fn) { // 読んで確認してから書く（競合時は fn が CONFLICT を投げて中止）。書き込みは最後にまとめて適用
        if (window.__bmFault) { const f = window.__bmFault; window.__bmFault = null; if (f.before) f.before(); throw Object.assign(new Error(f.code), { code: f.code }); } // デモ確認用の疑似エラー（?mock=1 のみ）
        const db = load(), writes = [];
        const api = { get: async p => { const v = db[p.join('/')]; return v === undefined ? null : JSON.parse(JSON.stringify(v)); }, set: (p, data) => writes.push({ op: 'set', path: p, data }), del: p => writes.push({ op: 'del', path: p }) };
        const r = await fn(api); await DB.commit(writes); return r;
      }
    };
    return;
  }
  const A = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const F = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const U = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const app = A.initializeApp(firebaseConfig), fs = F.getFirestore(app), auth = U.getAuth(app);
  try { await U.signInAnonymously(auth); } catch (e) { console.warn('anon auth failed', e); }
  const conv = d => { const o = {}; for (const k in d) o[k] = (d[k] && d[k].__inc !== undefined) ? F.increment(d[k].__inc) : d[k]; return o; };
  DB = {
    sub(path, cb, isCol, onErr) {
      const ref = isCol ? F.collection(fs, ...path) : F.doc(fs, ...path);
      return F.onSnapshot(ref, { includeMetadataChanges: true }, s => { const fc = s.metadata.fromCache; if (isCol) cb(s.docs.map(d => ({ id: d.id, ...d.data() })), fc); else cb(s.exists() ? s.data() : null, fc); }, e => { console.error(e); onErr && onErr(e); });
    },
    async commit(ops) {
      const b = F.writeBatch(fs);
      for (const o of ops) { const ref = F.doc(fs, ...o.path); if (o.op === 'del') b.delete(ref); else b.set(ref, conv(o.data), { merge: true }); }
      await b.commit();
    },
    async read(p) { const sn = await F.getDocFromServer(F.doc(fs, ...p)); return sn.exists() ? sn.data() : null; },
    async tx(fn) { // Firestore transaction: 読み取りを先に行い、条件を満たすときだけ書く（競合時は fn が CONFLICT を投げて中止）
      return F.runTransaction(fs, async t => fn({
        get: async p => { const sn = await t.get(F.doc(fs, ...p)); return sn.exists() ? sn.data() : null; },
        set: (p, data) => t.set(F.doc(fs, ...p), conv(data), { merge: true }),
        del: p => t.delete(F.doc(fs, ...p))
      }));
    }
  };
}

/* ---------- 状態 ---------- */
const S = { date: todayStr(), members: [], memberMap: {}, session: null, atts: [], attMap: {}, config: undefined,
  ready: { m: false, s: false, a: false, c: false }, err: null, me: null, isAdmin: false, sel: null, pairSel: null, open: {}, loginShown: false,
  offline: typeof navigator !== 'undefined' && navigator.onLine === false, stale: false, everServer: false, flash: null };
const maxCourts = () => { const v = S.config && S.config.maxCourts; return Number.isInteger(v) && v >= 1 ? Math.min(v, 2) : 2; }; // 金曜=最大2面（3面は非対応）
const noteConn = fc => { if (fc === false) { S.everServer = true; S.stale = false; } else if (fc === true && S.everServer) S.stale = true; };
try { S.me = JSON.parse(lsGet('bm_me') || 'null'); } catch { S.me = null; }
const setMe = me => { S.me = me; me ? lsSet('bm_me', JSON.stringify(me)) : lsDel('bm_me'); };
const nameOf = id => (S.memberMap[id] && S.memberMap[id].name) || (S.attMap[id] && S.attMap[id].name) || '？';
const isAdminRoute = () => location.hash === '#admin';

/* ---------- UI 部品 ---------- */
function toast(msg, ms = 2600) { const t = h('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), ms); }
function sheet({ title, msg, input, actions }) {
  return new Promise(res => {
    const inp = input ? h('input', { class: 'input', type: input.type || 'text', inputmode: input.inputmode, placeholder: input.placeholder || '', maxlength: input.maxlength || 40, value: input.value || '', autocomplete: 'off' }) : null;
    const close = v => { ov.remove(); res(v); };
    const ov = h('div', { class: 'ov', onclick: e => { if (e.target === ov) close(null); } },
      h('div', { class: 'sheet' }, h('h3', null, title), msg ? h('p', null, msg) : null, inp,
        h('div', { class: 'acts' }, actions.map(a => h('button', { class: 'btn block ' + (a.cls || ''), onclick: () => close({ value: a.value, text: inp ? inp.value : '' }) }, a.label)))));
    document.body.append(ov); if (inp) setTimeout(() => inp.focus(), 60);
  });
}
function actionSheet(title, actions) { // iOS標準のアクションシート（下からスライド）
  return new Promise(res => {
    const close = v => { ov.remove(); res(v); };
    const ov = h('div', { class: 'as-ov', onclick: e => { if (e.target === ov) close(null); } },
      h('div', { class: 'as' },
        h('div', { class: 'as-g' }, h('div', { class: 'as-t' }, title), actions.map(a => h('button', { class: 'as-b', type: 'button', onclick: () => close(a.value) }, a.label))),
        h('div', { class: 'as-g' }, h('button', { class: 'as-b bold', type: 'button', style: 'border-top:0', onclick: () => close(null) }, 'キャンセル'))));
    document.body.append(ov);
  });
}
const segCache = {};
function seg(id, options, value, onChange, cls = '') { // スライド式セグメント（要素を再利用しアニメを維持）
  const idx = Math.max(0, options.findIndex(o => o.v === value));
  let el = segCache[id];
  if (!el || el._n !== options.length) {
    el = h('div', { class: 'seg ' + cls }, h('div', { class: 'thumb' }));
    el._n = options.length;
    options.forEach((o, i) => el.append(h('button', { class: 'seg-b', onclick: () => el._cb(options[i].v) }, o.t)));
    segCache[id] = el;
  }
  el._cb = onChange; el.style.setProperty('--n', options.length); el.style.setProperty('--i', idx);
  [...el.querySelectorAll('.seg-b')].forEach((b, i) => { b.classList.toggle('on', i === idx); b.textContent = options[i].t; });
  return el;
}

/* ---------- 出席・名簿ロジック ---------- */
function eligibleIds() {
  return S.atts.filter(a => a.present !== false && a.status === 'active' && !(a.restLeft > 0) && !a.forcedRest).map(a => a.id);
}
function presentAtts() { return S.atts.filter(a => a.present !== false); }
async function enterAttendee(m) { // 本日の参加にする（名簿 members は書かない。名前は当日のスナップショットとして保存）
  await guard(() => DB.commit([{ op: 'set', path: ['bm_sessions', S.date, 'attendees', m.id], data: { name: m.name, status: 'active', restLeft: 0, forcedRest: false, present: true, joinedAt: Date.now() } }]));
}
async function guard(fn) { try { await fn(); } catch (e) { if (e && e.conflict) { toast('他の端末で状態が更新されました。画面を更新してください', 4600); return; } console.error(e); toast('保存に失敗しました。通信または権限を確認してください', 4200); S.err = S.err || '保存に失敗: ' + (e.code || e.message); renderAll(); } }
// 「次へ」等の transaction。同じ試合IDを他端末が先に確定した場合、Rules は permission-denied を返す。
// サーバー上の状態が押した時点から変わっていると確認できたときだけ競合として扱い、それ以外の拒否・通信エラーは従来どおりエラーにする
async function txRace(fp0, fn) {
  try { return await DB.tx(fn); }
  catch (e) {
    if (e && e.code === 'permission-denied') { let moved = false; try { moved = fpOf(await DB.read(sessPath())) !== fp0; } catch (_) {} if (moved) throw CONFLICT(); }
    throw e;
  }
}
// Adminの自動「次の組」更新。書き込む瞬間にサーバー上のセッションを読み直し、終了済み・進行済み・手動調整済みなら何も書かない（遅延書き込み対策）
async function autoSetNext(n, fp0) {
  try {
    await DB.tx(async tx => {
      const d = await tx.get(sessPath());
      if (!d || d.status === 'closed' || fpOf(d) !== fp0 || (d.next && d.next.manual)) return;
      tx.set(sessPath(), { next: n });
    });
  } catch (e) { if (e && e.code === 'permission-denied') return; console.error(e); } // 終了直後など書けない状態は黙ってスキップ（次の再描画で再判定される）
}
const patchAtt = (id, data) => guard(() => DB.commit([{ op: 'set', path: ['bm_sessions', S.date, 'attendees', id], data }]));
const patchSession = data => guard(() => DB.commit([{ op: 'set', path: ['bm_sessions', S.date], data }]));

/* ---------- 確定試合の一次データ（bm_games: 1試合=1ドキュメントの追記型。削除せず status で管理） ---------- */
const CONFLICT = () => Object.assign(new Error('conflict'), { conflict: true });
const isoNow = () => new Date().toISOString();
const sessPath = () => ['bm_sessions', S.date];
const gameId = n => `${S.date}_${pad(n)}`;
const fpOf = d => d ? `${d.gameNo || 0}|${(d.history || []).length}|${(d.current && d.current.startedAt) || ''}|${d.status || 'open'}` : 'none'; // 画面を開いた時点の状態の指紋（競合検知用）
function buildGame(round, no, sess, o) { // 確定試合のドキュメント。memberId と名前スナップショットの両方を保存
  const locks = (sess && sess.locks) || [], nm = id => nameOf(id);
  const flag = id => { const a = S.attMap[id]; return !a ? 'notPresent' : a.present === false ? 'removed' : a.status === 'left' ? 'left' : a.forcedRest ? 'forcedRest' : null; }; // 確定時点で早退・休憩・出席取消になっていた人（組には入っていたが実際は出ていない可能性）
  const person = (id, extra) => { const f = flag(id); return { id, name: nm(id), ...extra, ...(f ? { statusAtConfirm: f } : {}) }; };
  const team = ids => { const fixed = locks.some(l => ids.includes(l.a) && ids.includes(l.b)); return ids.map(id => person(id, { fixed })); };
  const inRound = new Set([...round.courts.flatMap(c => [...c.a, ...c.b]), ...round.bench]);
  const absent = S.atts.filter(a => a.present !== false && !inRound.has(a.id)).map(a => ({ id: a.id, name: nm(a.id), reason: a.status === 'left' ? 'left' : a.forcedRest ? 'forcedRest' : a.restLeft > 0 ? 'restLeft' : 'notInRound' }));
  const d = { schema: 1, sessionId: S.date, date: S.date, gameNo: no, status: o.status, startedAt: round.startedAt || null,
    courts: round.courts.map((c, i) => ({ court: i + 1, teamA: team(c.a), teamB: team(c.b) })),
    bench: round.bench.map(id => person(id)), absent, maxCourts: maxCourts(), courtsOverride: (sess && sess.courtsOverride) || null,
    manualAdjusted: !!round.adj, voidCount: { __inc: o.status === 'voided' ? 1 : 0 } };
  if (o.confirmedAt) d.confirmedAt = o.confirmedAt;
  if (o.status === 'voided') { d.voidedAt = o.at; d.lastVoidedAt = o.at; d.voidReason = o.reason; } else { d.voidedAt = null; d.voidReason = null; }
  if (o.backfilled) d.backfilled = true;
  return d;
}
const voidPatch = (at, reason) => ({ status: 'voided', voidedAt: at, lastVoidedAt: at, voidReason: reason, voidCount: { __inc: 1 } }); // 既存の記録は消さず「取消」にするだけ

/* ---------- 組み合わせ生成 ---------- */
const pk = (x, y) => [x, y].sort().join('|');
function computeStats(session, includeCurrent) {
  const games = {}, last = {}, pc = {}, oc = {}, inc = (o, k) => { o[k] = (o[k] || 0) + 1; };
  const rounds = [...(session.history || [])]; if (includeCurrent && session.current) rounds.push(session.current);
  rounds.forEach((r, idx) => (r.courts || []).forEach(c => {
    [...c.a, ...c.b].forEach(id => { games[id] = (games[id] || 0) + 1; last[id] = idx; });
    inc(pc, pk(c.a[0], c.a[1])); inc(pc, pk(c.b[0], c.b[1]));
    c.a.forEach(x => c.b.forEach(y => inc(oc, pk(x, y))));
  }));
  // 連続休み数: bench（参加可能だったが選ばれなかった人）に連続して入っているROUND数。強制休憩・restLeft・帰宅・未参加は bench に入らないので自動でリセットされる
  const benches = rounds.map(r => new Set(r.bench || [])), streak = {};
  benches.forEach(b => b.forEach(id => { if (streak[id] !== undefined) return; let k = 0; for (let i = benches.length - 1; i >= 0 && benches[i].has(id); i--) k++; streak[id] = k; }));
  return { games, last, pc, oc, n: rounds.length, streak };
}
function makeSig(ids, override, locks) { return [ids.slice().sort().join(','), override || 0, (locks || []).map(l => pk(l.a, l.b)).sort().join(',')].join('|'); }
function genRound(elig, stats, locks, override, mc = 2) {
  const maxC = Math.min(mc, Math.floor(elig.length / 4), override || mc);
  for (let c = maxC; c >= 1; c--) { const r = tryRound(elig, c, stats, locks); if (r) return r; }
  return null;
}

    for (let i = 0; i < h.length; i++) exs.push(await tx.get(['bm_games', gameId(h[i].no || i + 1)]));
    h.forEach((rd, i) => { const no = rd.no || i + 1; tx.set(['bm_games', gameId(no)], exs[i] ? voidPatch(at, 'reset') : buildGame(rd, no, d, { status: 'voided', at, reason: 'reset', backfilled: true })); });
    tx.set(sessPath(), { current: null, next: null, history: [], gameNo: 0, locks: [] });
    S.atts.forEach(a => tx.set(['bm_sessions', S.date, 'attendees', a.id], { restLeft: 0, forcedRest: false }));
  })); toast('リセットしました');
}
async function changePin() {
  const r = await sheet({ title: 'PINを変更', input: { type: 'password', inputmode: 'numeric', maxlength: 8, placeholder: '新しいPIN（4〜8桁）' }, actions: [{ label: '変更する', cls: 'primary', value: 'ok' }, { label: 'キャンセル', cls: 'plain', value: 'x' }] });
  if (!r || r.value !== 'ok') return; const pin = r.text.trim(); if (!/^\d{4,8}$/.test(pin)) return toast('4〜8桁の数字で入力してください');
  const ph = await hashPin(pin); await guard(() => DB.commit([{ op: 'set', path: ['bm_config', 'admin'], data: { pinHash: ph, updatedAt: Date.now() } }])); ssSet('bm_admin_ok', ph); toast('PINを変更しました');
}

function renderAll() {
  S.isAdmin = !!S.config && !!S.config.pinHash && ssGet('bm_admin_ok') === S.config.pinHash; // 内部のadmin判定（PIN認証）は従来どおり
  const app = $('#app');
  if (!app.querySelector('main')) app.replaceChildren(h('header', { class: 'nav' }, h('div', { class: 'nav-in' }, h('div', null, h('h1', null, 'バド対戦表'), h('div', { class: 'sub', id: 'navSub' })), h('button', { class: 'adm-btn', id: 'navAdmin', type: 'button', onclick: () => { if (S.isAdmin) { const t = $('#pAdmin'); t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } else openAdminLogin(); } }, 'Admin'))), h('div', { id: 'banners', style: 'max-width:560px;margin:12px auto 0;padding:0 16px' }), h('main', { id: 'view' }));
  $('#navSub').textContent = `${S.date.replace(/-/g, '/')}${MOCK ? '　デモモード' : ''}`; $('#navAdmin').classList.toggle('on', !!S.isAdmin);
  const bn = [];

  $('#banners').replaceChildren(...bn);
  const off = S.offline ? '📵 オフラインです。表示が古い可能性があります' : S.stale ? '⚠ サーバーと通信できていません。表示が古い可能性があります' : '';
  let bar = $('#offbar'); if (off && !bar) { bar = h('div', { id: 'offbar', class: 'offbar' }); document.body.append(bar); } if (bar) { if (off) bar.textContent = off; else bar.remove(); }
  const view = $('#view');
  renderParticipant(view); // 全員共通のメイン画面（Adminにだけ下部に運営エリアが加わる）
  if (isAdminRoute() && !S.isAdmin && S.ready.c && !S.loginShown) { S.loginShown = true; openAdminLogin(); } // URL末尾 #admin でAdminログインのシートを開く
  adminAuto();
}
let unsubs = [];
function startSubs() {
  unsubs.forEach(u => u()); unsubs = []; S.ready = { m: false, s: false, a: false, c: false };
  const err = e => { S.err = e.code || e.message; renderAll(); };
  unsubs.push(DB.sub(['members'], (l, fc) => { noteConn(fc); // 既存「バドミントン管理」の名簿（読み取り専用）。memberId＝ドキュメントID
    S.members = l.filter(m => typeof m.name === 'string' && m.name.trim()).sort((x, y) => (x.order ?? 1e9) - (y.order ?? 1e9) || (x.name > y.name ? 1 : -1));
    S.memberMap = Object.fromEntries(S.members.map(m => [m.id, m])); S.ready.m = true; S.err = null; renderAll(); }, true, err));
  unsubs.push(DB.sub(['bm_sessions', S.date, 'attendees'], (l, fc) => { noteConn(fc); S.atts = l; S.attMap = Object.fromEntries(l.map(a => [a.id, a])); S.ready.a = true; renderAll(); }, true, err));
  unsubs.push(DB.sub(['bm_sessions', S.date], (d, fc) => { noteConn(fc); S.session = d; S.ready.s = true; renderAll(); }, false, err));
  unsubs.push(DB.sub(['bm_config', 'admin'], (d, fc) => { noteConn(fc); S.config = d; S.ready.c = true; renderAll(); }, false, err));
}
addEventListener('online', () => { S.offline = false; renderAll(); }); addEventListener('offline', () => { S.offline = true; renderAll(); });
