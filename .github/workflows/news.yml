name: ニュース自動配信

on:
  schedule:
    - cron: '0 0,6,12 * * *' # 日本時間 9:00, 15:00, 21:00
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存パッケージをインストール
        run: |
          pip install feedparser requests

      - name: ニュース・マーケット情報を取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
        run: |
          python scripts/fetch_news.py
