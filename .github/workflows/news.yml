name: ニュース自動配信

on:
  schedule:
    # 30分ごと(準リアルタイム配信。新着が無い実行はDiscord送信自体をスキップする)
    # 毎時0分・30分ちょうどは世界中のワークフローが集中し遅延・スキップされやすいため、
    # GitHub公式の推奨に従い3分・33分にオフセットしている。
    - cron: "3,33 * * * *"
  workflow_dispatch: {}  # 手動実行用ボタン(Actionsタブから即時テスト可能)

permissions:
  contents: write  # state/news_seen.json(既送信記録)のコミット用

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fetch-news
      cancel-in-progress: false  # 30分間隔の実行が重ならないようにする
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: ニュース・マーケット情報を取得してDiscordへ配信
        env:
          # GitHub Secrets側の実際の登録名は WEBHOOK_NEWS / WEBHOOK_MARKET 等 (DISCORD_プレフィックス無し)。
          # fetch_news.py が読む環境変数名(DISCORD_WEBHOOK_NEWS等)とは別物なので、ここで変換する。
          DISCORD_WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_LOCAL: ${{ secrets.WEBHOOK_LOCAL }}
          DISCORD_WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
          DISCORD_WEBHOOK_SPORTS_CULTURE: ${{ secrets.WEBHOOK_SPORTS_CULTURE }}
        run: python scripts/fetch_news.py

      - name: 既送信記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/news_seen.json
          git diff --cached --quiet || git commit -m "ニュース既送信記録を更新"
          git pull --rebase origin main
          git push
