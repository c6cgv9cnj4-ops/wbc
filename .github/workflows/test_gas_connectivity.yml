name: GAS疎通テスト(ダミーデータ)

on:
  workflow_dispatch: {}  # 手動実行専用。定期実行はしない。

jobs:
  test-dummy-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r price_bot/requirements.txt

      - name: ダミーデータをGASウェブアプリへ送信
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
        working-directory: price_bot
        run: python scripts/test_dummy_push.py
