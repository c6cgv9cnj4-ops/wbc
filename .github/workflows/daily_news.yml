name: Daily News Notification

on:
  schedule:
    # 毎朝7:00 JST (日本時間) に自動実行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリを直接インストール
        run: |
          pip install feedparser requests google-genai youtube-transcript-api

      - name: ニュース取得・要約・Discord送信を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
