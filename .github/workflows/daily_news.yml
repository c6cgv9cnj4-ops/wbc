name: Daily News Notification

on:
  schedule:
    # 毎朝7:00 JST (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: |
          pip install feedparser requests google-genai youtube-transcript-api beautifulsoup4

      - name: チャンネル別ニュース配信を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
          WEBHOOK_LOCAL: ${{ secrets.WEBHOOK_LOCAL }}
          WEBHOOK_SPORTS_CULTURE: ${{ secrets.WEBHOOK_SPORTS_CULTURE }}
          WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
        run: |
          python main.py
