name: 市場朝夕サマリー (#webhook_market)

on:
  # 平日の朝夕に自動実行(Gemini無料枠: 1日2回想定)。cron は UTC 表記。
  # 平日朝 JST 08:15 = UTC 前日 23:15 (日〜木) / 平日夕 JST 16:15 = UTC 07:15 (月〜金)
  schedule:
    - cron: "15 23 * * 0-4"
    - cron: "15 7 * * 1-5"
  workflow_dispatch: {}   # 手動実行(Actionsタブ・gh workflow run)は従来どおり

permissions:
  contents: write  # state/market_intelligence_state.json(既読記録)のコミット用

jobs:
  market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: market-intelligence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          pip install yfinance

      - name: 市場朝夕サマリーを生成してDiscordへ配信
        env:
          DISCORD_WEBHOOK_MARKET: ${{ secrets.WEBHOOK_MARKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_market_intelligence.py

      - name: 既読記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/market_intelligence_state.json
          git diff --cached --quiet || git commit -m "市場朝夕サマリーの既読記録を更新"
          git push origin HEAD:${{ github.ref_name }} || true
