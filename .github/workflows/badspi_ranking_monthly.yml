name: badspi 世界ランキング 月次スナップショット

# 取得URLは config/badminton_results.json の badspi_ranking_urls（5種目。2026-11-06 に実HTMLで確認した正規URL）。
# 基準年の扱い: ページには年が無い（「11月3日付」）。次のいずれかで年を独立に確認できた場合のみ保存する。
#   (a) HTTP の Last-Modified の年月が保存対象の年月と一致 / (b) 人が --confirm-year-source と --confirm-year で確認。
#   どちらも無い場合は [HOLD]（保存しない）。古いページを実行年で誤登録しない。
#   2026-11-06 時点の確認では Last-Modified は返されていないため、この workflow は現状では保存せず [HOLD] のみ出る。
# 1種目の失敗は他種目を止めない。既存の完全版は上書きされず、不完全版は .incomplete.json に別保存される。
# 状態は専用ブランチ badminton-results-state（state/badspi_ranking/ 配下）に保存する。

on:
  schedule:
    - cron: "0 1 * * 1"   # 毎週月曜 01:00 UTC（JST 10:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badspi-ranking-monthly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: コードを取得（main）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 状態ブランチが無ければ初期化（既存は変更しない）
        run: bash scripts/ensure_state_branch.sh
        env:
          STATE_BRANCH: badminton-results-state

  snapshot:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: コードを取得（main）
        uses: actions/checkout@v4

      - name: 状態ブランチを取得（state_branch フォルダへ）
        uses: actions/checkout@v4
        with:
          ref: badminton-results-state
          path: state_branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: 世界ランキングを取得・保存（基準月が実行月と一致する場合のみ）
        run: |
          YM=$(date -u +%Y-%m)
          echo "対象年月（実行時点のUTC月）: ${YM}"
          python scripts/badspi_ranking_snapshot.py --year-month "${YM}" --snapshot-dir state_branch/state/badspi_ranking

      - name: 状態ブランチへ保存（state/badspi_ranking の JSON のみ・競合時は取り込み直して再試行）
        if: always()
        working-directory: state_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -d state/badspi_ranking ]; then
            echo "保存対象なし（基準月不一致などで未作成）"
            exit 0
          fi
          find state/badspi_ranking -name '*.json' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "badspi 世界ランキングのスナップショットを更新"
          for i in 1 2 3; do
            if git push origin HEAD:badminton-results-state; then
              exit 0
            fi
            git pull --rebase origin badminton-results-state || exit 1
          done
          exit 1
