name: badspi 世界ランキング 月次スナップショット

# 取得URLは config/badminton_results.json の badspi_ranking_urls（5種目。2026-11-06 に実HTMLで確認した正規URL）。
# ページには基準年が無い（「11月3日付」）。年は確定せず「年未確認」のまま保存する（年を捏造しない）。
# Last-Modified は公開ページの更新時刻であり、基準日の年の証明にはしない。
# 通知側は保存済みの完全版を参照し、氏名の完全一致の場合のみ順位を表示する（上位15位＋掲載日本選手のみ）。
# 1種目の失敗は他種目を止めない。既存の完全版は上書きされず、不完全版は .incomplete.json に別保存される。
# 状態は専用ブランチ badminton-results-state（state/badspi_ranking/ 配下）に保存する。

on:
  schedule:
    - cron: "0 1 * * 1"   # 毎週月曜 01:00 UTC（JST 10:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badspi-ranking-monthly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: コードを取得（main）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 状態ブランチが無ければ初期化（既存は変更しない）
        run: bash scripts/ensure_state_branch.sh
        env:
          STATE_BRANCH: badminton-results-state

  snapshot:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: コードを取得（main）
        uses: actions/checkout@v4

      - name: 状態ブランチを取得（state_branch フォルダへ）
        uses: actions/checkout@v4
        with:
          ref: badminton-results-state
          path: state_branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: 世界ランキングを取得・保存（年未確認のまま基準月日で保存）
        run: |
          python scripts/badspi_ranking_snapshot.py --snapshot-dir state_branch/state/badspi_ranking

      - name: 状態ブランチへ保存（state/badspi_ranking の JSON のみ・競合時は取り込み直して再試行）
        if: always()
        working-directory: state_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -d state/badspi_ranking ]; then
            echo "保存対象なし（基準月不一致などで未作成）"
            exit 0
          fi
          find state/badspi_ranking -name '*.json' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "badspi 世界ランキングのスナップショットを更新"
          for i in 1 2 3; do
            if git push origin HEAD:badminton-results-state; then
              exit 0
            fi
            git pull --rebase origin badminton-results-state || exit 1
          done
          exit 1
