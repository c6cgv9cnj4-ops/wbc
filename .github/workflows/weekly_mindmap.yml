name: 週次観測（モーニングジャーナル）

# 毎週日曜 20:00 JST に、モーニングジャーナル(直近8週分)を Python で計数して
# 「書いた量・語の新規/増減/不在/継続・表現の出現率」の変化を検出し、Gemini はその観測に
# 対する仮説だけを返す(scripts/weekly_mindmap.py + scripts/journal_observe.py)。
# 出力は Discord #週間まとめ(PNG付き) と スプレッドシート「週次観測」タブのみ。
#
# このリポジトリは公開(PUBLIC)のため、ジャーナル由来の成果物(PNG/語/抜粋)は
# コミットもアーティファクト保存もしない。ログにも件数しか出さない(GITHUB_ACTIONS 判定)。
# (2026-09-26 まで: 4象限マインドマップを mindmap/ へコミットし GitHub Pages で公開していた)

on:
  schedule:
    - cron: "0 11 * * 0"        # 日曜 11:00 UTC = 20:00 JST
  workflow_dispatch:
    inputs:
      week:
        description: "対象週の基準日 YYYY-MM-DD（空なら直近の日曜で終わる週）"
        required: false
        default: ""
      dry_run:
        description: "1 で Sheets 書き込み / Discord 投稿をせずログのみ"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-mindmap
  cancel-in-progress: false

jobs:
  weekly-mindmap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 日本語フォント（PNG の CJK 表示用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 依存パッケージをインストール
        run: pip install -r requirements-weekly.txt

      - name: 週次観測を生成・投稿
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID_MORNING_JOURNAL: ${{ secrets.DISCORD_CHANNEL_ID_MORNING_JOURNAL }}
          DISCORD_CHANNEL_ID_HEALTH: ${{ secrets.DISCORD_CHANNEL_ID_HEALTH }}
          DISCORD_WEBHOOK_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_WEEKLY }}
          DISCORD_CHANNEL_ID_WEEKLY_SUMMARY: ${{ secrets.DISCORD_CHANNEL_ID_WEEKLY_SUMMARY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WEEKLY_SPREADSHEET_ID: ${{ secrets.WEEKLY_SPREADSHEET_ID }}
          GOOGLE_CALENDAR_IDS: ${{ vars.GOOGLE_CALENDAR_IDS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then
            python scripts/weekly_mindmap.py --week "$WEEK"
          else
            python scripts/weekly_mindmap.py
          fi
