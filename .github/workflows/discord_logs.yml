name: Discordログ収集・シート同期・Issues自動起票

# 【プライバシー(2026-09-26)】リポジトリは公開のため、日記(#ヘルス・日報)・個人メモ(#インプット)の
# 本文や、それに由来する要約/画像/HTML は Git にコミットせず、Actions 成果物にも保存しない。
# 保管先は Google スプレッドシート(GAS)のみ。scripts/check_no_personal_data.py が CI で監視する。

on:
  schedule:
    # 毎日 24:00 JST(=翌日0:00 JST) = UTC 15:00
    # 日刊レポート(daily_summary.yml)・週刊レポート(weekly_summary.yml)の
    # どちらが読む生ログも欠かさないよう、ログ収集ステップを単体で日次実行する。
    # daily_summary.ymlはこのジョブのpush完了後(UTC 15:15)に走る。
    - cron: "0 15 * * *"
  workflow_dispatch:   # 手動実行用ボタン
    inputs:
      lookback_days:
        description: "過去分の復元(バックフィル)用: 直近N日を再生成(空なら通常運用。指定時はIssue起票なし)"
        required: false
        default: ""


permissions:
  contents: read    # ログはコミットしない(ランナー内の作業ファイルのみ)
  issues: write      # TODO/BUY投稿のIssue自動起票用

jobs:
  export-and-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Discordログ取得 & Issues自動起票
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID_INPUT: ${{ secrets.DISCORD_CHANNEL_ID_INPUT }}
          DISCORD_CHANNEL_ID_HEALTH: ${{ secrets.DISCORD_CHANNEL_ID_HEALTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: python scripts/export_discord_logs.py

      - name: スプレッドシートへ同期(直近7日を upsert。Git には保存しない)
        env:
          JOURNAL_GAS_WEB_APP_URL: ${{ secrets.JOURNAL_GAS_WEB_APP_URL }}
          JOURNAL_GAS_SHARED_SECRET: ${{ secrets.JOURNAL_GAS_SHARED_SECRET }}
        run: python scripts/sync_weekly_sheet.py
