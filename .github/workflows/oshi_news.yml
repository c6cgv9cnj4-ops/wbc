name: 推しニュース速報(#推し)

on:
  schedule:
    - cron: "38 * * * *"  # 1時間ごと
  workflow_dispatch: {}  # 手動実行用ボタン(Actionsタブから即時テスト可能)

permissions:
  contents: write  # state/oshi_news_seen.json(既送信記録)のコミット用

jobs:
  fetch-oshi-news:
    runs-on: ubuntu-latest
    # 21キーワード×最大3回リトライ(間隔4秒+バックオフ10/20秒)の最悪ケースを
    # 見込んで10分から拡張(2026-08-28、大半のキーワードが503でリトライ
    # した実際の実行が10分近くかかった実績を踏まえた対応)。
    timeout-minutes: 20
    concurrency:
      group: oshi-news
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 推しキーワードの新着ニュースを取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_OSHI: ${{ secrets.WEBHOOK_OSHI }}
        run: python scripts/fetch_oshi_news.py

      - name: 既送信記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/oshi_news_seen.json
          git diff --cached --quiet || git commit -m "推しニュース既送信記録を更新"
          git pull --rebase origin main
          git push
