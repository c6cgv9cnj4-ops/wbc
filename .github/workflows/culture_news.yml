name: カルチャー・テック・国債速報(#webhook_news)

on:
  schedule:
    # 2026-11-04 細川さんの指定により1日1回(朝6時)に変更(旧: 1日3回)。Gemini無料枠の削減が目的。
    - cron: "13 21 * * *"  # JST 6:13 1回のみ
  workflow_dispatch:  # 手動実行用ボタン(Actionsタブから即時テスト可能)
    inputs:
      dry_run:
        description: "確認モード(Discordへ送信せず展覧会リンク検証結果をログ表示)"
        type: boolean
        default: false

permissions:
  contents: write  # state/culture_news_seen.json(既送信記録)のコミット用

jobs:
  fetch-culture-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 国債先物・林信行氏記事・カルチャー系ニュースを取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CULTURE_NEWS_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/fetch_culture_news.py

      - name: 既送信記録をコミット
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/culture_news_seen.json
          git diff --cached --quiet || git commit -m "カルチャー系ニュース既送信記録を更新"
          git pull --rebase origin main
          git push
