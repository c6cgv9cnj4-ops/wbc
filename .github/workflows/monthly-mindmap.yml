name: 月次統合マインドマップ生成

# 月末に、週次スプレッドシート同期(weekly-sheet-sync.yml)が集約した当月分の
# 全ログを読み出し、「事実」と「感情・思考ループ」を厳格に分離した3大ブランチの
# 客観分析マインドマップ(Mermaid + Markdownツリー)を生成する。
# 2026-09-26 停止: 日記由来の要約を公開リポジトリへコミットしていたため、コミットと
# スケジュールを停止(手動実行のみ・出力はランナー内で破棄)。月ごとの変化の観測は
# weekly_mindmap.yml の「🌕 月次観測」(Discord/シート)が引き継ぐ。
# 【プライバシー(2026-09-26)】リポジトリは公開のため、日記(#ヘルス・日報)・個人メモ(#インプット)の
# 本文や、それに由来する要約/画像/HTML は Git にコミットせず、Actions 成果物にも保存しない。
# 保管先は Google スプレッドシート(GAS)のみ。scripts/check_no_personal_data.py が CI で監視する。

on:
  # schedule:  (2026-09-26 停止)
  #   - cron: "0 13 28-31 * *"
  workflow_dispatch: {}  # 手動実行用ボタン。月末判定を無視し常に当月分で検証生成する。

permissions:
  contents: read

concurrency:
  group: monthly-mindmap
  cancel-in-progress: false

jobs:
  monthly-mindmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 月次統合マインドマップ生成(Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOURNAL_GAS_WEB_APP_URL: ${{ secrets.JOURNAL_GAS_WEB_APP_URL }}
          JOURNAL_GAS_SHARED_SECRET: ${{ secrets.JOURNAL_GAS_SHARED_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/generate_monthly_mindmap.py
