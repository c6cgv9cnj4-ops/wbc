name: 精密スポーツ順位表(#webhook_sports_culture)

on:
  schedule:
    - cron: "20 22 * * *"  # 07:20 JST(1日1回。順位表は日次更新で十分なため)
  workflow_dispatch: {}  # 手動実行用ボタン(Actionsタブから即時テスト可能)

permissions:
  contents: read

jobs:
  fetch-sports-standings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: NPB/Jリーグ/F1/MotoGPの順位表を取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_SPORTS_CULTURE: ${{ secrets.WEBHOOK_SPORTS_CULTURE }}
        run: python scripts/fetch_sports_standings.py
