name: Fetch and Post News

on:
  schedule:
    - cron: '0 0,6,12 * * *' # 日本時間 9:00, 15:00, 21:00 に自動実行
  workflow_dispatch: # 手動実行用

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Run news script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
        run: |
          python scripts/news.py
