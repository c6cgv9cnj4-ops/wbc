name: バドミントン速報(注目選手結果+バド×スピ新着) (#推し)

on:
  schedule:
    # 2026-11-04 細川さんの指定により「朝6時の1回のみ」に変更(旧: 日中15分間隔・夜間プール・朝の追加実行)。
    # 1回実行の時刻は JST 06:05 → get_time_band は morning 帯で即時配信する。
    # 夜間プールは今後は空のまま(夜間の実行が無いため)。過去分の残りは同じ実行で朝ダイジェストとして配信される。
    # cron指定はUTC基準(JST = UTC+9)。数分の遅延は配信判定に影響しない(判定はスクリプト側のJST時刻)。
    - cron: "5 21 * * *"       # JST 6:05 1回のみ(morning帯: 即時配信)
  workflow_dispatch:  # 手動実行用ボタン(Actionsタブから即時テスト可能)
    inputs:
      test_favorite_report:
        description: "【一時的テスト用】ダブルス重複配信バグ修正後の表示を擬似データでDiscordへ試し送信する"
        type: boolean
        default: false

permissions:
  contents: write  # state/badminton_alerts_seen.json(既送信記録)・state/badminton_tournament_master.json(大会マスター)のコミット用

jobs:
  fetch-badminton-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: badminton-alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 試合結果ハンドオフを取得（無くても既存配信は従来どおり）
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/badminton_results_handoff.json"
          if git fetch --depth=1 origin badminton-results-data && git show FETCH_HEAD:badminton_results_handoff.json > "$OUT"; then
            echo "試合結果ハンドオフを取得しました"
          else
            echo "[INFO] 試合結果ハンドオフなし（既存配信のみ）"
            rm -f "$OUT"
          fi
          echo "BADMINTON_HANDOFF_PATH=$OUT" >> "$GITHUB_ENV"

      - name: 指定選手の試合結果を取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_OSHI: ${{ secrets.WEBHOOK_OSHI }}  # 2026-09-22、#推しチャンネルへ統合
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 記事本文から試合結果(スコア)を抽出
        run: python scripts/fetch_badminton_alerts.py

      - name: 既送信記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/badminton_alerts_seen.json
          if [ -f state/badminton_tournament_master.json ]; then git add state/badminton_tournament_master.json; fi
          git diff --cached --quiet || git commit -m "バドミントン速報既送信記録を更新"
          git pull --rebase origin main
          git push
