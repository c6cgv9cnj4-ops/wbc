name: バドミントン速報(注目選手結果+バド×スピ新着) (#webhook_sports_culture)

on:
  schedule:
    # 2026-09-06、細川さんの指定により時間帯で頻度を切り替える折衷案に変更。
    # BWFワールドツアーの試合は開催地(アジア〜ヨーロッパ)により時差があるが、
    # JST 9:00〜24:00にほぼ収まることを踏まえ、この帯だけ15分間隔で高頻度
    # 巡回し、試合が行われにくい深夜〜早朝(JST 0:00〜9:00)は従来通り1時間
    # 間隔に抑える(24時間常時高頻度で回す必要はないとの指定)。
    # cron指定はUTC基準(JST = UTC+9)。GitHub Actionsのスケジュール実行は
    # 公式に「指定時刻ちょうどではなく数分単位の遅延がありうる」仕様のため、
    # 実際の間隔は多少前後する。
    - cron: "*/15 0-15 * * *"  # JST 9:00〜24:00(試合が行われやすい時間帯): 15分間隔
    - cron: "43 16-23 * * *"   # JST 1:00〜8:00(深夜〜早朝): 1時間間隔
  workflow_dispatch: {}  # 手動実行用ボタン(Actionsタブから即時テスト可能)

permissions:
  contents: write  # state/badminton_alerts_seen.json(既送信記録)のコミット用

jobs:
  fetch-badminton-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: badminton-alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 指定選手の試合結果を取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_SPORTS_CULTURE: ${{ secrets.WEBHOOK_SPORTS_CULTURE }}
        run: python scripts/fetch_badminton_alerts.py

      - name: 既送信記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/badminton_alerts_seen.json
          git diff --cached --quiet || git commit -m "バドミントン速報既送信記録を更新"
          git pull --rebase origin main
          git push
