name: バドミントン速報(注目選手結果+バド×スピ新着) (#webhook_sports_culture)

on:
  schedule:
    # 2026-09-06、細川さんの指定により時間帯で頻度・配信方式を切り替える
    # 設計に変更。スクリプト側(get_time_band)の帯分けと必ず一致させること。
    # cron指定はUTC基準(JST = UTC+9)。GitHub Actionsのスケジュール実行は
    # 公式に「指定時刻ちょうどではなく数分単位の遅延がありうる」仕様だが、
    # 深夜帯の配信判定はスクリプト側が実行時のJST時刻そのもので判定するため
    # (cronの発火時刻ではなく)、多少の遅延は実害にならない。
    - cron: "*/15 0-13 * * *"  # JST 9:00〜22:59(day、即時配信): 15分間隔
    - cron: "43 14-20 * * *"   # JST 23:00〜05:59(night、配信せずプールのみ): 1時間間隔
    - cron: "5 21 * * *"       # JST 6:05(morning突入直後、プールの朝ダイジェストを配信)
    - cron: "43 22-23 * * *"   # JST 7:00〜8:59(morning、即時配信): 1時間間隔
  workflow_dispatch:  # 手動実行用ボタン(Actionsタブから即時テスト可能)
    inputs:
      test_favorite_report:
        description: "【一時的テスト用】注目選手結果速報の表示フォーマットを擬似データでDiscordへ試し送信する"
        type: boolean
        default: false

permissions:
  contents: write  # state/badminton_alerts_seen.json(既送信記録)のコミット用

jobs:
  fetch-badminton-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: badminton-alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 指定選手の試合結果を取得してDiscordへ配信
        env:
          DISCORD_WEBHOOK_SPORTS_CULTURE: ${{ secrets.WEBHOOK_SPORTS_CULTURE }}
          TEST_FAVORITE_REPORT_PSEUDO: ${{ inputs.test_favorite_report && '1' || '' }}
        run: python scripts/fetch_badminton_alerts.py

      - name: 既送信記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/badminton_alerts_seen.json
          git diff --cached --quiet || git commit -m "バドミントン速報既送信記録を更新"
          git pull --rebase origin main
          git push
