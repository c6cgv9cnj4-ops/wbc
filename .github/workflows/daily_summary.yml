name: 日刊レポート自動生成(停止中)

# 【プライバシー(2026-09-26)】リポジトリは公開のため、日記(#ヘルス・日報)・個人メモ(#インプット)の
# 本文や、それに由来する要約/画像/HTML は Git にコミットせず、Actions 成果物にも保存しない。
# 保管先は Google スプレッドシート(GAS)のみ。scripts/check_no_personal_data.py が CI で監視する。

# ============================================================
# ⚠️ 2026-09-04 停止。スケジュール実行を無効化しました。
#   停止理由: 毎日の schedule 実行が Discord 送信ステップで必ず失敗し
#     (Secrets の DISCORD_WEBHOOK_DAILY が "https://" から始まらず
#      "Invalid URL: No scheme supplied")、失敗通知メールが毎日届いていたため。
#   後継: .github/workflows/weekly-mindmap.yml(週次マインドマップ生成)。
#   再開手順: 下の schedule ブロックのコメントを外し、Secrets の
#     DISCORD_WEBHOOK_DAILY を "https://discord.com/api/webhooks/..." の
#     正しい URL に更新すること。
# ============================================================

on:
  # schedule:
  #   # 毎日 24:15 JST(=翌日0:15 JST) = UTC 15:15
  #   - cron: "15 15 * * *"
  workflow_dispatch: {}  # 手動実行のみ(スケジュール停止中。復旧確認用に残置)

permissions:
  contents: read

jobs:
  summarize-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 入力ログを Discord から取得(ランナー内のみ・Issue起票なし)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID_INPUT: ${{ secrets.DISCORD_CHANNEL_ID_INPUT }}
          DISCORD_CHANNEL_ID_HEALTH: ${{ secrets.DISCORD_CHANNEL_ID_HEALTH }}
          LOG_LOOKBACK_DAYS: "2"
        run: python scripts/export_discord_logs.py

      - name: 日刊サマリー生成(Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
        run: python scripts/generate_daily_report.py
