name: 週次マインドマップ生成

# 直近7日分の #インプット(メモ) / #ヘルス・日報(モーニングジャーナル)ログから、
# 3大ブランチ構造(現実・行動 / 思考・内面 / 課題と翌週のアクション)の
# 週次振り返りマインドマップ(Mermaid + Markdownツリー)を生成し、
# reports/weekly/YYYY-Wxx_mindmap.md にコミットする。
# 旧「日刊レポート自動生成(summarize-day)」の後継。

on:
  schedule:
    # 毎週日曜 21:00 JST = 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch: {}  # 手動実行用ボタン(Actionsタブから即時テスト可能)

permissions:
  contents: write  # reports/weekly への書き込み(コミット)用

concurrency:
  group: weekly-mindmap
  cancel-in-progress: false

jobs:
  weekly-mindmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # コミット後の git pull --rebase を安全にするため全履歴を取得

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 週次マインドマップ生成(Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_WEEKLY }}
        run: python scripts/generate_weekly_mindmap.py

      - name: 生成物をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weekly
          git diff --cached --quiet || git commit -m "週次マインドマップを自動生成 ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
