name: 負傷・離脱アラート(#webhook_sports_culture)

on:
  schedule:
    - cron: "23,53 * * * *"  # 30分ごと(速報性が重要なため)
  workflow_dispatch: {}  # 手動実行用ボタン(Actionsタブから即時テスト可能)

permissions:
  contents: write  # state/injury_alerts_seen.json(既送信記録)のコミット用

jobs:
  fetch-injury-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: injury-alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 負傷・離脱情報を抽出してDiscordへ配信
        env:
          DISCORD_WEBHOOK_SPORTS_CULTURE: ${{ secrets.WEBHOOK_SPORTS_CULTURE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_injury_alerts.py

      - name: 既送信記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/injury_alerts_seen.json
          git diff --cached --quiet || git commit -m "負傷アラート既送信記録を更新"
          git pull --rebase origin main
          git push
